name: rebuild
on:
  schedule: [{cron: "0 20 * * *"}]   # 매일 05:00 KST
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: write}
concurrency: {group: rebuild, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - run: python build.py --check     # assert 가 깨지면 낡은 페이지를 그대로 두는 편이 낫다
      - name: commit if changed
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          git add docs/index.html docs/artifact.html docs/deadlines.ics docs/data.json
          git diff --staged --quiet || git commit -m "chore: rebuild $(date -u +%F)"
          git push
      - name: publish docs to gh-pages
        run: |
          # Pages 소스가 gh-pages 브랜치라 main 커밋만으로는 공개 사이트가 안 바뀐다.
          # 260910: 이 단계가 없어서 재빌드 결과가 공개본에 도달하지 못했다.
          TREE=$(git rev-parse HEAD:docs)
          COMMIT=$(git commit-tree "$TREE" -m "publish: $(git rev-parse --short HEAD)")
          git push --force origin "$COMMIT:refs/heads/gh-pages"
