name: rebuild
on:
  schedule: [{cron: "0 20 * * *"}]   # 매일 05:00 KST
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: write}
concurrency: {group: rebuild, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - run: python build.py --check     # assert 가 깨지면 낡은 페이지를 그대로 두는 편이 낫다
      - name: commit if changed
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          git add docs/index.html docs/artifact.html
          git diff --staged --quiet || git commit -m "chore: rebuild $(date -u +%F)"
          git push
