    url: https://neurips.cc/Conferences/2025/ReviewerGuidelines
    verified: '2026-09-10'
  tiers: [Oral, Spotlight, Poster]
  tier_counts:
    - year: 2025
      submitted: 21575
      accepted: 5290
      rate: 0.2452
      oral: 77
      spotlight: 683
      poster: 4515
      source: https://blog.neurips.cc/2025/09/30/reflections-on-the-2025-review-process-from-the-program-committee-chairs/
      note: >-
        제출·채택·비율은 프로그램 의장 공식 글. 계층 3수는 papercopilot(OpenReview 집계)이고
        합이 5,275 로 공식 채택 5,290 과 15편 차이가 난다.
  tracks:
    - name: Evaluations & Datasets (ED) 트랙
      kind: datasets
      since: 2021
      note: >-
        2021년 Datasets & Benchmarks 로 신설, 2026년부터 Evaluations & Datasets (ED) 로 개명.
        2025년 제출 1,995편.
