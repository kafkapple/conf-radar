# 발표 계층(오랄·하이라이트·스포트라이트·포스터)과 별도 트랙 — 수동 큐레이션.
#
# 왜 수동인가 — 업스트림 둘(ai-deadlines·ccf-deadlines)은 마감과 총 채택 수만 나른다.
# "채택되면 어떤 등급으로 실리는가"와 "포지션·벤치마크 트랙이 따로 있는가"는 아무도 기계가독으로
# 안 준다. 투고처를 고를 때는 이쪽이 총 채택률보다 결정적이다.
#
# 규칙 = neuro.yml 과 같다. 근거 URL 없는 수치는 넣지 않는다. 미공개는 항목을 비우고
# note 로 왜 비었는지 적는다. "미공개"와 "0"은 다른 말이다.
#
# 🔴 업스트림과 어긋나는 값 2건 (2026-09-10 발견). 여기 값이 우선이고, 이유를 적어 둔다.
#   - ICML 2024: 업스트림(csconfstats) accepted 2,609 · 우리 값 2,944.
#     2,609 는 papercopilot 의 **poster 수**와 정확히 일치한다. 업스트림이 오랄·스포트라이트를
#     빠뜨린 것으로 보인다. 총 채택은 2,944(오랄 144 + 스포트라이트 191 + 포스터 2,609).
#   - ACL 2024: 업스트림 943 · 논문(arXiv 2512.04448) 865.
#     long/short 집계 범위가 다른 것으로 보이나 어느 쪽이 무엇인지 확정 못 했다 → 🟡 미해결.
#     업스트림 값을 그대로 두고 여기서는 건드리지 않는다.

meta:
  verified: '2026-09-10'

CVPR:
  tiers: [Oral, Highlight, Poster]
  tier_note: >-
    계층은 개최 2주 전쯤 확정 공개된다. 채택 통보 시점에는 등급이 안 붙는다.
  tier_counts:
    - year: 2025
      accepted: 2878
      highlight: 388
      source: https://papercopilot.com/statistics/cvpr-statistics/
      note: 오랄 수는 공식 집계를 못 찾았다. 채택분의 3.3% 라는 보도만 있다.
  tracks:
    - name: 별도 포지션·데이터셋 트랙 없음
      kind: none
      note: 데이터셋·벤치마크 논문은 본 학회 주제 영역으로 그냥 투고한다.
      source: https://cvpr.thecvf.com/
      verified: '2026-09-10'

NeurIPS:
  tiers: [Oral, Spotlight, Poster]
  tier_counts:
    - year: 2025
      submitted: 21575
      accepted: 5290
      rate: 0.2452
      oral: 77
      spotlight: 683
      poster: 4515
      source: https://blog.neurips.cc/2025/09/30/reflections-on-the-2025-review-process-from-the-program-committee-chairs/
      note: >-
        제출·채택·비율은 프로그램 의장 공식 글. 계층 3수는 papercopilot(OpenReview 집계)이고
        합이 5,275 로 공식 채택 5,290 과 15편 차이가 난다.
  tracks:
    - name: Evaluations & Datasets (ED) 트랙
      kind: datasets
      since: 2021
      note: >-
        2021년 Datasets & Benchmarks 로 신설, 2026년부터 Evaluations & Datasets (ED) 로 개명.
        2025년 제출 1,995편.
      url: https://blog.neurips.cc/2026/03/23/introducing-the-evaluations-datasets-track-at-neurips-2026/
      verified: '2026-09-10'
    - name: Position Paper 트랙
      kind: position
      since: 2025
      note: AI 전반에 대한 관점 논문. 2025년 신설.
      url: https://openreview.net/group?id=NeurIPS.cc/2025/Position_Paper_Track
      verified: '2026-09-10'

