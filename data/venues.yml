# 발표 계층(오랄·하이라이트·스포트라이트·포스터)과 별도 트랙 — 수동 큐레이션.
#
# 왜 수동인가 — 업스트림 둘(ai-deadlines·ccf-deadlines)은 마감과 총 채택 수만 나른다.
# "채택되면 어떤 등급으로 실리는가"와 "포지션·벤치마크 트랙이 따로 있는가"는 아무도 기계가독으로
# 안 준다. 투고처를 고를 때는 이쪽이 총 채택률보다 결정적이다.
#
# 규칙 = neuro.yml 과 같다. 근거 URL 없는 수치는 넣지 않는다. 미공개는 항목을 비우고
# note 로 왜 비었는지 적는다. "미공개"와 "0"은 다른 말이다.
#
# 🔴 업스트림과 어긋나는 값 (2026-09-10).
#   - ICML 2024: 업스트림(csconfstats) accepted 2,609 · 우리 값 2,944.
#     2,609 는 papercopilot 의 **poster 수**와 정확히 일치한다. 업스트림이 오랄·스포트라이트를
#     빠뜨린 것으로 보인다. 총 채택은 2,944(오랄 144 + 스포트라이트 191 + 포스터 2,609).
#   - ACL 2024: 업스트림 943 · 논문(arXiv 2512.04448) 865 → **943 으로 종결(260910)**.
#     독립 집계 두 곳(csconfstats·openaccept.org)이 4,407/943/21.40% 로 일치한다. 논문 쪽 계열은
#     "692 long-paper submissions" 로 시작하는 long 전용 시계열이라 865 는 long 만으로 읽힌다.
#     확정은 아니지만 2대1 이고 범위 설명이 붙으므로 943 을 쓴다.
#
# ⚠️ ACL 은 "본 학회 채택"과 "전체 게재"가 크게 다르다. 2025 = 본 학회 1,699(20.3%) 인데
#    Findings·Industry·Demo 를 합친 전체 게재는 3,091(37.0%) 이다. 다른 넷과 비교할 때는 본 학회 쪽.
#
# deadlines = 업스트림이 아직 안 실어 온 회차 일정. 학회 공식 페이지에서 읽은 것만 넣는다.
#   빌드가 해당 연도 회차에 합쳐 넣고, 같은 (종류, 날짜) 가 이미 있으면 건드리지 않는다.
#
#   🔴 type 은 새로 짓지 말 것. 어휘 정본 = build.py 의 SUBMIT / PHASE / OTHER 이고,
#      그 이름들은 ccf-deadlines 가 쓰는 것을 그대로 가져온 것이다. 우리가 따로 지으면
#      업스트림이 나중에 같은 사실을 실어 올 때 같은 뜻의 이름이 둘 공존한다.
#      어휘에 없는 이름은 `build.py --check` 가 멈춘다 (화면에서 조용히 사라지는 대신).
#
#   화면의 심사 막대는 이 이름들로 구간을 자른다 —
#     제출(abstract·registration → paper → supplementary) · 심사(→ review_release) ·
#     리뷰 숙독(→ rebuttal_start) · 리버틀(→ rebuttal_end·author_response) ·
#     결정 대기(→ notification) · 최종본(→ camera_ready)
#   없는 단계는 안 그린다. notification 이 없으면 막대 자체가 안 생기고 마감 표식만 남는다.
#
# review = 리뷰 공개 수준. 세 단계로만 적는다.
#   open    심사 중부터 논문·리뷰·토론이 공개되고 탈락분도 영구 공개 (ICLR)
#   partial 결정 후 채택분만 공개. 심사 중에는 비공개 (NeurIPS · ICML)
#   closed  리뷰가 공개되지 않음. OpenReview 를 써도 마찬가지 (CVPR · ACL/ARR)

meta:
  verified: '2026-09-10'

