ACL:
  tiers: [Oral, Poster]
  tier_note: >-
    본 학회 채택분은 오랄과 포스터로 갈린다. 그 아래에 Findings 라는 별도 게재 등급이 있어
    "본 학회 채택률"과 "전체 게재율"이 크게 다르다. 다른 네 곳과 비교할 때 주의.
  tracks:
    - name: Findings of ACL
      kind: findings
      since: 2020
      note: 본 학회에 안 실리지만 심사를 통과한 논문의 별도 게재 등급. 발표 슬롯은 없다.
      url: https://aclanthology.org/venues/findings/
      verified: '2026-09-10'
    - name: 특별 주제(Theme) 트랙
      kind: other
      since: 2020
      note: 해마다 주제가 바뀐다. 본 논문과 같은 마감을 쓴다.
      url: https://2026.aclweb.org/calls/main_conference_papers/
      verified: '2026-09-10'
    - name: ARR 필수 경유
      kind: other
      note: 직접 투고가 아니라 ACL Rolling Review 에 먼저 내고 리뷰를 commit 한다.
      url: https://aclrollingreview.org/
      verified: '2026-09-10'
    - name: 별도 포지션·데이터셋 트랙 없음
      kind: none
      note: 자원·평가(Resources and Evaluation)는 본 학회의 주제 영역이지 별도 트랙이 아니다.
      source: https://2026.aclweb.org/calls/main_conference_papers/
      verified: '2026-09-10'
