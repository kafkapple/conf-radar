# Interspeech edition history. Counts are main-track papers (regular and special-session papers sent through the same review;
# Show and Tell and other satellite tracks excluded). 'submitted' = the submission count the TPC chairs report as received;
# the number sent to review is given in the comment when it differs.
# Lineage: first_year follows the Interspeech brand. The 2000 conference (ICSLP 2000, Beijing) is counted as the first INTERSPEECH event
# (Wikipedia: '1st INTERSPEECH event, held as ICSLP'). The earlier series are older: ICSLP began in 1990 (Kobe) and Eurospeech in 1989 (Paris).
# They alternated (ICSLP even years, Eurospeech odd years) and merged into one annual series, named Interspeech from 2004 (ISCA archive: 'Interspeech' series starts 2004;
# 2000-2003 are archived as ICSLP/Eurospeech). Editions 1989-1999 are not listed here.
Interspeech:
  first_year: 2000
  first_year_source: https://en.wikipedia.org/wiki/Interspeech
  editions:
    # 2000: ICSLP 2000. Chairs give only approximate figures (>1200 abstracts, 'near 930' papers), so no exact count is recorded.
    - year: 2000
      sites: ["Beijing, China"]
      submitted: null
      accepted: null
      num_source: https://www.isca-archive.org/icslp_2000/icslp_2000.pdf
      num_evidence: "More than 1200 abstracts were submitted from 47 countries and regions [...] After review, near 930 papers will be include in the proceedings"
      loc_source: https://www.isca-archive.org/icslp_2000/
    # 2001: Eurospeech 2001. Accepted left null: the page states a programme of 672 papers (3 keynotes, 47 ESE, 622 regular), not an accepted count out of 902.
    - year: 2001
      sites: ["Aalborg, Denmark"]
      submitted: 902
      accepted: null
      num_source: https://www.isca-archive.org/eurospeech_2001/eurospeech_2001.pdf
      num_evidence: "we received as many as 902 contributions, which have been thoroughly reviewed by at least two reviewers each [...] the present programme with 672 papers (3 Keynotes, 47 ESE and 622 regular papers)"
      loc_source: https://www.isca-archive.org/eurospeech_2001/
    # 2002: ICSLP 2002. The proceedings front matter on isca-archive.org gives no submission or acceptance count.
    - year: 2002
      sites: ["Denver, USA"]
