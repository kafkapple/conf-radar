# 뇌과학 / 계산신경과학 / NeuroAI / 국내 학회 — 수동 큐레이션
# 스키마 = huggingface/ai-deadlines 와 동일 + 우리 확장 3필드(status/source/verified)
#
# status  : confirmed(공식 공지된 날짜) | estimated(과거 패턴 기반 추정) | tba(미공지)
# source  : 근거 URL. 근거 없는 날짜는 입력 금지.
# verified: 그 URL 을 마지막으로 확인한 날짜
#
# tier    : 관심 우선순위(이 사람 기준). 1=반드시 챙김 2=관련 있음. 학회 등급이 아니다.
# field   : 그룹핑 축. neuro / neuroimaging / cognitive
# scale   : 규모. metric 은 attendees(참가자). AI 학회의 submitted(투고 편수)와 단위가 달라
#           그룹을 넘어 비교하면 안 된다. 근거 URL 없으면 비워 둔다.
#
# 갱신 요령: 연 1회 가을에 전체 훑기 + estimated 가 confirmed 로 바뀌면 즉시 승격.

