<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>학회 레이더</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="학회 레이더">
<meta name="theme-color" content="#0d1014">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 팔레트: 잉크/종이 중립색을 파랑 쪽으로 살짝 치우치게. 색은 두 영역 구분에만 쓴다 —
   AI=인디고, 뇌과학=앰버. 급함(urgent)만 별도 의미색. */
:root{
  --bg:#f6f7f9; --card:#fff; --fg:#161a1f; --dim:#5a6673; --faint:#8d97a4; --line:#e2e6ec;
  --ai:#3055b8; --ai-bg:#e7edfb; --neuro:#9a5a06; --neuro-bg:#fbeed8;
  --urgent:#b8302a; --shadow:0 1px 2px rgba(20,26,34,.06); --veil:rgba(22,26,31,.45);
  --sans:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Segoe UI,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1014; --card:#161a20; --fg:#e4e9ef; --dim:#8a94a2; --faint:#6b7684; --line:#262c35;
  --ai:#7fa3ee; --ai-bg:#1a2438; --neuro:#e0a24e; --neuro-bg:#2c2312;
  --urgent:#f07a70; --shadow:none; --veil:rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#0d1014; --card:#161a20; --fg:#e4e9ef; --dim:#8a94a2; --faint:#6b7684; --line:#262c35;
  --ai:#7fa3ee; --ai-bg:#1a2438; --neuro:#e0a24e; --neuro-bg:#2c2312;
  --urgent:#f07a70; --shadow:none; --veil:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:1000px;margin:0 auto;padding:16px 14px 64px}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0 0 3px}
.sub{color:var(--dim);font-size:12.5px;margin:0 0 12px}
.bars{position:sticky;top:0;background:var(--bg);z-index:6;padding:8px 0 9px;border-bottom:1px solid var(--line)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bar+.bar{margin-top:6px}
.bar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
.bar .lbl{color:var(--faint);font-size:11px;letter-spacing:.03em}
button{font:inherit;font-size:13px;padding:5px 11px;border:1px solid var(--line);border-radius:99px;
  background:var(--card);color:var(--dim);cursor:pointer}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* 「오늘로」 는 상태 토글이 아니라 이동 명령이다. 줄 끝에 묻혀 안 보인다는 지적(260910). */
button.now{border-color:var(--urgent);color:var(--urgent);font-weight:650}
button.now:hover{background:var(--urgent);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
input[type=search]{font:inherit;font-size:13px;padding:5px 10px;border:1px solid var(--line);
  border-radius:99px;background:var(--card);color:var(--fg);flex:1;min-width:110px}
section[hidden]{display:none}

/* ── 마감 목록 ── */
h2.grp{font-size:11.5px;color:var(--dim);font-weight:600;margin:19px 0 7px;letter-spacing:.02em}
.card{box-shadow:var(--shadow);display:flex;gap:11px;align-items:flex-start;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px;cursor:pointer}
.card:hover{border-color:var(--faint)}
.dday{font:600 12px/1.25 var(--mono);font-variant-numeric:tabular-nums;min-width:54px;
  text-align:right;padding-top:3px;color:var(--dim)}
.dday.hot{color:var(--urgent)} .dday.past{opacity:.45}
.body{flex:1;min-width:0}
.name{font-weight:650;font-size:14.5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.star{background:none;border:0;padding:0 2px;font-size:14px;line-height:1;color:var(--faint);cursor:pointer}
.star.on{color:var(--neuro)}
.chip{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:5px;font-weight:600}
.chip.ai{background:var(--ai-bg);color:var(--ai)}
.chip.neuro{background:var(--neuro-bg);color:var(--neuro)}
.chip.t{background:transparent;border:1px solid var(--line);color:var(--dim);font-family:var(--mono)}
.chip.est{background:transparent;border:1px dashed var(--line);color:var(--dim)}
.chip.r{background:transparent;border:1px solid var(--line);color:var(--dim);font-family:var(--mono);font-size:10px}
.chip.p{background:color-mix(in srgb,var(--neuro) 14%,transparent);color:var(--neuro)}
.chip.w{background:color-mix(in srgb,var(--fg) 12%,transparent);color:var(--fg)}
.chip.rv{background:transparent;border:1px solid var(--line);color:var(--dim)}
.chip.rv.open{border-color:var(--ai);color:var(--ai)}
.chip.rv.partial{border-color:var(--line);color:var(--faint)}
.chip.rv.closed{border-color:var(--urgent);color:var(--urgent)}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px}
.sw.h1{background:color-mix(in srgb,var(--ai) 22%,var(--card));outline:1px solid var(--line)}
.sw.h2{background:color-mix(in srgb,var(--ai) 42%,var(--card))}
.sw.h3{background:color-mix(in srgb,var(--ai) 64%,var(--card))}
.sw.h4{background:color-mix(in srgb,var(--urgent) 62%,var(--ai))}
.sw.h5{background:var(--urgent)}
.sw2{display:inline-block;width:16px;height:9px;border-radius:3px;vertical-align:0}
.sw2.rev{background:color-mix(in srgb,var(--fg) 9%,transparent);border:1px solid color-mix(in srgb,var(--fg) 26%,transparent)}
.sw2.meet{background:var(--ai)}
.sw2.act{background:color-mix(in srgb,var(--ai) 60%,transparent);border:1px solid color-mix(in srgb,var(--fg) 26%,transparent)}
.ext{margin-left:7px;font-size:11px;color:var(--ai);text-decoration:none;white-space:nowrap}
.ext:hover{text-decoration:underline}
.meta{color:var(--dim);font-size:12.5px;margin-top:2px}
.meta b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;color:var(--fg)}
/* 규모 = 로그 스케일 막대. 참가자 수와 투고 편수는 단위가 달라 색으로 구분한다. */
.scale{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:11.5px;color:var(--dim)}
.track{flex:0 0 68px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.fill{display:block;height:100%;border-radius:3px}
.fill.submitted{background:var(--ai)} .fill.attendees{background:var(--neuro)}
.scale .n{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--fg);font-weight:600}

/* ── 칸반: 마감 임박도를 열로. 열 자체가 순서라 세로 정렬은 선택한 정렬 기준을 따른다 ── */
.kb{display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.kbcol{flex:0 0 268px;min-width:268px}
.kbhead{font-size:11.5px;font-weight:600;color:var(--dim);padding:0 2px 7px;
  display:flex;justify-content:space-between;align-items:baseline}
.kbhead .c{font-family:var(--mono);color:var(--faint)}
.kbcard{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px;
  margin-bottom:7px;cursor:pointer;box-shadow:var(--shadow)}
.kbcard:hover{border-color:var(--faint)}
.kbcard .top{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.kbcard .dd{font:600 11.5px var(--mono);font-variant-numeric:tabular-nums;color:var(--dim)}
.kbcard .dd.hot{color:var(--urgent)}
.kbcard .nm2{font-weight:650;font-size:13.5px}
.kbcard .sm{color:var(--dim);font-size:11.5px;margin-top:3px}
.kbcard .sm b{font-family:var(--mono);color:var(--fg);font-weight:600}

/* ── 테이블: 훑기용 고밀도 뷰. 정렬은 위 정렬 바를 그대로 쓴다(로직 중복 없음) ── */
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);
  border-radius:10px;background:var(--card)}
table.dense{border-collapse:collapse;width:100%;min-width:780px;font-size:12.5px}
table.dense th{position:sticky;top:0;background:var(--card);color:var(--dim);font-weight:600;
  font-size:11px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.dense th.on{color:var(--fg)}
table.dense td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.dense tr:last-child td{border-bottom:0}
table.dense tbody tr{cursor:pointer}
table.dense tbody tr:hover{background:color-mix(in srgb,var(--fg) 4%,transparent)}
table.dense .n{font-family:var(--mono);font-variant-numeric:tabular-nums}
table.dense td.w{white-space:normal;min-width:150px}

/* ── 지도: equirectangular. 타일 지도는 아티팩트 CSP 가 외부 이미지를 막으므로 쓸 수 없다.
   육지 윤곽을 SVG 로 인라인하면 오프라인·아티팩트·Pages 어디서나 같게 뜬다 ── */
.mapwrap{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow-x:auto;
  -webkit-overflow-scrolling:touch}
.mapwrap svg{display:block;min-width:860px;width:100%;height:auto}
.land{fill:color-mix(in srgb,var(--fg) 9%,transparent);stroke:var(--line);stroke-width:.5}
.pt{cursor:pointer}
.pt circle{stroke:var(--card);stroke-width:1.2}
/* 색 = 개최 빈도. 밝을수록 적고 진할수록 잦다. 분야는 테두리로 남긴다 */
.pt.h1 circle{fill:color-mix(in srgb,var(--ai) 22%,var(--card))}
.pt.h2 circle{fill:color-mix(in srgb,var(--ai) 42%,var(--card))}
.pt.h3 circle{fill:color-mix(in srgb,var(--ai) 64%,var(--card))}
.pt.h4 circle{fill:color-mix(in srgb,var(--urgent) 62%,var(--ai))}
.pt.h5 circle{fill:var(--urgent)}
.pt.neuro circle{stroke:var(--neuro);stroke-width:2}
.pt.mixed circle{stroke:var(--neuro);stroke-width:2;stroke-dasharray:3 2}
.pt.cur .halo{fill:none;stroke:var(--fg);stroke-width:1.6;opacity:.75}
.pt.cur text{fill:var(--fg);font-weight:700}
.cityrow.cur .c{font-weight:700}
.chip.yr{background:color-mix(in srgb,var(--fg) 14%,transparent);color:var(--fg);margin-left:5px}
.pt text{fill:var(--fg);font-size:9px;font-weight:600;paint-order:stroke;
  stroke:var(--card);stroke-width:2.5px;pointer-events:none}
.pt:hover circle{stroke:var(--fg);stroke-width:2}
.citylist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:7px;margin-top:12px}
.cityrow{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 11px;
  cursor:pointer;box-shadow:var(--shadow)}
.cityrow:hover{border-color:var(--faint)}
.cityrow .c{font-weight:650;font-size:13.5px}
.cityrow .l{color:var(--dim);font-size:11.5px;margin-top:2px;line-height:1.45}

/* ── 타임라인: 구글 캘린더 일정 보기식. 막대 하나가 '마감 → 개최 종료' 구간이고
   막대 안에 학회 이름이 들어간다. 점 격자보다 '언제부터 언제까지'가 즉시 읽힌다 ── */
.tl{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow-x:auto;
  -webkit-overflow-scrolling:touch}
/* 월당 최소 폭을 준다. 창 전체를 화면에 욱여넣으면 2년 창의 막대가 서로 붙어 못 읽고,
   가로 스크롤도 안 생긴다 — 내용이 컨테이너보다 좁으면 스크롤바가 없다. */
.tlin{position:relative;min-width:var(--tlw,760px);padding:0 0 10px}
.tlhead{position:sticky;top:0;z-index:3;display:flex;background:var(--card);
  border-bottom:1px solid var(--line)}
.tlhead div{flex:1 0 0;font-size:12px;font-weight:600;color:var(--fg);padding:7px 0 6px 7px;
  border-left:1px solid var(--line);white-space:nowrap;overflow:hidden}
.tlhead div:first-child{border-left:0}
/* 시간 축: 해 경계 = 굵은 세로선 + 칠한 머리칸, 현재 달 = 빨간 머리칸, 짝수 달 = 옅은 줄무늬 */
.tlhead div.yr{border-left:2px solid var(--fg);background:color-mix(in srgb,var(--fg) 9%,var(--card));font-weight:800}
.tlhead div.cur{background:color-mix(in srgb,var(--urgent) 18%,var(--card));color:var(--urgent)}
.tlgrid span.alt{background:color-mix(in srgb,var(--fg) 5%,transparent)}
.tlgrid span.yr{border-left:2px solid var(--fg);opacity:.75}
.tlbody{position:relative}
.tlgrid{position:absolute;inset:0;display:flex;pointer-events:none}
.tlgrid span{flex:1 0 0;border-left:1px solid var(--line);opacity:.55}
.tlgrid span:first-child{border-left:0}
.tlnow{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--urgent);
  opacity:.8;pointer-events:none;z-index:2}
.tlnow::after{content:"Today";position:absolute;top:2px;left:4px;font-size:10.5px;
  background:var(--urgent);color:#fff;padding:1px 5px;border-radius:3px;font-weight:700}
.tlrow{position:relative;height:30px}
.tlrow:nth-child(even){background:color-mix(in srgb,var(--fg) 3%,transparent)}
.tlbar{position:absolute;top:4px;height:22px;border-radius:5px;cursor:pointer;
  display:flex;align-items:center;gap:5px;padding:0 7px;overflow:visible;
  font-size:11.5px;font-weight:650;white-space:nowrap}
/* 막대가 화면 왼쪽 밖에서 시작하면 라벨도 같이 밀려 이름이 안 보였다.
   sticky 로 스크롤 뷰포트 왼쪽에 붙잡아 둔다 — 막대가 화면에 걸쳐 있는 동안 이름이 계속 보인다. */
.tlbar .lab{overflow:hidden;text-overflow:ellipsis;position:sticky;left:calc(var(--namew,112px) + 8px)}
/* 왼쪽 고정 이름 칸. 폭 0 인 sticky 틀에 이름표를 얹어, 막대 배치(%)를 밀지 않는다. */
.tlname{position:sticky;left:0;z-index:4;width:0;height:30px;overflow:visible}
.tlname span{position:absolute;left:0;top:0;height:30px;width:var(--namew,112px);box-sizing:border-box;
  display:flex;align-items:center;padding:0 8px;background:var(--bg);font-size:12px;font-weight:700;
  border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlname span.ai{box-shadow:inset 3px 0 0 var(--ai)} .tlname span.neuro{box-shadow:inset 3px 0 0 var(--neuro)}
#tlctl[hidden]{display:none!important}
.tlrow.sub{height:25px}
.tlrow.sub .tlbar{top:3px;height:19px;font-size:11px}
.tlrow.sub .tlname,.tlrow.sub .tlname span{height:25px}
.tlname span.sub{font-weight:500;color:var(--dim);font-size:11px;padding-left:16px}   /* 인라인 display:contents 가 hidden 속성을 이긴다 */
.tlname.hd{height:auto;align-self:stretch;flex:none}
.tlname.hd span{height:100%;background:var(--card);color:var(--dim);font-weight:600;font-size:11px}
/* 워크샵 막대 — 빗금으로 본 학회 개최와 구분한다 */
.tlbar.k-wsp{background:color-mix(in srgb,#a855f7 12%,transparent);border:1px solid #a855f7;color:var(--fg)}
.tlbar.k-wsp .tlseg.act{background:color-mix(in srgb,#a855f7 55%,transparent)}
.tlbar.k-wsd{background:repeating-linear-gradient(135deg,#a855f7 0 5px,color-mix(in srgb,#a855f7 45%,transparent) 5px 10px);
  border:1px solid #a855f7;color:#fff;font-weight:700}
/* 연간 계획표 */
.plan{margin-top:2px}
.pseasons{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 10px;font-size:12.5px;color:var(--dim)}
.pseasons b{padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.pgrid{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.prow{display:grid;grid-template-columns:clamp(92px,19vw,168px) 1fr;border-top:1px solid var(--line)}
.prow.hd{border-top:0}
.prow.sub{background:color-mix(in srgb,var(--fg) 2.5%,transparent)}
.pnm{padding:6px 8px;font-size:12.5px;font-weight:700;line-height:1.3;border-right:1px solid var(--line)}
.pnm small{display:block;font-weight:500;color:var(--dim);font-size:10.5px}
.prow.sub .pnm{font-weight:500;color:var(--dim);padding-left:14px;font-size:11.5px}
.ptrack{position:relative;min-height:36px}
.pmon{display:flex;height:100%}
.pmon span{flex:1;min-width:0;border-left:1px solid var(--line);font-size:10.5px;color:var(--dim);padding:6px 0 6px 4px;overflow:hidden}
.pmon span:first-child{border-left:0}
.pbg{position:absolute;inset:0;display:flex;pointer-events:none}
.pbg span{flex:1;border-left:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.pbg span:first-child{border-left:0}
.pseg{position:absolute;top:11px;height:15px;border-radius:4px}
.pseg.prep{background:repeating-linear-gradient(135deg,color-mix(in srgb,#e0a100 60%,transparent) 0 5px,color-mix(in srgb,#e0a100 22%,transparent) 5px 10px)}
.pseg.prep2{background:#e0a100}
.pseg.wait{background:color-mix(in srgb,var(--fg) 16%,transparent)}
.pseg.reb{background:#3b82f6}
.pseg.meet{background:#16a34a}
.pseg.wsp{background:color-mix(in srgb,#a855f7 50%,transparent);border:1px solid #a855f7;box-sizing:border-box}
.pseg.wsp.est{border-style:dashed;background:color-mix(in srgb,#a855f7 20%,transparent)}
.pseg.wsd{background:repeating-linear-gradient(135deg,#a855f7 0 4px,color-mix(in srgb,#a855f7 45%,transparent) 4px 8px)}
.pmark{position:absolute;top:0;transform:translateX(-50%);font-size:12px;line-height:1;z-index:2}
.pnow{position:absolute;top:0;bottom:0;border-left:2px solid var(--urgent);opacity:.75;z-index:1}
.plegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--dim);margin:8px 2px;line-height:1.5}
.plegend .pseg{position:static;display:inline-block;width:18px;height:10px;vertical-align:-1px;margin-right:4px}
.pchain{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.pchain th,.pchain td{text-align:left;padding:5px 10px 5px 0;border-bottom:1px solid var(--line);vertical-align:top}
.pchain th{color:var(--dim);font-weight:600}
.pchain .dim{color:var(--dim)}
.tltick{position:absolute;top:3px;bottom:3px;width:2px;margin-left:-1px;background:currentColor;opacity:.55}
.tlbar .out{position:absolute;left:calc(100% + 6px);color:var(--fg);font-weight:650}
.tlbar .out.l{left:auto;right:calc(100% + 6px)}
.tlbar.ai{background:color-mix(in srgb,var(--ai) 26%,transparent);
  border:1px solid color-mix(in srgb,var(--ai) 60%,transparent);color:var(--fg)}
.tlbar.neuro{background:color-mix(in srgb,var(--neuro) 26%,transparent);
  border:1px solid color-mix(in srgb,var(--neuro) 60%,transparent);color:var(--fg)}
.tlbar.est{border-style:dashed}
.tlbar.ghost{background:transparent;border-style:dashed;opacity:.75}
/* 지난 회차 — 색을 빼서 뒤로 물린다. 예전엔 opacity .42 라 글자까지 흐려 연도가 안 읽혔다. */
.tlbar.past{filter:grayscale(.9) brightness(.9)}
/* 심사·리비전 구간과 개최 기간은 성격이 달라 색을 나눈다.
   심사 = 저채도 회색(그 사이에 내가 할 일은 리버틀뿐) · 개최 = 진한 그룹색(가야 하는 날) */
.tlbar.k-rev{background:color-mix(in srgb,var(--fg) 9%,transparent);
  border:1px solid color-mix(in srgb,var(--fg) 26%,transparent);color:var(--dim)}
.tlbar.k-dlonly{background:transparent;border-width:0}
/* 심사 막대 안의 단계 — 저자가 일하는 때(act)만 색을 채운다. 나머지는 기다리는 때. */
.tlseg{position:absolute;top:0;bottom:0;pointer-events:auto}
.tlseg+.tlseg{border-left:1px solid color-mix(in srgb,var(--fg) 34%,transparent)}
.tlbar.ai .tlseg.act{background:color-mix(in srgb,var(--ai) 60%,transparent)}
.tlbar.neuro .tlseg.act{background:color-mix(in srgb,var(--neuro) 60%,transparent)}
.tlbar .lab,.tlbar .out{z-index:2}   /* position 은 건드리지 않는다 — .lab 의 sticky 가 죽는다 */
.tlbar.k-meet{color:#fff;font-weight:700}
.tlbar.ai.k-meet{background:var(--ai);border-color:var(--ai)}
.tlbar.neuro.k-meet{background:var(--neuro);border-color:var(--neuro)}
.tlbar.ghost .lab,.tlbar.ghost .out{color:var(--dim);font-weight:500}
/* 화면 왼쪽 밖에서 시작한 막대 — 왼쪽 모서리를 각지게 해 "이어짐"을 표시 */
.tlbar.trunc{border-left:0;border-radius:0 5px 5px 0}
.tlbar:hover{filter:brightness(1.25)}
/* 날짜 오버레이 — 기본 툴팁은 늦게 뜨고 줄바꿈·시간대 변환을 못 담는다 */
#tlpop{position:fixed;z-index:60;width:max-content;max-width:min(640px,94vw);pointer-events:none;
  background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;
  box-shadow:0 8px 26px rgba(0,0,0,.34);font-size:12px;line-height:1.5}
#tlpop b{font-size:13px}
#tlpop table{border-collapse:collapse;margin:5px 0 2px;width:100%}
#tlpop td{padding:1px 0;vertical-align:top;white-space:nowrap}
#tlpop td:nth-child(2){padding-left:10px;color:var(--dim);font-variant-numeric:tabular-nums}
#tlpop td.k{padding-left:10px;color:var(--ai);font-weight:650;white-space:normal}
#tlpop td .na{color:var(--dim);font-weight:400}
#tlpop tr.mt td{padding-top:4px;border-top:1px solid var(--line)}
#tlpop .pn{color:var(--dim);white-space:normal;margin-top:4px}
/* 분야별 수록 범위 표 */
table.cov{border-collapse:collapse;width:100%;margin:4px 0 8px;font-size:12px}
table.cov th,table.cov td{text-align:left;padding:3px 8px 3px 0;vertical-align:top;
  border-bottom:1px solid var(--line)}
table.cov th{color:var(--dim);font-weight:600}
.ct{display:inline-block;padding:0 6px;margin:1px 2px 1px 0;border-radius:99px;
  border:1px solid var(--line);font-size:11px}
.ct.t1{border-color:color-mix(in srgb,var(--ai) 55%,transparent)}
.ct.t3{color:var(--dim)}
/* 오른쪽 끝의 진한 조각 = 실제 개최 기간. 막대 전체는 마감부터의 준비 구간이다 */
/* 막대 하나에 두 가지가 들어 있다 — 왼쪽 = 제출 마감, 오른쪽 = 실제 개최.
   3px 세로선으로는 안 갈렸다(260910 사용자 신고). 마감은 굵은 블록 + 아래쪽 삼각 표식으로 세운다. */
.tlmeet{position:absolute;top:-1px;bottom:-1px;right:-1px;min-width:7px;border-radius:0 5px 5px 0;
  box-shadow:inset 1px 0 0 var(--card)}
.tlbar.ai .tlmeet{background:var(--ai)} .tlbar.neuro .tlmeet{background:var(--neuro)}
.tlcap{position:absolute;left:-1px;top:-1px;bottom:-1px;width:8px;border-radius:5px 0 0 5px;
  box-shadow:inset -1px 0 0 var(--card)}
.tlcap::after{content:"";position:absolute;left:1px;top:-5px;border:4px solid transparent;
  border-top-color:currentColor}
.tlbar.ai .tlcap{background:var(--ai);color:var(--ai)}
.tlbar.neuro .tlcap{background:var(--neuro);color:var(--neuro)}

/* ── 연간 사이클 ── */
.tl[hidden],.cyc[hidden]{display:none}
.cyc{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:660px;font-size:12.5px}
#v-cyc table{min-width:calc(140px + var(--cols,12) * 44px)}
th,td{padding:0;text-align:center}
thead th{color:var(--dim);font-weight:500;font-size:11px;padding:7px 0;border-bottom:1px solid var(--line)}
th.nm,td.nm{position:sticky;left:0;background:var(--card);text-align:left;padding:0 10px;
  min-width:136px;max-width:136px;border-right:1px solid var(--line);z-index:2}
tbody tr{height:26px;cursor:pointer}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--fg) 3%,transparent)}
tbody tr:nth-child(even) td.nm{background:color-mix(in srgb,var(--fg) 3%,var(--card))}
.nm span.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cell{position:relative;height:26px}
.span{position:absolute;left:0;right:0;top:12px;height:2px;background:var(--line)}
.mk{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:15px;height:15px;
  border-radius:4px;font-size:9px;line-height:15px;color:#fff;font-weight:700}
.mk.dlk{border-radius:50%}
.g-ai .mk{background:var(--ai)} .g-neuro .mk{background:var(--neuro)}
.mk.est{opacity:.45}
.legend{color:var(--dim);font-size:11.5px;margin:8px 2px 0;display:flex;gap:14px;flex-wrap:wrap}

/* ── 정보원 ── */
.srcgrp{margin-bottom:18px}
.srcgrp h3{font-size:12px;color:var(--dim);font-weight:600;margin:0 0 7px;letter-spacing:.02em}
.srcitem{display:block;background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:9px 12px;margin-bottom:6px;text-decoration:none;color:inherit;box-shadow:var(--shadow)}
.srcitem:hover{border-color:var(--faint)}
.srcitem .t{font-weight:600;font-size:14px}
.srcitem .u{font-family:var(--mono);font-size:11px;color:var(--faint);word-break:break-all}
.srcitem .n{color:var(--dim);font-size:12.5px;margin-top:1px}

/* ── 상세 ── */
.veil{position:fixed;inset:0;background:var(--veil);display:flex;align-items:flex-end;
  justify-content:center;z-index:20}
.veil[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;
  border-radius:14px 14px 0 0;padding:18px 18px 32px;border:1px solid var(--line)}
@media(min-width:660px){.veil{align-items:center}.sheet{border-radius:14px}}
.sheet h3{margin:0 0 3px;font-size:18px;font-weight:700}
.sheet .close{position:sticky;top:0;float:right;margin:-4px -4px 0 0}
.dl{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.dl .d{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--dim)}
.dl.done .l,.dl.done .d{opacity:.45;text-decoration:line-through}
.sheet h4{font-size:11.5px;color:var(--dim);font-weight:600;margin:18px 0 6px;letter-spacing:.02em}
.linkrow{display:flex;gap:6px;flex-wrap:wrap}
.linkrow a{font-size:12.5px;padding:5px 11px;border:1px solid var(--line);border-radius:99px;
  background:var(--card);color:var(--fg);text-decoration:none}
.linkrow a:hover{border-color:var(--faint)}
.note{color:var(--faint);font-size:11.5px;margin-top:7px;line-height:1.6}
.lnk{background:none;border:0;padding:0;font:inherit;color:var(--ai);cursor:pointer;text-decoration:underline}
.foot{color:var(--dim);font-size:11.5px;margin-top:26px;line-height:1.7}
.foot a{color:var(--dim)}
.bar.views i{display:none}
.bar.views b{font-weight:inherit}
.bar.views s{display:none;text-decoration:none}

/* ── 폰 UX (≤600px) ─────────────────────────────────────────────────────────
   같은 파일 안에서 CSS 로만 가른다. 프레임워크도, 두 번째 코드베이스도 쓰지 않는다.
   1) 뷰 전환 = 하단 고정 탭바 — 엄지 위치에 맞고, 위쪽 6개 버튼이 두 줄로 깨지지 않는다
   2) 필터·정렬 = 가로 스크롤 한 줄 — 줄바꿈으로 헤더가 화면 절반을 먹던 문제
   3) 지도 = 도시 목록을 위로 — 폰에서 지도 점은 사실상 누를 수 없다            */
@media (max-width:600px){
  .wrap{padding-bottom:74px}
  .bars{padding-top:6px}
  .bar.filters,#bar2{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;padding-bottom:2px}
  .bar.filters::-webkit-scrollbar,#bar2::-webkit-scrollbar{display:none}
  .bar.filters>*,#bar2>*{flex:0 0 auto}
  #q{min-width:120px}

  .bar.views{position:fixed;left:0;right:0;bottom:0;z-index:12;margin:0;gap:0;
    background:var(--card);border-top:1px solid var(--line);
    padding:5px 4px calc(5px + env(safe-area-inset-bottom));
    justify-content:space-around;flex-wrap:nowrap}
  .bar.views button{border:0;background:none;border-radius:9px;padding:5px 4px;flex:1;
    display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;min-width:0}
  .bar.views button[aria-pressed="true"]{background:none;color:var(--vc,var(--ai))}
  .bar.views i{display:block;font-style:normal;font-size:17px;line-height:1}
  .bar.views b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .bar.views button:has(s) b{display:none}
  .bar.views s{display:block;font-weight:600}

  #v-map{display:flex;flex-direction:column}
  #v-map .citylist{order:1;margin-top:0}
  #v-map .bar{order:0}
  #v-map .mapwrap{order:3;margin-top:12px}
  #v-map .legend{order:4}
  .citylist{grid-template-columns:1fr}
  .kbcol{flex:0 0 84vw;min-width:84vw}
  .sheet{max-height:92vh}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* 통계 탭: 범주색은 dataviz 검증 팔레트(light/dark 각각 validate_palette 통과). 이름 직접 표기 + 표 보조 필수 */
:root{--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#4a3aa7;--c8:#e34948}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767}}
/* 보기 구분: 보기마다 고유색(--vc). 버튼 활성 표시와 화면 맨 위 제목 띠가 같은 색이라 지금 어느 보기인지 한눈에 갈린다 */
/* VIEW 줄: 필터 알약과 모양부터 다르게(탭 + 아래 굵은 색 줄). 보기마다 색이 항상 보이고, 선택된 보기는 칠해진다. */
@media (min-width:601px){
  .toprow>.bar.filters{margin-top:8px}
  .bar.views{gap:5px;align-items:flex-end;padding-bottom:0;border-bottom:1px solid var(--line)}
  .bar.views .vlbl{align-self:center;font-weight:700;letter-spacing:.08em;margin-right:2px}
  .bar.views button{border-radius:9px 9px 0 0;border:1px solid var(--line);border-bottom:4px solid var(--vc);
    background:color-mix(in srgb,var(--vc) 5%,var(--card));padding:7px 14px 5px;font-weight:600;font-size:13px}
  .bar.views i{display:inline;font-style:normal;margin-right:5px;color:var(--vc)}
  .bar.views button[aria-pressed="true"]{background:color-mix(in srgb,var(--vc) 26%,var(--card));
    border-color:var(--vc);border-bottom-width:6px;color:var(--fg)}
}
.vhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin:6px 0 10px;padding:7px 12px;
  border-left:5px solid var(--vc);border-radius:0 8px 8px 0;background:color-mix(in srgb,var(--vc) 11%,var(--card))}
.vhead b{font-size:15px;color:var(--fg)}.vhead span{color:var(--dim);font-size:12px}
.stat .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.stat .sc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat .sc b{display:block;font-size:20px}.stat .sc span{color:var(--dim);font-size:12px}
.stat .ch{position:relative;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin:10px 0}
.stat .ch h3{margin:0 0 4px;font-size:14px}.stat .ch p{margin:0 0 6px;color:var(--dim);font-size:12px}
.stat svg{width:100%;height:auto;display:block}.stat svg text{fill:var(--dim);font-size:11px}
.stat svg .ax{stroke:var(--line)}.stat svg .ln{fill:none;stroke-width:2;stroke-linejoin:round}
.stat .tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:6px;
  padding:6px 8px;font-size:12px;box-shadow:var(--shadow);display:none;z-index:3}
.stat .tip b{color:var(--fg)}.stat .lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;margin:4px 0}
.stat .lg i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:4px}
.stat .win button{margin-right:4px}
.stat .picker{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0}
.stat .picker h3{margin:0 0 4px;font-size:13px}.stat .picker p{margin:0 0 6px;color:var(--dim);font-size:12px}
.stat .picker .win{margin:4px 0}.stat .picker button{border:1px solid var(--faint)}
.stat .picker button[aria-pressed="true"]{border-color:var(--fg);font-weight:600}
.stat .scroll{overflow-x:auto}.stat .scroll svg{min-width:100%;width:auto}
.stat table{border-collapse:collapse;font-size:12px}.stat td,.stat th{border-bottom:1px solid var(--line);padding:2px 8px;text-align:right}
</style>
</head>
<body>
<div class="wrap">
<h1>🧠 학회 레이더</h1>
<p class="sub" id="sub"></p>

<div class="bars">
  <div class="toprow">
  <div class="bar views">
    <span class="lbl vlbl">VIEW</span>
    <button data-v="list"><i>▤</i><b>List</b></button>
    <button data-v="kb"><i>▥</i><b>Kanban</b></button>
    <button data-v="tbl"><i>▦</i><b>Table</b></button>
    <button data-v="map"><i>◍</i><b>Map</b></button>
    <button data-v="cyc" aria-pressed="true"><i>◷</i><b>Timeline</b><s>Time</s></button>
    <button data-v="st"><i>▁▃▇</i><b>Stats</b><s>Stats</s></button>
    <button data-v="src"><i>⚑</i><b>Sources</b><s>Src</s></button>
  </div>
  <div class="bar filters">
    <span class="lbl">Field</span>
    <button data-g="all" aria-pressed="true">All</button>
    <button data-g="neuro">Neuro</button>
    <button data-g="ai">AI</button>
    <span class="sep"></span>
    <span class="lbl">Tier</span>
    <button data-t="major" aria-pressed="true" title="CORE A* · Annual · h5 236+ 를 모두 만족하는 5곳">Major</button>
    <button data-t="2">T1-2</button>
    <button data-t="1">T1 only</button>
    <button data-t="3">All tiers</button>
  </div>
  </div>
  <div class="bar" id="bar2">
    <span class="lbl">Sort</span>
    <button data-s="deadline" aria-pressed="true">Deadline</button>
    <button data-s="start">Start date</button>
    <button data-s="scale">Scale</button>
    <button data-s="tier">Tier</button>
    <button data-s="rank">CORE rank</button>
    <button data-s="cycle">Cycle</button>
    <button data-s="field">Field</button>
    <span class="sep"></span>
    <button id="fav">★ Favorites</button>
    <button id="ws" aria-pressed="true">Workshops &amp; tracks</button>
    <button id="sub-only" aria-pressed="true">Submit deadlines only</button>
    <button id="openrev" title="심사 중부터 리뷰가 공개되는 학회만">🔓 Open review</button>
    <input type="search" id="q" placeholder="Search conferences">
  </div>
</div>

<p class="note" id="majornote" hidden>Major = CORE A* · Annual · h5 236+ 를 모두 만족하는 5곳.
  <button class="lnk" data-goto="src">기준과 한계 보기 →</button></p>

<section id="v-list"></section>

<section id="v-kb" hidden><div class="kb"></div></section>

<section id="v-tbl" hidden><div class="tbl"><table class="dense">
  <thead><tr></tr></thead><tbody></tbody></table></div></section>

<section id="v-map" hidden>
  <div class="bar" style="margin-bottom:9px">
    <span class="lbl">Map</span>
    <button data-m="next" aria-pressed="true">Next edition</button>
    <button data-m="all">All years</button>
  </div>
  <div class="mapwrap"></div>
  <p class="legend"><span>색 = Edition 수</span>
    <span class="sw h1"></span><span>1회</span>
    <span class="sw h2"></span><span>2</span>
    <span class="sw h3"></span><span>3</span>
    <span class="sw h4"></span><span>4-5</span>
    <span class="sw h5"></span><span>6회+</span>
    <span>원 크기 = Edition 수</span>
    <span>테두리 = 뇌과학(실선)·혼합(점선)</span>
    <span>바깥 링 + 연도 = 올해 Venue</span>
    <span style="opacity:.7">온라인 Edition은 좌표가 없어 지도에 없다</span></p>
  <div class="citylist"></div>
</section>

<section id="v-cyc" hidden>
  <div class="bar" style="margin-bottom:9px">
    <span class="lbl">Axis</span>
    <button data-c="actual" aria-pressed="true">Timeline</button>
    <button data-c="typical">Typical cycle</button>
    <button data-c="plan" title="Major 5곳의 한 해를 접은 준비 달력">Annual plan</button>
    <span id="tlctl" style="display:contents">
    <span class="sep"></span>
    <span class="lbl">Zoom</span>
    <button data-mo="3" title="한 화면에 약 3개월">Quarter</button>
    <button data-mo="6" title="한 화면에 약 6개월">6 mo</button>
    <button data-mo="12" aria-pressed="true" title="한 화면에 약 1년">1 yr</button>
    <button data-mo="24" title="한 화면에 약 2년">2 yr</button>
    <span class="sep"></span>
    <span class="lbl">Show</span>
    <button data-tm="both" aria-pressed="true" title="Deadline에서 Conference까지 한 막대">Deadline → Conference</button>
    <button data-tm="dl" title="Submit deadline만">Deadline only</button>
    <button data-tm="meet" title="Conference 기간만">Conference only</button>
    <button data-tm="ws" title="부설 Workshop — 논문 창과 Workshop 날 (공식 권장일 또는 추산)">🧩 Workshops</button>
    <span class="sep"></span>
    <span class="lbl">Rows</span>
    <button data-ts="cal" aria-pressed="true" title="전형 Submit deadline이 이른 학회부터 — 1월 ACL·ICML → 5월 NeurIPS → 9월 ICLR → 11월 CVPR">By deadline month</button>
    <button data-ts="next" title="지금부터 가장 먼저 다가오는 일정 순">Upcoming</button>
    <button data-ts="name" title="학회 이름 순">Name</button>
    <span class="sep"></span>
    <button id="tl-now" class="now" title="오늘 위치로 스크롤">↦ Today</button>
    </span>
  </div>
  <div class="tl"><div class="tlin"><div class="tlhead"></div><div class="tlbody"></div></div></div>
  <div class="cyc"><table><thead><tr><th class="nm">학회</th></tr></thead><tbody></tbody></table></div>
  <div class="plan" hidden></div>
  <p class="legend" id="cyc-legend"></p>
</section>

<section id="v-src" hidden></section>
<section id="v-st" class="stat" hidden></section>

<p class="foot" id="foot"></p>
</div>

<div class="veil" id="veil" hidden><div class="sheet" id="sheet"></div></div>

<script>
const DATA = __DATA__;
const TODAY = new Date(new Date().toDateString());
const MONTHS = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
const WD = ["일","월","화","수","목","금","토"];

// 마감 시각을 한국시간으로 옮긴다. AoE(Anywhere on Earth) = UTC-12 이므로 KST 와 21시간 차다 —
// "11/16 마감"이 한국에서는 11/17 저녁까지라는 뜻이고, 이 하루 차이가 실제로 사람을 놓치게 한다.
// 업스트림이 쓰는 표기가 제각각이라(AoE · UTC-12 · UTC-08 · PST · CEST …) 둘 다 훑는다.
const TZNAME = {AoE: -12, PST: -8, PDT: -7, EST: -5, EDT: -4, CET: 1, CEST: 2, KST: 9, UTC: 0, GMT: 0};
function tzHours(tz){
  if (!tz) return null;
  const k = tz.trim();
  if (k in TZNAME) return TZNAME[k];
  const m = /^(?:UTC|GMT)\s*([+-])\s*(\d{1,2})$/.exec(k);
  return m ? (m[1] === "-" ? -1 : 1) * parseInt(m[2], 10) : null;
}
function kstText(d){
  const off = tzHours(d.tz);
  // 시각 표기가 없는 AoE 마감은 그날 23:59 로 본다 — AoE 는 날짜만 적는 것이 관례다.
  const clock = d.t || (off === -12 ? "23:59:00" : "");
  if (off === null || !clock) return "";
  const k = new Date(Date.parse(`${d.date}T${clock}Z`) + (9 - off) * 3600e3);
  const p = n => String(n).padStart(2, "0");
  return `${k.getUTCMonth() + 1}/${k.getUTCDate()}(${WD[k.getUTCDay()]}) ${p(k.getUTCHours())}:${p(k.getUTCMinutes())} KST`;
}
const FIELD = {ml:"머신러닝", vision:"비전·3D", nlp:"자연어·음성", robotics:"로보틱스",
               medical:"의료영상", neuro:"신경과학", neuroimaging:"뇌영상", cognitive:"인지·시지각", neuroai:"NeuroAI·brain-inspired"};
const METRIC = {submitted:"Submitted", attendees:"Attendees"};
const KIND = {shared_review:"공용 Review", journal_option:"저널 연계", journal_invite:"저널 초청",
              society_journal:"학회 저널", none:"제도 없음"};
// 실제로 "내야 하는" 마감. notification·rebuttal·camera_ready 는 그 질문의 답이 아니다.
const SUBMIT = new Set(["abstract","paper","submission","supplementary","abstract_late","registration"]);

// 심사 막대 안을 단계로 자른다. 투고 계획의 실제 질문은 "언제 내나"가 아니라
// "언제 또 손이 가나"다 — 리버틀과 최종본은 저자가 일하는 때이고 나머지는 기다리는 때다.
// 일정 이름은 업스트림(ccf-deadlines) 어휘 그대로 쓴다 (sources.py 의 SUBMIT, build.py 의 PHASE 가 정본).
// 없는 단계는 만들지 않는다. 모르는 구간을 추정해 그리면 화면이 없는 정보를 만든다.
const ACT = ["rebuttal_start","rebuttal_end","author_response","rebuttal_and_revision"];
function phases(e, firstSub){
  const dls = e.deadlines || [];
  const days = t => dls.filter(d => d.type === t).map(d => d.date).sort();
  const one = t => days(t)[0] || null;
  const resp = dls.filter(d => ACT.includes(d.type)).map(d => d.date).sort();
  const rr = one("review_release"), notif = one("notification"), cam = one("camera_ready");
  const close = resp.length ? resp[resp.length - 1] : null;
  // 응답 날짜가 하나뿐이면 그것이 마감이고, 시작은 리뷰가 공개된 날이다.
  const open = resp.length > 1 ? resp[0] : (rr && close && rr < close ? rr : close);
  const lastSub = dls.filter(d => SUBMIT.has(d.type)).map(d => d.date).sort().pop() || firstSub;
  const out = [];
  const add = (from, to, act, name) => { if (from && to && from < to) out.push({from, to, act, name}); };
  // 리뷰 공개일을 안 싣는 학회가 있다. 그럴 때 심사 구간은 응답이 시작되는 날까지로 본다.
  const revStart = rr || open || notif;
  add(firstSub, lastSub, true,  "Submit");        // 초록 → 본문 → 보충. 저자가 아직 쓰는 중
  add(lastSub,  revStart, false, "Review");
  add(rr,       open,    false, "Reading");   // 공개일과 응답 시작이 다른 학회가 있다
  add(open,     close,   true,  "Rebuttal");
  add(close || rr, notif, false, "Decision");
  add(notif,    cam,     true,  "Camera-ready");
  return out;
}
const RANKORD = {"A*":0, "A":1, "B":2, "C":3};

const FAV_KEY = "confradar:fav";
const loadFav = () => { try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY)) || []); }
                        catch { return new Set(); } };
const saveFav = s => { try { localStorage.setItem(FAV_KEY, JSON.stringify([...s])); } catch {} };
// 마지막으로 고른 확대 배율을 기억한다(이 브라우저에만). 기본 = 1년.
const MO_KEY = "conf-radar:months";
const loadMo = () => { try { const m = +localStorage.getItem(MO_KEY); return [3, 6, 12, 24].includes(m) ? m : 12; }
                       catch { return 12; } };

// rank = 등급 필터 하나. "major" 또는 티어 상한(1·2·3). 메이저를 별도 토글로 두면 티어와
// AND 로 걸려서, T1·2 를 눌러도 메이저 5곳만 남는 화면이 된다(260910 사용자 신고).
const state = {view:"cyc", group:"all", rank:"major", sort:"deadline", q:"", subOnly:true,
               favOnly:false, withWs:true, openRev:false,
               mapMode:"next", cycMode:"actual", statWin:10, months:loadMo(), tlMode:"both", tlSort:"cal", fav:loadFav()};

const days  = iso => Math.floor((new Date(iso+"T23:59:59") - TODAY)/864e5);  // 마감 = 그날 끝, 오늘 = 0
const until = iso => Math.floor((new Date(iso+"T00:00:00") - TODAY)/864e5);  // 개최 = 그날 시작
const fmt   = iso => iso.slice(2).replace(/-/g,".");
const num   = n => n.toLocaleString("en-US");
const dday  = n => n === 0 ? "오늘" : `D-${n}`;
const esc   = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dlsOf = c => state.subOnly ? c.deadlines.filter(d => SUBMIT.has(d.type)) : c.deadlines;
const nextDl = c => dlsOf(c).find(d => days(d.date) >= 0) || null;
const meetState = c => { if (!c.start) return "";
  const a = until(c.start), b = until(c.end || c.start);
  return a >= 0 ? `Conference ${dday(a)}` : (b >= 0 ? "진행 중" : "종료"); };
// 차기 회차가 공지되지 않은 학회의 대체 표시. 과거 회차에서 유도한 전형 시기다.
const typicalText = c => {
  const t = c.typical;
  const d = t.deadline_month ? `${t.deadline_month}월 Deadline` : "Deadline 표본 없음";
  return `전형 ${d} · ${t.meeting_month}월 Conference (${t.years[0]}-${t.years[1]}, ${t.n_meeting}회)`;
};

// 규모 막대는 지표별 로그 스케일. 650~30,000 을 선형으로 그리면 작은 학회가 전부 0 이 된다.
const SPAN = {submitted:[500, 30000], attendees:[300, 40000]};
function scalePct(sc){
  const [lo,hi] = SPAN[sc.metric] || [1,1e5];
  const p = (Math.log10(sc.value) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo));
  return Math.max(6, Math.min(100, Math.round(p*100)));
}
// 준비 착수선 = 마감 8주 전. 학회가 공지하는 값이 아니라 고정 경험칙이므로 화면에 그대로 적는다.
// 마감순 정렬이 곧 준비 착수순이다(상수를 뺀 것이라 순서가 같다) — 정렬을 따로 만들지 않는다.
const PREP_DAYS = 56;
function prepLine(c, d){
  if (d){
    const left = days(d.date) - PREP_DAYS;
    if (left > 0){
      // UTC 로 계산한다. 로컬 자정에서 빼면 toISOString 이 하루 앞 날짜를 돌려준다(KST 에서 실측).
      const iso = new Date(new Date(d.date + "T00:00:00Z") - PREP_DAYS*864e5).toISOString().slice(0,10);
      return `🛠 준비 착수 ${fmt(iso)} (${dday(left)})`;
    }
    return `🛠 <b>지금이 준비 기간</b> — Deadline까지 ${days(d.date)}일`;
  }
  // 차기 마감이 없는 학회(메이저 14곳 중 11곳이 그렇다)는 전형 마감월에서 착수월만 준다.
  // 추정 위의 추정이므로 표본 수를 붙이고 '전형' 이라고 못박는다.
  const m = c.typical.deadline_month;
  if (!m) return "";
  return `🛠 전형 착수 ${((m + 9) % 12) + 1}월 (전형 ${m}월 Deadline, 표본 ${c.typical.n_deadline}회)`;
}

const rankChip = c => c.rank.core ? `<span class="chip r">CORE ${esc(c.rank.core)}</span>` : "";
// 등급은 4단계뿐이라 A* 안의 격차를 못 보여준다. 메이저 경계가 어디서 그어졌는지 보이도록 수치를 같이 낸다.
const h5Chip = c => c.h5
  ? `<span class="chip r" title="Google Scholar h5-index — 최근 5년 인용 지표. Submitted 편수가 아니다">인용 h5 ${c.h5}</span>` : "";
// 카드에서 규모는 "얼마나 내고 얼마나 붙나" 여야 한다. 투고 편수만으로는 절반이다.
const latestStat = c => c.history && c.history.length ? c.history[c.history.length - 1] : null;
// 워크샵은 본 학회와 마감이 완전히 다르다. 어느 학회 부설인지 같이 안 보이면 오해한다.
const wsChip = c => c.kind === "workshop" ? `<span class="chip w">W · ${esc(c.parent)} 부설</span>`
  : c.kind === "track" ? `<span class="chip w">T · ${esc(c.parent)} 트랙</span>` : "";
// 계층 이름은 학회마다 다르다(CVPR 하이라이트 · 나머지 스포트라이트). 옮기지 말고 그대로 보인다.
const TIERNAME = {Oral:"오랄", Highlight:"하이라이트", Spotlight:"스포트라이트", Poster:"포스터"};
// 아이콘은 스캔용이다. 뜻은 옆 글자가 지고, 아이콘 혼자로는 아무것도 주장하지 않는다.
const TRACKNAME = {position:"📝 포지션", datasets:"📊 벤치마크·데이터셋", findings:"📑 Findings",
                   other:"기타 트랙", none:"없음"};
const REVIEW = {open:  {icon:"🔓", label:"Review 전면공개"},
                partial:{icon:"◐", label:"Review 부분공개"},
                closed:{icon:"🔒", label:"Review 비공개"}};
const reviewChip = c => c.review && REVIEW[c.review.level]
  ? `<span class="chip rv ${c.review.level}" title="${esc(c.review.note || "")}">${REVIEW[c.review.level].icon} ${REVIEW[c.review.level].label}</span>` : "";
// 투고처를 고를 때 실제로 갈리는 것 셋만 카드에 낸다. 나머지(블로그·주제·ARR)는 상세에서.
const CARD_TRACKS = new Set(["position", "datasets", "findings"]);
const trackChips = c => (c.tracks || []).filter(t => CARD_TRACKS.has(t.kind))
  .map(t => `<span class="chip p" title="${esc(t.name)}">${esc(TRACKNAME[t.kind])}</span>`).join("");
const progChip = c => c.programs.length
  ? `<span class="chip p" title="${esc(c.programs[0].name)}">${esc(KIND[c.programs[0].kind] || "연계")}</span>` : "";

function visible(){
  const q = state.q.trim().toLowerCase();
  return DATA.series.filter(c =>
    (state.group === "all" || c.group === state.group) &&
    (state.rank === "major" ? c.major : c.tier <= state.rank) &&
    (!state.openRev || c.review?.level === "open") &&
    (!state.favOnly || state.fav.has(c.id)) &&
    (state.withWs || c.kind === "conference") &&
    (!q || c.search.includes(q) || (FIELD[c.field]||"").includes(q)));
}

function cardHTML(c){
  const d = nextDl(c), n = d ? days(d.date) : null;
  const dd = d ? dday(n) : (meetState(c) || "미공지");
  const hot = d ? n <= 14 : false;
  const est = d && d.status !== "confirmed";
  const sc = c.scale;
  return `<div class="card" data-id="${c.id}">
    <div class="dday ${hot?"hot":""} ${d?"":"past"}">${dd}</div>
    <div class="body">
      <div class="name">
        <button class="star ${state.fav.has(c.id)?"on":""}" data-fav="${c.id}"
          aria-label="즐겨찾기">${state.fav.has(c.id)?"★":"☆"}</button>
        ${esc(c.title)}${c.next?" "+c.next:""}
        <span class="chip ${c.group}">${c.group==="ai"?"AI":"뇌과학"}</span>
        <span class="chip t">T${c.tier}</span>${wsChip(c)}${rankChip(c)}${h5Chip(c)}${reviewChip(c)}${trackChips(c)}${progChip(c)}
        ${est?`<span class="chip est">${d.status==="tba"?"미공지":"추정"}</span>`:""}
      </div>
      <div class="meta">${d ? `<b>${fmt(d.date)}</b> ${esc(d.label)}${d.tz ? ` <span style="opacity:.7">${esc(d.tz)}</span>` : ""}`
                            : (c.next ? "Submit deadline 종료" : "차기 Edition 미공지")}
        ${c.link ? `<a class="ext" href="${esc(c.link)}" target="_blank" rel="noopener" title="학회 사이트">사이트 ↗</a>` : ""}</div>
      ${prepLine(c, d) ? `<div class="meta">${prepLine(c, d)}</div>` : ""}
      <div class="meta">${c.next ? `📍 ${esc(c.date_text)} · ${esc([c.city,c.country].filter(Boolean).join(", "))}`
                                 : `🔁 ${esc(typicalText(c))}`}</div>
      ${sc?`<div class="scale"><span class="track"><span class="fill ${sc.metric}"
            style="width:${scalePct(sc)}%"></span></span>
            <span>${(() => { const h = latestStat(c);
              return h && h.accepted
                ? `<span class="n">${num(h.submitted)}</span> Submitted → <span class="n">${num(h.accepted)}</span> Accepted (${(h.rate*100).toFixed(1)}%) · ${h.year}`
                : `<span class="n">${num(sc.value)}</span> ${METRIC[sc.metric]} · ${sc.year}`; })()}</span></div>`
        :`<div class="scale"><span class="track"></span><span style="opacity:.6">Scale 미상</span></div>`}
    </div></div>`;
}

// 목록·칸반·표가 같은 정렬 비교자를 공유한다. 뷰마다 정렬을 다시 구현하지 않는다.
function sortedItems(){
  const items = visible().map(c => ({c, d:nextDl(c)}));
  const byDeadline = (a,b) => {
    const A = a.d ? days(a.d.date) : 1e6 + (a.c.start ? until(a.c.start) : 9e4);
    const B = b.d ? days(b.d.date) : 1e6 + (b.c.start ? until(b.c.start) : 9e4);
    return A - B;
  };
  const cmp = {
    start: (a,b) => (a.c.start||"9").localeCompare(b.c.start||"9"),
    tier:  (a,b) => a.c.tier - b.c.tier || byDeadline(a,b),
    field: (a,b) => (FIELD[a.c.field]||"").localeCompare(FIELD[b.c.field]||"") || byDeadline(a,b),
    rank:  (a,b) => (RANKORD[a.c.rank.core] ?? 9) - (RANKORD[b.c.rank.core] ?? 9) || byDeadline(a,b),
    cycle: (a,b) => a.c.typical.meeting_month - b.c.typical.meeting_month || byDeadline(a,b),
    // 규모는 지표가 다르면 비교가 성립하지 않으므로 지표로 먼저 묶고 그 안에서만 큰 순서
    scale: (a,b) => (a.c.scale?0:1) - (b.c.scale?0:1)
                 || (a.c.scale && b.c.scale ? a.c.scale.metric.localeCompare(b.c.scale.metric) : 0)
                 || ((b.c.scale?.value ?? 0) - (a.c.scale?.value ?? 0)),
  }[state.sort] || byDeadline;
  return {items: items.sort(cmp), byDeadline};
}

function renderList(){
  const {items} = sortedItems();
  const bucket = (keyOf, label) => {          // 같은 키끼리 묶되 sortedItems 의 순서를 유지한다
    const m = new Map();
    for (const x of items) (m.get(keyOf(x)) ?? m.set(keyOf(x), []).get(keyOf(x))).push(x);
    return [...m].map(([k, rows]) => [label(k, rows), rows]);
  };
  let groups;
  if (state.sort === "field")      groups = bucket(x => x.c.field, f => FIELD[f] || f);
  else if (state.sort === "tier")  groups = bucket(x => x.c.tier, t => `T${t} — ${["","핵심","인접","참고"][t]}`);
  else if (state.sort === "rank")  groups = bucket(x => x.c.rank.core || "등급 없음",
                                                   k => k === "등급 없음" ? "CORE rank 미부여" : `CORE ${k}`);
  else if (state.sort === "cycle") groups = bucket(x => x.c.typical.meeting_month, m => `${m}월 Conference`);
  else if (state.sort === "scale") groups = bucket(x => x.c.scale?.metric ?? "none",
                    k => k === "none" ? "Scale 미상"
                       : `Scale · ${METRIC[k]}`);
  else if (state.sort === "start") groups = [["By start date", items]];
  else groups = [["🔥 ≤ 2 wk",          items.filter(x => x.d && days(x.d.date) <= 14)],
                 ["1-3 mo", items.filter(x => x.d && days(x.d.date) > 14 && days(x.d.date) <= 92)],
                 ["> 3 mo",            items.filter(x => x.d && days(x.d.date) > 92)],
                 ["Submit closed · Conference upcoming", items.filter(x => !x.d && x.c.next)],
                 ["Next edition TBA (typical timing shown)", items.filter(x => !x.d && !x.c.next)]];
  const html = groups.filter(([,r]) => r.length)
    .map(([label, rows]) => `<h2 class="grp">${esc(label)}</h2>` + rows.map(x => cardHTML(x.c)).join(""))
    .join("");
  document.getElementById("v-list").innerHTML = html || `<p class="meta">${emptyWhy()}</p>`;
}

// 빈 화면은 "없다"로 읽힌다. 왜 비었는지와 무엇을 누르면 되는지까지 적는다.
function emptyWhy(){
  if (state.rank === "major" && state.group === "neuro")
    return "Major는 CORE rank 기반이라 뇌과학 학회가 없다 — Tier를 <b>T1 only</b> 로 바꾸면 뇌과학 대표 학회가 보인다.";
  if (state.rank === "major" && state.favOnly)
    return "Major 5곳 중 별을 켜 둔 학회가 없다.";
  if (state.q) return `검색어 "${esc(state.q)}" 에 걸리는 학회가 없다.`;
  return "지금 필터에 걸리는 학회가 없다.";
}

function renderMap(){
  const W = DATA.world.w, H = DATA.world.h;
  const rows = visible();
  // 도시 단위로 묶는다. 같은 도시의 여러 회차·여러 학회가 한 점이 되어야 읽힌다.
  const cities = new Map(), unlocated = new Set();
  for (const c of rows){
    const eds = state.mapMode === "all" ? c.editions
              : c.editions.filter(e => e.year === (c.next ?? c.next_year));
    // 업스트림 회차(최근 6년) 밖의 옛 회차는 전체 이력(history.yml)에서 가져온다 — 역대 모드에서만
    const old = state.mapMode === "all"
      ? (DATA.fullhist?.[c.title]?.editions ?? []).filter(e => !c.editions.some(x => x.year === e.year)) : [];
    for (const e of [...eds, ...old]) for (const st of e.sites){      // 다지역 동시 개최 = 회차 하나가 점 여럿
      if (st.lat === null){                              // 온라인 회차 = 좌표 없음(정상). 실제 지명인데 없으면 캐시 미스
        if (!/virtual|online|remote/i.test(st.place)) unlocated.add(st.place);
        continue;
      }
      // 좌표를 소수 1자리(~11km)로 묶는다. "Singapore" 와 "Singapore, Singapore" 처럼
      // 표기만 다른 같은 도시가 지오코더에서 미세하게 다른 좌표로 오는 경우가 있다.
      const k = `${st.lat.toFixed(1)},${st.lon.toFixed(1)}`;
      const g = cities.get(k) ?? cities.set(k, {lat:st.lat, lon:st.lon, place:st.place,
                                               places:new Set(), items:[], groups:new Set()}).get(k);
      g.places.add(st.place);
      if (st.place.length < g.place.length) g.place = st.place;   // 가장 짧은 표기를 대표로
      g.items.push({title:c.title, year:e.year, id:c.id, group:c.group});
      g.groups.add(c.group);
    }
  }
  const list = [...cities.values()].sort((a,b) => b.items.length - a.items.length);
  const x = lon => (lon + 180) * W / 360, y = lat => (90 - lat) * H / 180;
  // 색 = 그 도시에서 열린 회차 수(빈도). 크기만으로는 5회와 12회가 안 갈린다.
  // 구간은 고정값이다 — 데이터에 맞춰 자동으로 나누면 갱신될 때마다 같은 도시의 색이 바뀐다.
  // 회차 표본이 6년치라 실측 최댓값이 8이다(밴쿠버). 12+ 같은 구간은 영원히 비므로
  // 실제 분포에 맞춰 1 / 2 / 3 / 4-5 / 6+ 로 자른다.
  const heat = n => n >= 6 ? 5 : n >= 4 ? 4 : n >= 3 ? 3 : n >= 2 ? 2 : 1;
  const YEAR = TODAY.getFullYear();
  const pts = list.map(g => {
    const n = g.items.length, r = Math.min(11, 3.2 + Math.sqrt(n) * 1.9);
    const grp = g.groups.size > 1 ? "mixed" : [...g.groups][0];
    // 올해 열리는(열린) 도시는 따로 표시한다 — 지도에서 제일 먼저 찾는 것이 그것이다.
    const cur = g.items.filter(i => i.year === YEAR);
    // 라벨은 밀도에 따라 줄인다. 유럽처럼 점이 몰린 곳에서 전부 찍으면 서로 겹쳐 못 읽는다.
    const minN = state.mapMode === "all" ? 3 : 1;
    const base = g.place.split(",")[0];
    const label = cur.length ? `${base} ’${String(YEAR).slice(2)}` : (n >= minN ? base : "");
    return `<g class="pt h${heat(n)} ${grp} ${cur.length ? "cur" : ""}" data-city="${esc(g.place)}">
      <title>${esc(g.place)} — ${n}회 · ${g.items.map(i => i.title+" "+i.year).join(", ")}</title>
      ${cur.length ? `<circle class="halo" cx="${x(g.lon).toFixed(1)}" cy="${y(g.lat).toFixed(1)}" r="${(r+4).toFixed(1)}"></circle>` : ""}
      <circle cx="${x(g.lon).toFixed(1)}" cy="${y(g.lat).toFixed(1)}" r="${r.toFixed(1)}"></circle>
      ${label ? `<text x="${x(g.lon).toFixed(1)}" y="${(y(g.lat)-r-(cur.length?7:3)).toFixed(1)}"
        text-anchor="middle">${esc(label)}</text>` : ""}</g>`;
  }).join("");
  document.querySelector("#v-map .mapwrap").innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="학회 Venue 세계 지도">
      <path class="land" d="${DATA.world.paths.join(" ")}"></path>${pts}</svg>`;
  document.querySelector("#v-map .citylist").innerHTML = list.map(g => `
    <div class="cityrow ${g.items.some(i => i.year === YEAR) ? "cur" : ""}" data-city="${esc(g.place)}">
      <div class="c">${esc(g.place)} <span style="color:var(--faint)">${g.items.length}회</span>
        ${g.items.some(i => i.year === YEAR) ? `<span class="chip yr">${YEAR}</span>` : ""}</div>
      <div class="l">${g.items.sort((a,b) => b.year - a.year)
        .map(i => `<span style="color:var(--${i.group})">${esc(i.title)}</span> ${i.year}`).join(" · ")}</div>
    </div>`).join("") || `<p class="meta">표시할 Venue 없음</p>`;
  // 좌표를 못 구한 개최지는 조용히 빠지지 않게 여기 적는다. 고치는 법 = 에이전트에게 아래 문장 전달
  if (unlocated.size) document.querySelector("#v-map .citylist").insertAdjacentHTML("afterbegin",
    `<p class="meta" style="color:var(--urgent)">지도에 못 찍은 ${unlocated.size}곳 — ${[...unlocated].sort().map(esc).join(" · ")}<br>
     고치려면 에이전트에게: 「conf-radar geo 캐시 갱신 (prep.py --geo), 못 찾은 곳은 geo.yml 에 수동 좌표」</p>`);
}

function cycTypical(){   // 반환 = 그린 시리즈 id 목록 (renderCycle 이 빠진 것을 이름으로 적는다)

    `<th class="nm">학회</th>` + MONTHS.map(m => `<th>${m}</th>`).join("");
  document.querySelector("#v-cyc tbody").innerHTML = rows.map(c => {
    const dm = c.typical.deadline_month, mm = c.typical.meeting_month;
    const marks = dm ? [dm, mm] : [mm];
    const lo = Math.min(...marks), hi = Math.max(...marks);
    const cells = MONTHS.map((_,i) => {
      const m = i+1, line = (m > lo && m < hi) ? `<span class="span"></span>` : "";
      if (m === mm) return `<td class="cell">${line}<span class="mk">■</span></td>`;

  }).join("");
  return rows.map(c => c.id);   // 전형 축은 모두 자리를 갖는다 — 빠지는 것이 없다

const addDays = (iso, n) => new Date(Date.parse(iso + "T00:00:00Z") + n * 864e5).toISOString().slice(0, 10);
// 워크샵 창은 학회당 한 해 것만 공지된다(data/venues.yml workshops). 다른 회차는 개최 시작일
// 간격만큼 통째로 옮겨 추산한다 — 워크샵 날짜는 본 학회에 붙어 움직이기 때문이다.
function wsOf(c, e){
  const w = c.ws;
  if (!w || !e.start) return null;
  const ref = c.editions.find(x => x.year === w.year && x.start);
  if (!ref) return null;
  const sh = Math.round((Date.parse(e.start) - Date.parse(ref.start)) / 864e5);
  const mv = iso => iso ? addDays(iso, sh) : null;
  return {paper: w.paper.map(mv), notify: mv(w.notify), days: w.days.map(mv),
          est: w.status !== "confirmed" || sh !== 0, shifted: sh !== 0, source: w.source};
}

// 연간 계획표 — 메이저의 한 해를 접어 "언제 무엇을 하나"를 본다 (260910 사용자 요청: 농사 달력).
// 날짜 = 최근 회차들의 월·일을 **원형 평균**한 전형이지 공지된 날이 아니다. 12월↔1월을 넘나드는
// 통보일(ICLR 12/16·1/25)을 산술평균하면 7월이 나온다 — 그래서 원형이다.
function cycPlan(){
  const Y = 365;
  const doy = iso => { const d = new Date(iso + "T00:00:00Z"); return (d - Date.UTC(d.getUTCFullYear(), 0, 1)) / 864e5; };
  const cmean = xs => {
    if (!xs.length) return null;
    const a = xs.map(x => x / Y * 2 * Math.PI);
    const m = Math.atan2(a.reduce((s, t) => s + Math.sin(t), 0), a.reduce((s, t) => s + Math.cos(t), 0));
    return (m / (2 * Math.PI) * Y + Y) % Y;
  };
  const md = d => { const t = new Date(Date.UTC(2001, 0, 1) + Math.round(d) * 864e5); return `${t.getUTCMonth() + 1}/${t.getUTCDate()}`; };
  const gap = (a, b) => ((b - a) % Y + Y) % Y;          // a 다음에 b 가 오기까지 며칠

  const plans = DATA.series.filter(c => c.major).map(c => {
    const eds = c.editions.filter(e => e.year >= TODAY.getFullYear() - 4);
    const all = (types, last) => eds.map(e => {
      const ds = (e.deadlines || []).filter(d => types.includes(d.type)).map(d => d.date).sort();
      return ds.length ? doy(last ? ds[ds.length - 1] : ds[0]) : null;
    }).filter(x => x !== null);
    const first = all([...SUBMIT]);
    const w = c.ws;
    return {c, n: first.length, dl: cmean(first), sub: cmean(all([...SUBMIT], true)),
            rr: cmean(all(["review_release"])), reb: cmean(all(ACT, true)), notif: cmean(all(["notification"])),
            ms: cmean(eds.filter(e => e.start).map(e => doy(e.start))),
            me: cmean(eds.filter(e => e.start).map(e => doy(e.end || e.start))),
            ws: w && {p0: doy(w.paper[0]), p1: doy(w.paper[1]), n: w.notify ? doy(w.notify) : null,
                      d0: doy(w.days[0]), d1: doy(w.days[1]), est: w.status !== "confirmed"}};
  }).filter(p => p.dl !== null).sort((a, b) => a.dl - b.dl);

  const seg = (a, b, cls, name) => {
    if (a == null || b == null) return "";
    const len = gap(a, b) || 2;
    const parts = a + len <= Y ? [[a, a + len]] : [[a, Y], [0, a + len - Y]];
    return parts.map(([x, y]) => `<span class="pseg ${cls}" title="${esc(name)}"
      style="left:${(x / Y * 100).toFixed(2)}%;width:${Math.max(0.5, (y - x) / Y * 100).toFixed(2)}%"></span>`).join("");
  };
  const mark = (d, icon, name) => d == null ? "" :
    `<span class="pmark" style="left:${(d / Y * 100).toFixed(2)}%" title="${esc(name)}">${icon}</span>`;
  const bg = `<div class="pbg">${MONTHS.map(() => "<span></span>").join("")}</div>`;
  const today = `<div class="pnow" style="left:${(doy(TODAY.toISOString().slice(0, 10)) / Y * 100).toFixed(2)}%"></div>`;

  // 네 번의 시즌 — 마감월로 묶는다. 손으로 적지 않고 데이터에서 센다.
  const byM = new Map();
  for (const p of plans){
    const m = new Date(Date.UTC(2001, 0, 1) + Math.round(p.dl) * 864e5).getUTCMonth() + 1;
    byM.set(m, [...(byM.get(m) || []), p.c.title]);
  }
  const seasons = [...byM.entries()].map(([m, ts]) => `<b>📮 ${m}월 ${ts.map(esc).join("·")}</b>`).join(" → ");

  const rows = plans.map(p => {
    const main = seg(p.dl - 56, p.dl, "prep", `✍️ 준비 8주 (${md(p.dl - 56)}~${md(p.dl)})`)
      + seg(p.dl, p.sub, "prep2", `📮 Submit (${md(p.dl)}~${md(p.sub)})`)
      + seg(p.sub, p.rr ?? p.reb ?? p.notif, "wait", "⏳ Review")
      + (p.rr != null && p.reb != null && gap(p.rr, p.reb) < 60 ? seg(p.rr, p.reb, "reb", `💬 Rebuttal (${md(p.rr)}~${md(p.reb)})`) : "")
      + seg(p.reb ?? p.rr, p.notif, "wait", "⏳ Decision")
      + seg(p.ms, p.me, "meet", `🎤 Conference (${md(p.ms)}~${md(p.me)})`)
      + mark(p.dl, "📮", `Submit deadline ${md(p.dl)}`) + mark(p.notif, "📨", p.notif == null ? "" : `Notification ${md(p.notif)}`)
      + mark(p.ms, "🎤", `Conference ${md(p.ms)}`);
    const sub = !p.ws ? "" : seg(p.ws.p0, p.ws.p1, "wsp" + (p.ws.est ? " est" : ""),
        `🧩 Workshop 논문 ${md(p.ws.p0)}${p.ws.p1 !== p.ws.p0 ? "~" + md(p.ws.p1) : ""}${p.ws.est ? " (추산)" : ""}`)
      + (p.ws.n != null ? seg(p.ws.p1, p.ws.n, "wait", "⏳ Workshop 결정 대기") : "")
      + seg(p.ws.d0, p.ws.d1, "wsd", `🧩 Workshop ${md(p.ws.d0)}~${md(p.ws.d1)}`)
      + mark(p.ws.p1, "📝", `Workshop 논문 Deadline ${md(p.ws.p1)}${p.ws.est ? " (추산)" : ""}`)
      + mark(p.ws.d0, "🧩", `Workshop ${md(p.ws.d0)}~${md(p.ws.d1)}`);
    const order = [`📮 ${md(p.dl)}`, p.notif != null ? `📨 ${md(p.notif)}` : "", p.ms != null ? `🎤 ${md(p.ms)}` : ""]
      .filter(Boolean).join(" → ");
    const wsOrder = p.ws ? `📝 ${md(p.ws.p1)} → 🧩 ${md(p.ws.d0)}` : "";
    return `<div class="prow"><div class="pnm">${esc(p.c.title)}<small>${order} · n=${p.n}</small></div>
        <div class="ptrack">${bg}${main}${today}</div></div>`
      + (sub ? `<div class="prow sub"><div class="pnm">↳ 🧩 Workshops<small>${wsOrder} · ${p.ws.est ? "추산" : "공식 권장일"}</small></div>
        <div class="ptrack">${bg}${sub}${today}</div></div>` : "");
  }).join("");

  // 떨어지면 다음은? — 통보 다음에 오는 첫 메이저 마감. 통보 3주 안쪽 전에 마감이 있으면
  // "결과를 기다리면 못 내는 곳" 으로 따로 적는다. 실제로 사람이 가장 많이 놓치는 지점이다.
  const chain = plans.filter(p => p.notif != null).map(p => {
    const others = plans.filter(q => q !== p);
    const next = others.slice().sort((a, b) => gap(p.notif, a.dl) - gap(p.notif, b.dl)).find(q => gap(p.notif, q.dl) > 3);
    // 못 내는 곳 = 통보 3주 전 ~ 통보 3일 뒤 사이에 마감이 있는 곳. 통보 이틀 뒤 마감(NeurIPS→ICLR)은
    // 달력상 가능해 보여도 결과를 보고 고쳐 낼 시간이 없다 — 앞선 판정은 이것을 "—" 로 흘렸다.
    const miss = others.filter(q => gap(q.dl, p.notif) <= 21 || gap(p.notif, q.dl) <= 3);
    return `<tr><td><b>${esc(p.c.title)}</b> 📨 ${md(p.notif)}</td>
      <td>${next ? `${esc(next.c.title)} 📮 ${md(next.dl)} <span class="dim">(${Math.round(gap(p.notif, next.dl))}일 뒤)</span>` : "—"}</td>
      <td>${miss.map(q => `${esc(q.c.title)} 📮 ${md(q.dl)} <span class="dim">(${gap(q.dl, p.notif) <= 21
          ? `Notification ${Math.round(gap(q.dl, p.notif))}일 전 Deadline` : `Notification ${Math.round(gap(p.notif, q.dl))}일 뒤 Deadline — 고칠 시간 없음`})</span>`).join("<br>") || "—"}</td></tr>`;
  }).join("");

  document.querySelector("#v-cyc .plan").innerHTML = `
    <div class="pseasons">Major 의 한 해 = ${seasons}</div>
    <div class="pgrid">
      <div class="prow hd"><div class="pnm">학회</div><div class="ptrack"><div class="pmon">${MONTHS.map(m => `<span>${m}</span>`).join("")}</div></div></div>
      ${rows}
    </div>
    <div class="plegend">
      <span><i class="pseg prep"></i>✍️ Prep 8 wk</span><span><i class="pseg prep2"></i>📮 Submit (abstract → paper)</span>
      <span><i class="pseg wait"></i>⏳ Review · Decision</span><span><i class="pseg reb"></i>💬 Rebuttal</span>
      <span>📨 Notification</span><span><i class="pseg meet"></i>🎤 Conference</span>
      <span><i class="pseg wsp"></i>🧩 Workshop paper window</span><span><i class="pseg wsp est"></i>점선 = 추산</span>
      <span><i class="pseg wsd"></i>🧩 Workshop day</span><span style="color:var(--urgent)">▏Today</span>
    </div>
    <table class="pchain"><thead><tr><th>이 학회에서 떨어지면</th><th>다음으로 낼 수 있는 곳</th>
      <th>결과를 기다리면 못 내는 곳</th></tr></thead><tbody>${chain}</tbody></table>
    <div class="plegend">날짜 = 최근 5년 Edition의 월·일 원형 평균(n = 표본 Edition 수). 공지된 날이 아니라 전형이다.
      ✍️ 준비 8주는 경험칙. 🧩 Workshop 창은 NeurIPS·ICML·ICLR 은 학회 공식 권장일, CVPR·ACL 은
      개별 Workshop이 정해 학회 차원 날짜가 없어 전형 창을 추산했다.</div>`;
  return plans.map(p => p.c.id);
}

function cycActual(){
  // 구글 캘린더 일정 보기식 막대. 막대 하나 = 제출 마감 → 개최 종료.
  // 왼쪽 끝 세로선 = 마감, 오른쪽 진한 조각 = 실제 개최 기간, 그 사이 = 심사·준비 구간.
  //
  // 260910 재설계 — 데이터 범위는 36개월(과거 12 + 앞 24)로 **고정**하고, 「기간」 버튼은
  // 자르는 범위가 아니라 **확대 배율**(월당 px)을 바꾼다. 그 전에는 범위를 잘라 화면 폭에
  // 맞췄기 때문에 내용이 컨테이너보다 좁아 가로 스크롤이 아예 안 생겼고, 그래서 범위를
  // 옮기는 버튼을 따로 둬야 했다. 이제 이동 수단은 가로 스크롤 하나다.
  const BACK = 12, FWD = 24, SPAN = BACK + FWD;
  // 「1년」 = 한 화면에 정확히 12개월. 고정 px 표를 쓰면 화면 폭에 따라 10개월만 보이기도 했다.
  // 왼쪽 학회 이름 칸이 막대를 가리므로 그 폭을 빼고 나눈다.
  const vw = document.querySelector("#v-cyc .tl").clientWidth;
  const NAMEW = Math.round(Math.min(124, Math.max(76, vw * 0.2)));
  const PX = vw > 0 ? Math.max(28, (vw - NAMEW) / state.months)
                    : ({3: 240, 6: 130, 12: 86, 24: 46}[state.months] || 86);
  const totalPx = SPAN * PX;
  const t0 = new Date(TODAY.getFullYear(), TODAY.getMonth() - BACK, 1);
  const t1 = new Date(t0.getFullYear(), t0.getMonth() + SPAN, 1);
  const span = t1 - t0;
  const pct = iso => ((new Date(iso + "T00:00:00") - t0) / span) * 100;
  const cols = Array.from({length: SPAN}, (_, i) =>
    new Date(t0.getFullYear(), t0.getMonth() + i, 1));
  const now = pct(TODAY.toISOString().slice(0, 10));

  // 회차 단위로 막대를 만든다. 시리즈에 붙어 있는 start/deadlines 는 차기 회차 것뿐이라,
  // 그것만 쓰면 과거 구간이 비어 버린다.
  const bars = [];
  // 부설 워크샵 — 본 학회 바로 아래 ↳ 줄(sub)에 그린다. 같은 줄에 얹으면 NeurIPS 워크샵 마감(8/29)이
  // 본 심사 막대(5/4→9/24) 한가운데 떨어져 겹친다. 창은 학회당 한 해 것만 공지되므로
  // 다른 회차는 개최일 간격만큼 옮겨 추산한다.
  const pushWs = (c, e) => {
    const w = wsOf(c, e);
    if (!w) return;
    const pEnd = w.paper[1] > w.paper[0] ? w.paper[1] : addDays(w.paper[0], 3);
    const ph = [{from: w.paper[0], to: pEnd, act: true, name: "Workshop 논문"},
                ...(w.notify ? [{from: pEnd, to: w.notify, act: false, name: "Decision"}] : [])];
    const a = pct(w.paper[0]), z = pct(ph[ph.length - 1].to), d0 = pct(w.days[0]), d1 = pct(w.days[1]);
    if (z > 0 && a < 100)
      bars.push({c, e, sub: true, dl: {date: w.paper[0], type: "paper", status: "confirmed", p: a}, kind: "wsp", ph, ws: w,
                 from: Math.max(0, a), to: Math.min(100, Math.max(z, a + 0.15)), past: z < now, trunc: a < 0});
    if (d1 > 0 && d0 < 100)
      bars.push({c, e, sub: true, dl: null, kind: "wsd", ws: w, ms: d0, me: d1,
                 from: Math.max(0, d0), to: Math.min(100, Math.max(d1, d0 + 0.15)), past: d1 < now, trunc: d0 < 0});
  };
  for (const c of visible()) for (const e of c.editions){
    const subs = (e.deadlines || []).filter(d => SUBMIT.has(d.type)).sort((x, y) => x.date < y.date ? -1 : 1);

    if (state.tlMode === "ws"){ pushWs(c, e); continue; }
    if (state.tlMode === "dl"){
      // 회차 하나 = 막대 하나(첫 마감 → 마지막 마감). 마감마다 막대·라벨을 따로 달면
      // 초록·본문·보충이 며칠 간격이라 글자가 서로 겹쳐 깨졌다 (260910 사용자 신고).
      if (!subs.length) continue;
      const a = pct(subs[0].date), z = pct(subs[subs.length - 1].date) + 5 / (SPAN * 30.4) * 100;
      if (z <= 0 || a >= 100) continue;
      bars.push({c, e, dl: {...subs[0], p: a}, subs, from: Math.max(0, a), to: Math.min(100, z),
                 ms: null, me: null, past: z < now, dlOnly: true, trunc: a < 0});
      continue;
    }
    if (state.tlMode === "meet"){                  // 개최만 — 회의 기간만
      if (!e.start) continue;
      const ms = pct(e.start), me = pct(e.end || e.start);
      if (me <= 0 || ms >= 100) continue;
      bars.push({c, e, dl: null, from: Math.max(0, ms), to: Math.min(100, Math.max(me, ms + 0.15)),
                 ms, me, past: me < now, trunc: ms < 0});
      continue;
    }
    // 마감→개최를 한 막대로 이으면 7개월짜리 띠가 되어 "그동안 뭔가 진행된다" 로 읽힌다.
    // 실제로 진행되는 것은 심사·리비전(제출 마감 → 통보)뿐이고, 통보 뒤 개최까지는 빈 구간이다.
    // 그래서 둘을 **다른 색 막대 두 개**로 나눈다 (260910 사용자 요청).
    const dl = subs.map(d => ({...d, p: pct(d.date)})).find(d => d.p < 100);
    const ph = phases(e, dl && dl.date);
    const push = (o) => { if (o.to > 0 && o.from < 100) bars.push(o); };

    if (dl){
      // 단계를 하나도 못 얻으면 마감 표식만. 없는 기간을 길게 그리지 않는다.
      const end = ph.length ? pct(ph[ph.length - 1].to) : dl.p + 5 / (SPAN * 30.4) * 100;
      push({c, e, dl, kind: ph.length ? "rev" : "dlonly", ph,
            from: Math.max(0, dl.p), to: Math.min(100, Math.max(end, dl.p + 0.15)),
            past: end < now, trunc: dl.p < 0});
    }
    if (e.start){
      const ms = pct(e.start), me = pct(e.end || e.start);
      push({c, e, dl: null, kind: "meet", ms, me,
            from: Math.max(0, ms), to: Math.min(100, Math.max(me, ms + 0.15)),
            past: me < now, trunc: ms < 0});
    }
    pushWs(c, e);   // 마감→개최 모드에서도 워크샵을 ↳ 줄로 같이 본다 (260910 사용자 요청)
  }

  // 확정 일정이 없는 앞쪽은 과거 주기로 투영한다. 공지된 날이 아니므로 점선 + 표본 수.
  // 확정 마감과 45일 안쪽이면 같은 회차를 두 번 그리는 것이라 버린다. 과거는 투영하지 않는다.
  const pad = n => String(n).padStart(2, "0");
  for (const c of state.tlMode === "ws" ? [] : visible()){
    // 마감만·마감→개최 모드는 전형 마감월을, 개최만 모드는 전형 개최월을 투영한다
    const dm = state.tlMode === "meet" ? c.typical.meeting_month : c.typical.deadline_month;
    if (!dm) continue;
    // 이미 확정된 것과 겹치는 투영은 버린다. c.deadlines 는 차기 회차 것뿐이라 회차 전체를 본다.
    const real = state.tlMode === "meet"
      ? c.editions.filter(e => e.start).map(e => +new Date(e.start + "T00:00:00"))
      : c.editions.flatMap(e => (e.deadlines || []).filter(d => SUBMIT.has(d.type))
                                 .map(d => +new Date(d.date + "T00:00:00")));
    for (let y = t0.getFullYear(); y <= t1.getFullYear(); y++){
      const a = `${y}-${pad(dm)}-01`, b = `${y}-${pad(dm)}-28`;
      if (real.some(r => Math.abs(r - new Date(a + "T00:00:00")) < 45 * 864e5)) continue;
      const gf = pct(a), gt = pct(b);
      if (gt <= now || gf >= 100) continue;
      bars.push({c, ghost: true, from: Math.max(0, gf), to: Math.min(100, gt)});
    }
  }

  // 한 학회 = 한 줄. 막대마다 줄을 하나씩 주면 같은 학회가 여러 줄로 흩어지고 화면이 세 배로 길어진다.
  const byId = new Map();
  for (const b of bars){
    const k = b.c.id + (b.sub ? ":ws" : "");
    const r = byId.get(k) ?? byId.set(k, {c: b.c, sub: !!b.sub, bars: []}).get(k);
    r.bars.push(b);
  }
  const rows = [...byId.values()];
  for (const r of rows){
    r.bars.sort((a, b) => a.from - b.from);
    // 정렬 기준 = 앞으로 다가올 것 중 가장 이른 것. 지난 것만 있으면 맨 아래로 보낸다.
    const next = r.bars.find(b => b.to >= now);
    r.anchor = next ? next.from : 1e3;
  }
  // 줄 순서. 기본 = 연중 마감순 — 전형 제출 마감월(1월부터), 같은 달이면 그 달 안의 날짜.
  // "다가오는 순" 은 오늘 기준이라 달마다 순서가 바뀌어 한 해의 리듬이 안 읽힌다 (260910 사용자 요청).
  const calKey = c => {
    const m = c.typical.deadline_month || 13;
    const dd = c.editions.flatMap(e => (e.deadlines || []).filter(x => SUBMIT.has(x.type)).map(x => x.date.slice(5)))
      .filter(x => +x.slice(0, 2) === m).sort()[0];
    return m * 100 + (dd ? +dd.slice(3, 5) : 99);
  };
  const byName = (a, b) => a.c.title.localeCompare(b.c.title);
  rows.sort(state.tlSort === "next" ? (a, b) => a.anchor - b.anchor || byName(a, b)
          : state.tlSort === "name" ? byName
          : (a, b) => calKey(a.c) - calKey(b.c) || byName(a, b));
  // ↳ 워크샵 줄은 자기 학회 바로 아래에 붙인다. 워크샵만 모드면 본 줄이 없으니 제자리에 둔다.
  const wsRow = new Map(rows.filter(r => r.sub).map(r => [r.c.id, r]));
  rows.splice(0, rows.length, ...rows.filter(r => !r.sub || !byId.has(r.c.id))
    .flatMap(r => !r.sub && wsRow.has(r.c.id) ? [r, wsRow.get(r.c.id)] : [r]));

  document.querySelector("#v-cyc .tlin").style.setProperty("--tlw", totalPx + "px");
  document.querySelector("#v-cyc .tlin").style.setProperty("--namew", NAMEW + "px");
  document.querySelector("#v-cyc .tlhead").innerHTML = `<b class="tlname hd"><span>Conference</span></b>` + cols.map(d => {
    const first = d.getMonth() === 0 || d === cols[0];
    const cur = d.getFullYear() === TODAY.getFullYear() && d.getMonth() === TODAY.getMonth();
    return `<div class="${d.getMonth() === 0 ? "yr " : ""}${cur ? "cur" : ""}">${first
      ? `${d.getFullYear()} · ${MON[d.getMonth()]}` : MON[d.getMonth()]}</div>`; }).join("");

  const grid = `<div class="tlgrid">${cols.map(d => `<span class="${d.getMonth() === 0 ? "yr " : ""}${d.getMonth() % 2 ? "alt" : ""}"></span>`).join("")}</div>` +
    `<div class="tlnow" style="left:${now.toFixed(2)}%"></div>`;

  tlInfo = [];
  document.querySelector("#v-cyc .tlbody").innerHTML = grid + rows.map(r => {
    const inner = r.bars.map((b, i) => {
      const {c, e, dl, from, to, ms, me, trunc, ghost, past, kind, ph} = b;
      const w = to - from;
      const head = "";   // 학회 이름은 왼쪽 고정 칸에 있다 — 막대에서 되풀이하지 않는다
      // 라벨에 날짜를 같이 적는다. 하나하나 올려 봐야 아는 것은 "보인다"가 아니다 (260910 지적).
      const md = iso => `${+iso.slice(5, 7)}/${+iso.slice(8, 10)}`;
      const label = ghost
        ? `${head}Est. ${state.tlMode === "meet" ? "conference" : "deadline"} (n=${state.tlMode === "meet" ? c.typical.n_meeting : c.typical.n_deadline})`
        : kind === "wsp"    ? `🧩 Paper ${md(b.ws.paper[0])}${b.ws.paper[1] !== b.ws.paper[0] ? "~" + md(b.ws.paper[1]) : ""}${b.ws.est ? " est." : ""}`
        : kind === "wsd"    ? `🧩 ${md(b.ws.days[0])}~${md(b.ws.days[1])}`
        : b.dlOnly ? `📮 ${e.year} ${b.subs.map(d => `${DLNAME2[d.type] || d.type} ${md(d.date)}`).join(" · ")}`
        : kind === "rev"    ? `⏳ ${e.year} Review ${md(dl.date)}→${md(ph[ph.length - 1].to)}`
        : kind === "dlonly" ? `📮 ${e.year} Deadline ${md(dl.date)}`
        : kind === "meet"   ? `🎤 ${e.year} Conference ${md(e.start)}${e.end && e.end !== e.start ? "~" + md(e.end) : ""}`
                            : `${head}${e ? e.year : ""}`;
      const tw = t => [...t].reduce((a, ch) => a + (ch >= "\u1100" ? 11.5 : 6.8), 0) + 14;
      const inside = w / 100 * totalPx > tw(label);
      // 밖에 다는 라벨이 옆 막대까지 닿으면 달지 않는다. 겹친 글자는 아무것도 전하지 않는다 —
      // 날짜는 커서를 올리면 오버레이에 다 나온다.
      const left = to > 88;
      const gap = left ? from - (r.bars[i - 1]?.to ?? 0) : (r.bars[i + 1]?.from ?? 100) - to;
      const outOK = gap / 100 * totalPx > tw(label);
      const meetW = (ms !== null && me !== null)
        ? Math.max(0.3, Math.min(100, me) - Math.max(from, ms)) : 0;
      const tip = ghost
        ? `${c.title} — 과거 ${state.tlMode === "meet" ? c.typical.n_meeting : c.typical.n_deadline}회에서 유도한 전형 ${state.tlMode === "meet" ? "Conference" : "Deadline"} month. 공지된 날짜가 아니다`
        : kind === "wsp" || kind === "wsd" ? `${c.title} ${e.year} 부설 Workshop${b.ws.est ? " (추산)" : ""}`
        : kind === "rev"    ? `${c.title} ${e.year} — ${ph.map(p => `${p.name} ${p.from}~${p.to}`).join(" · ")}`
        : kind === "dlonly" ? `${c.title} ${e.year} — ${dl.date} Deadline (Notification date TBA)`
        : kind === "meet"   ? `${c.title} ${e.year} Conference — ${e.date_text}`
                            : `${c.title} ${e ? e.year : ""} — ${dl ? dl.date + " Deadline · " : ""}${e ? e.date_text : ""}`;
      const bi = tlInfo.push({c, e, dl, ph, kind, ghost, ws: b.ws}) - 1;
      return `<div class="tlbar ${c.group} ${kind ? "k-" + kind : ""} ${ghost ? "ghost" : ""} ${past ? "past" : ""} ${(dl && dl.status !== "confirmed") || b.ws?.est ? "est" : ""} ${trunc ? "trunc" : ""}"
        data-id="${c.id}" data-b="${bi}" title="${esc(tip)}"
        style="left:${from.toFixed(2)}%;width:${w.toFixed(2)}%">
        ${dl && !trunc ? `<span class="tlcap"></span>` : ""}
        ${b.subs ? b.subs.slice(1).map(d => `<span class="tltick" style="left:${((pct(d.date) - from) / w * 100).toFixed(1)}%"></span>`).join("") : ""}
        ${meetW && !kind ? `<span class="tlmeet" style="width:${(meetW / w * 100).toFixed(1)}%"></span>` : ""}
        ${kind === "rev" || kind === "wsp" ? ph.map(p => {
            const a = (pct(p.from) - from) / w * 100, z = (pct(p.to) - from) / w * 100;
            return `<span class="tlseg ${p.act ? "act" : ""}" title="${esc(p.name)} ${p.from} ~ ${p.to}"
                     style="left:${Math.max(0, a).toFixed(2)}%;width:${(Math.min(100, z) - Math.max(0, a)).toFixed(2)}%"></span>`;
          }).join("") : ""}
        ${inside ? `<span class="lab">${esc(label)}</span>`
          : outOK ? `<span class="out ${left ? "l" : ""}">${esc(label)}</span>` : ""}
      </div>`;
    }).join("");
    const pre = r.c.kind === "workshop" ? "W " : r.c.kind === "track" ? "T " : "";
    const under = r.sub && state.tlMode !== "ws";          // 본 학회 줄 아래 붙은 워크샵 줄
    const nm = r.sub ? (under ? "↳ 🧩 Workshops" : `🧩 ${esc(r.c.title)}`) : `${pre}${esc(r.c.title)}`;
    return `<div class="tlrow${r.sub ? " sub" : ""}"><div class="tlname"><span class="${r.c.group}${under ? " sub" : ""}" title="${esc(r.c.full_name || r.c.title)}">${nm}</span></div>${inner}</div>`;
  }).join("") || `<div class="tlrow"><div style="padding:7px 10px;color:var(--dim)">해당 기간에 일정 없음</div></div>`;

  // 열자마자 오늘이 보여야 한다. 36개월을 다 그려 두므로 스크롤 위치를 안 맞추면 작년이 먼저 보인다.
  scrollToToday(now);
  bindPop();
  return rows.map(r => r.c.id);
}

function bindPop(){
  const body = document.querySelector("#v-cyc .tlbody");
  let pop = document.getElementById("tlpop");
  if (!pop){
    pop = document.createElement("div");
    pop.id = "tlpop"; pop.hidden = true;
    document.body.appendChild(pop);
  }
  const place = (ev) => {
    const w = pop.offsetWidth, h = pop.offsetHeight, m = 10;
    pop.style.left = Math.max(m, Math.min(innerWidth - w - m, ev.clientX + 14)) + "px";
    // 위로 뒤집었을 때 화면 밖으로 나가면 그냥 위쪽에 붙인다. 잘려 나가면 없는 것과 같다.
    const up = ev.clientY + h + 24 > innerHeight;
    pop.style.top = Math.max(m, Math.min(innerHeight - h - m, up ? ev.clientY - h - 12 : ev.clientY + 18)) + "px";
  };
  body.onmousemove = (ev) => {
    const bar = ev.target.closest(".tlbar");
    if (!bar){ pop.hidden = true; return; }
    const i = +bar.dataset.b;
    if (pop.dataset.b !== String(i)){ pop.dataset.b = String(i); pop.innerHTML = popHTML(i); }
    pop.hidden = false;
    place(ev);
  };
  body.onmouseleave = () => { pop.hidden = true; };
}

// 오늘선을 왼쪽 1/4 지점에 둔다. 마지막으로 그린 위치를 기억해 「오늘로」 버튼이 다시 쓴다 —
// 버튼이 render() 를 부르면 화면 전체를 다시 만들면서도 스크롤은 그대로일 수 있다.
let tlNowPct = 0;
function scrollToToday(now, smooth){
  tlNowPct = now;
  const tl = document.querySelector("#v-cyc .tl");
  const go = () => {
    const over = tl.scrollWidth - tl.clientWidth;
    if (over <= 0) return;
    const left = Math.max(0, Math.min(over, tl.scrollWidth * now / 100 - tl.clientWidth * 0.25));
    tl.scrollTo({left, behavior: smooth ? "smooth" : "auto"});
  };
  smooth ? go() : requestAnimationFrame(go);
}

// 기준·근거 설명은 전부 여기 모은다. 목록 화면에 두면 매번 읽어야 하는 벽이 된다.

function coverage(){
  const by = new Map();
  for (const c of DATA.series){
    if (!by.has(c.field)) by.set(c.field, []);
    by.get(c.field).push(c);
  }
  const order = ["ml","vision","nlp","robotics","medical","neuro","neuroimaging","cognitive","neuroai"];
  const row = f => {
    const xs = (by.get(f) || []).slice().sort((a, b) => a.tier - b.tier || a.title.localeCompare(b.title));
    const nm = x => `${esc(x.title)}${x.kind === "workshop" ? " (W)" : x.kind === "track" ? " (T)" : ""}`;
    return `<tr><td><b>${esc(FIELD[f] || f)}</b></td><td>${xs.length}</td>
      <td>${xs.map(x => `<span class="ct t${x.tier}">${nm(x)}</span>`).join(" ")}</td></tr>`;
  };
  return `<table class="cov"><thead><tr><th>분야</th><th>수</th><th>수록 학회 (T1 → T3 순, W=Workshop·T=트랙)</th></tr></thead>
    <tbody>${order.map(row).join("")}</tbody></table>`;
}

}

/* 추세 차트: 연도 사이 간격이 들쭉날쭉하므로 시간축이 아니라 이산 범주로 그린다.
   있는 해만 막대로 세우고, 없는 해를 보간하지 않는다. */
function trendSVG(hist){
  const W = 400, H = 130, TOP = 16, BASE = 88, BAND = BASE - TOP;
  const n = hist.length, cw = W/n, max = Math.max(...hist.map(h => h.submitted));
  const g = hist.map((h,i) => {
    const bh = Math.max(3, Math.round(h.submitted/max*BAND));
    const x = i*cw + cw*0.2, w = cw*0.6, y = BASE - bh, cx = i*cw + cw/2;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${bh}"
              fill="var(--ai)" rx="2"></rect>
            <text x="${cx.toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="10"
              font-weight="600" fill="var(--fg)">${num(h.submitted)}</text>
            <text x="${cx.toFixed(1)}" y="${BASE+13}" text-anchor="middle" font-size="10"
              fill="var(--neuro)">${(h.rate*100).toFixed(1)}%</text>
            <text x="${cx.toFixed(1)}" y="${BASE+26}" text-anchor="middle" font-size="10"
              fill="var(--dim)">${h.year}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="height:auto;display:block" role="img"
      aria-label="연도별 Submitted 편수와 Acceptance rate">
      <line x1="0" y1="${BASE}" x2="${W}" y2="${BASE}" stroke="var(--line)" stroke-width="1"></line>
      ${g}</svg>
    <p class="note">막대 = Submitted 편수 · 주황 = Acceptance rate. 출처가 연도마다 다르고, 빠진 해는
    데이터가 없는 것이지 0 이 아니다. 연도 간격이 일정하지 않으므로 시간축이 아니라 나열이다.</p>`;
}

// ── 통계 탭: DATA.fullhist(메이저 5곳 첫 개최~현재). 값이 없는 연도가 2년 넘게 이어지면 선을 끊고, 데이터가 있는 해마다 점을 찍는다 ──
const CONF_COLOR = {}, FHBASIS = {}, COUNTRY_ALIAS = {"United States": "USA", "United Kingdom": "UK", "England": "UK", "Scotland": "UK", "Korea": "South Korea", "Czechia": "Czech Republic", "UAE": "United Arab Emirates"};   // 출처마다 표기가 달라 같은 나라가 둘로 센다
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
