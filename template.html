// 추이 카드 하나에 보기 넷: 막대(실제 수)·막대(100%)·선(채택 수)·선(채택률). 같은 데이터를 중복 카드로 두지 않는다.
// 색은 학회를 따른다. 막대의 불채택 칸도 같은 학회 색을 연하게 쓴다(회색 금지: 어느 학회 막대인지 끊기지 않게).
function lineChart(wrap, rows, years, key, fmt, title){
  const confs = Object.keys(rows), W = 720, H = 250, L = 46, R = 74, T = 10, B = 24;
  const has = years.filter(y => Object.values(rows).some(r => r[y]?.[key] != null));
  if (has.length) years = years.filter(y => y >= has[0]);   // 값이 시작되는 해부터 그린다
  const vals = confs.flatMap(c => years.map(y => rows[c][y]?.[key]).filter(v => v != null));
  wrap.insertAdjacentHTML("beforeend", `<div class="tip"></div>`);
  if (!vals.length){ wrap.insertAdjacentHTML("beforeend", `<p>이 구간에 수치가 있는 Edition 없음</p>`); return; }
  const y0 = years[0], y1 = years[years.length-1], vmax = Math.max(...vals) * 1.05;
  const X = y => L + (y - y0) / Math.max(1, y1 - y0) * (W - L - R), Y = v => T + (1 - v / vmax) * (H - T - B);
  let g = ""; const ends = [];
  for (let i = 0; i <= 4; i++){ const v = vmax * i / 4;
    g += `<line class="ax" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`; }
  const step = Math.max(1, Math.ceil((y1 - y0) / 8));
  for (let y = y0; y <= y1; y += step) g += `<text x="${X(y)}" y="${H-6}" text-anchor="middle">${y}</text>`;
  for (const c of confs){
    const pts = years.filter(y => rows[c][y]?.[key] != null);
    let d = "", prev = null;
    for (const y of pts){ d += (prev !== null && y - prev <= 2 ? "L" : "M") + `${X(y).toFixed(1)},${Y(rows[c][y][key]).toFixed(1)} `; prev = y; }
    g += `<path class="ln" d="${d}" style="stroke:var(${CONF_COLOR[c]})"/>`
      + pts.map(y => `<circle cx="${X(y)}" cy="${Y(rows[c][y][key])}" r="2" style="fill:var(${CONF_COLOR[c]})"/>`).join("");
    const last = pts[pts.length-1];                    // 끝점 직접 표기(색 단독 식별 금지)
    if (last !== undefined){
      g += `<circle cx="${X(last)}" cy="${Y(rows[c][last][key])}" r="3.5" style="fill:var(${CONF_COLOR[c]})"/>`;
      ends.push({c, x: X(last), y: Y(rows[c][last][key])});
    }
  }
  ends.sort((a, b) => a.y - b.y);                      // 라벨끼리 12px 안으로 겹치면 아래로 민다
  ends.forEach((e, i) => { e.ly = i && e.y < ends[i-1].ly + 12 ? ends[i-1].ly + 12 : e.y; });
  for (const e of ends) g += `<text x="${e.x + 6}" y="${e.ly + 4}">${esc(e.c)}</text>`;
  for (const c of confs) for (const b of FHBASIS[c] ?? []){   // 집계 기준이 바뀐 해 = 점선 + 짧은 설명
    if (b.from <= y0 || b.from > y1 || !rows[c][b.from]) continue;
    g += `<line x1="${X(b.from)}" x2="${X(b.from)}" y1="${T}" y2="${H-B}" stroke-dasharray="3 3" style="stroke:var(${CONF_COLOR[c]})"/>
      <text x="${X(b.from)+3}" y="${T+10}">${esc(c)} ${b.from}~ ${esc(b.note)}</text>`;
  }
  g += `<line id="xh" class="ax" y1="${T}" y2="${H-B}" style="display:none"/>`;
  wrap.insertAdjacentHTML("beforeend", `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${g}
    <rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/></svg>`);
  const svg = wrap.querySelector("svg"), tip = wrap.querySelector(".tip"), xh = svg.querySelector("#xh");
  svg.addEventListener("pointermove", ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * W;
    const y = Math.min(y1, Math.max(y0, Math.round(y0 + (px - L) / (W - L - R) * (y1 - y0))));
    xh.setAttribute("x1", X(y)); xh.setAttribute("x2", X(y)); xh.style.display = "";
    tip.innerHTML = `<b>${y}</b><br>` + confs.map(c => {
      const e = rows[c][y]; return e ? `<span style="color:var(${CONF_COLOR[c]})">━</span> ${esc(c)} <b>${e[key] != null ? fmt(e[key]) : "—"}</b> · ${esc(e.place)}` : "";
    }).filter(Boolean).join("<br>");
    tip.style.display = "block"; tip.style.left = Math.min(ev.clientX - r.left + 12, r.width - 190) + "px"; tip.style.top = "70px";
  });
  svg.addEventListener("pointerleave", () => { tip.style.display = "none"; xh.style.display = "none"; });
}

function barChart(wrap, rows, years, confs, mode){
  const ys = years.filter(y => confs.some(c => rows[c][y]?.submitted && rows[c][y]?.accepted));
  if (!ys.length){ wrap.insertAdjacentHTML("beforeend", `<p>이 구간에 Submitted·Accepted 수가 모두 있는 Edition 없음</p>`); return; }
  const bw = 12, gap = 3, pad = 14, L = 44, T = 14, B = 26, H = 250;
  const gw = confs.length * (bw + gap) + pad, W = L + ys.length * gw + 8;
  const vmax = mode === "abs" ? Math.max(...ys.flatMap(y => confs.map(c => rows[c][y]?.submitted || 0))) * 1.05 : 1;
  const Y = v => T + (1 - v / vmax) * (H - T - B), base = Y(0);
  let g = "";
  for (let i = 0; i <= 4; i++){ const v = vmax * i / 4;
    g += `<line class="ax" x1="${L}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${mode === "pct" ? Math.round(v * 100) + "%" : Math.round(v).toLocaleString()}</text>`; }
  ys.forEach((y, yi) => {
    const x0 = L + yi * gw + pad / 2;
    g += `<text x="${x0 + (confs.length * (bw + gap)) / 2}" y="${H-8}" text-anchor="middle">${y}</text>`;
    confs.forEach((c, ci) => {
      const e = rows[c][y]; if (!e?.submitted || !e?.accepted) return;
      const x = x0 + ci * (bw + gap), tot = mode === "pct" ? 1 : e.submitted, acc = mode === "pct" ? e.accepted / e.submitted : e.accepted;
      const yTop = Y(tot), yAcc = Y(acc), col = `var(${CONF_COLOR[c]})`;
      g += `<g><title>${esc(c)} ${y} · Submitted ${e.submitted.toLocaleString()} · Accepted ${e.accepted.toLocaleString()} · Acceptance rate ${(e.rate * 100).toFixed(1)}%</title>
        <rect x="${x}" y="${yTop}" width="${bw}" height="${Math.max(0, yAcc - yTop - 2)}" rx="2" style="fill:${col};opacity:.22"/>
        <rect x="${x}" y="${yAcc}" width="${bw}" height="${Math.max(1, base - yAcc)}" rx="2" style="fill:${col}"/>
        ${mode === "pct" ? `<text x="${x + bw/2}" y="${yTop - 3}" text-anchor="middle" style="font-size:9px">${Math.round(e.rate * 100)}</text>` : ""}</g>`;
    });
  });
  wrap.insertAdjacentHTML("beforeend", `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" style="width:${Math.max(720, W)}px" role="img" aria-label="Submitted 대비 Accepted 막대">${g}</svg></div>`);
}

function trendCard(host, rows, years, confs){
  const mode = state.statChart || "abs";
  const TABS = [["abs", "Bars · count", "막대 전체 = Submitted, 진한 칸 = Accepted, 연한 칸 = Not accepted(같은 학회 색). Scale 차이까지 보인다."],
                ["pct", "Bars · 100%", "막대 높이를 같게 맞춰 Accepted 비율만 비교한다. 숫자 = Acceptance rate(%)."],
                ["acc", "Line · accepted", "연도별 Accepted 논문 수. 점선 = 집계 기준이 바뀐 해."],
                ["rate", "Line · acceptance rate", "Accepted ÷ Submitted. Submitted 수가 공개된 해만 점으로 찍는다."]];
  const cur = TABS.find(t => t[0] === mode) || TABS[0];
  const wrap = document.createElement("div"); wrap.className = "ch";
  wrap.innerHTML = `<h3>Submitted vs Accepted</h3><div class="win">${TABS.map(([k, t]) =>
      `<button data-chart="${k}" aria-pressed="${k === cur[0]}">${t}</button>`).join("")}</div><p>${cur[2]}</p>
    <div class="lg">${confs.map(c => `<span><i style="border-color:var(${CONF_COLOR[c]})"></i>${esc(c)}</span>`).join("")}</div>`;
  host.appendChild(wrap);
  wrap.querySelectorAll("[data-chart]").forEach(b => b.onclick = () => { state.statChart = b.dataset.chart; renderStats(); });
  if (cur[0] === "abs" || cur[0] === "pct") barChart(wrap, rows, years, confs, cur[0]);
  else if (cur[0] === "acc") lineChart(wrap, rows, years, "accepted", v => Math.round(v).toLocaleString(), "연도별 Accepted 논문 수");
  else lineChart(wrap, rows, years, "rate", v => (v * 100).toFixed(0) + "%", "연도별 Acceptance rate");
}

function renderStats(){
  const FH = DATA.fullhist || {}, all = Object.keys(FH), host = document.getElementById("v-st");
  if (!all.length){ host.innerHTML = `<p class="meta">전체 이력 데이터(data/history.yml) 없음</p>`; return; }
  const MAJOR = ["NeurIPS", "ICML", "ICLR", "CVPR", "ACL"], CAP = 8;
  state.statSel = (state.statSel || MAJOR).filter(c => FH[c]);
  const confs = state.statSel;
  // 색은 학회(개체)를 따른다: 메이저 5곳은 고정 슬롯, 나머지는 선택 순서대로 남은 슬롯 — 선택을 바꿔도 메이저 색은 안 바뀐다
  const used = new Set(confs.filter(c => MAJOR.includes(c)).map(c => MAJOR.indexOf(c) + 1));
  let free = 1; const nextFree = () => { while (used.has(free)) free++; used.add(free); return free; };
  for (const k of Object.keys(CONF_COLOR)) delete CONF_COLOR[k];
  confs.forEach(c => { CONF_COLOR[c] = `--c${MAJOR.includes(c) ? MAJOR.indexOf(c) + 1 : nextFree()}`; FHBASIS[c] = FH[c].basis; });
  const grp = c => MAJOR.includes(c) ? "Major 5" : (DATA.series.find(x => x.title === c)?.group === "neuro" ? "Neuro" : "AI other");
  const groups = ["Major 5", "AI other", "Neuro"].map(g => [g, all.filter(c => grp(c) === g)]);
  const yr = Math.max(...all.map(c => FH[c].editions[FH[c].editions.length-1].year));
  const lo = state.statWin ? yr - state.statWin + 1 : Math.min(...confs.map(c => FH[c].first_year), yr);
  const years = []; for (let y = lo; y <= yr; y++) years.push(y);
  const rows = {};
  for (const c of confs){ rows[c] = {};
    for (const e of FH[c].editions) rows[c][e.year] = {...e, place: e.sites.map(s => s.place).join(" + ") || "Venue 미상"}; }
  const first = c => FH[c].editions.find(e => e.accepted != null), lastN = c => [...FH[c].editions].reverse().find(e => e.accepted != null);
  host.innerHTML = `<div class="win">${[[0,"All"],[30,"30 yr"],[10,"10 yr"],[5,"5 yr"]].map(([n, t]) =>
      `<button data-win="${n}" aria-pressed="${state.statWin === n}">${t}</button>`).join("")}
    <span class="meta">첫 Conference부터 ${yr}년 · 2년 넘는 공백은 선을 끊음 · 학회는 최대 ${CAP}개</span></div>
    <div class="picker"><h3>Select conferences (${confs.length}/${CAP})</h3><p>눌러서 추가·제거. 켜진 학회가 아래 모든 차트에 나온다. 테두리가 굵은 것 = 선택됨.</p>
    ${groups.map(([g, list]) => `<div class="win"><span class="meta">${g}</span> ${list.map(c =>
      `<button data-sel="${esc(c)}" aria-pressed="${confs.includes(c)}">${esc(c)}</button>`).join("")}</div>`).join("")}</div>
    <div class="cards">${confs.map(c => { const f = first(c), l = lastN(c);
      return `<div class="sc"><span style="color:var(${CONF_COLOR[c]})">━</span> <b>${esc(c)}</b>
        <span>First held ${FH[c].first_year} · ${FH[c].editions.length} editions</span><br>
        <span>${f && l && f !== l ? `Accepted ${f.year} ${f.accepted.toLocaleString()} → ${l.year} ${l.accepted.toLocaleString()} (×${(l.accepted / f.accepted).toFixed(1)})` : "No counts (sites only)"}</span></div>`; }).join("")}</div>`;
  host.querySelectorAll("[data-win]").forEach(b => b.onclick = () => { state.statWin = +b.dataset.win; renderStats(); });
  host.querySelectorAll("[data-sel]").forEach(b => b.onclick = () => {
    const c = b.dataset.sel, i = state.statSel.indexOf(c);
    if (i >= 0) { if (state.statSel.length > 1) state.statSel.splice(i, 1); }
    else if (state.statSel.length < CAP) state.statSel.push(c);
    renderStats(); });
  trendCard(host, rows, years, confs);
  // 개최 타임라인: 수치가 없는 학회도 개최지·연도는 있다. 점 = 개최한 해, 큰 고리 = 다지역 동시 개최, 빈 칸 = 안 열린 해
  {
    const W = 720, rowH = 22, L = 90, R = 16, H = confs.length * rowH + 28, y0 = lo, y1 = yr;
    const X = y => L + (y - y0) / Math.max(1, y1 - y0) * (W - L - R);
    let g = "";
    const step = Math.max(1, Math.ceil((y1 - y0) / 8));
    for (let y = y0; y <= y1; y += step) g += `<text x="${X(y)}" y="${H-8}" text-anchor="middle">${y}</text>`;
    confs.forEach((c, i) => {
      const cy = i * rowH + 14;
      g += `<text x="${L-8}" y="${cy+4}" text-anchor="end">${esc(c)}</text><line class="ax" x1="${L}" x2="${W-R}" y1="${cy}" y2="${cy}"/>`;
      for (const e of FH[c].editions) if (e.year >= y0){
        const multi = e.sites.length > 1, virt = e.sites.length && e.sites.every(s => s.place === "Virtual");
        const tip = `${c} ${e.year} · ${e.sites.map(s => s.place).join(" + ") || "Venue 미상"}`;
        g += `<g><title>${esc(tip)}</title>${multi ? `<circle cx="${X(e.year)}" cy="${cy}" r="7" fill="none" stroke-width="2" style="stroke:var(${CONF_COLOR[c]})"/>` : ""}
          <circle cx="${X(e.year)}" cy="${cy}" r="${virt ? 3 : 4}" style="${virt ? `fill:none;stroke-width:1.5;stroke:var(${CONF_COLOR[c]})` : `fill:var(${CONF_COLOR[c]})`}"/></g>`;
      }
    });
    host.insertAdjacentHTML("beforeend", `<div class="ch"><h3>Edition timeline</h3><p>학회가 열린 해를 점으로 표시한다. 대부분 매년이라 점이 이어지고, <b>빈칸 = 안 열린 해</b>(격년 학회, 초기 공백)다. 속 빈 점 = 가상 Conference, 큰 고리 = 다지역 동시 Conference. 점에 올리면 Venue.</p>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="학회별 Conference 연도">${g}</svg></div>`);
  }
  // 개최 국가별 회차 수: 다지역 개최는 지역마다 1회로 센다
  const cnt = new Map();
  for (const c of confs) for (const e of FH[c].editions) if (e.year >= lo) for (const s of e.sites){
    if (s.place === "Virtual") continue; const raw = s.place.split(",").pop().trim(), k = COUNTRY_ALIAS[raw] ?? raw; cnt.set(k, (cnt.get(k) || 0) + 1); }
  const top = [...cnt].sort((a, b) => b[1] - a[1]).slice(0, 10), mx = top[0]?.[1] || 1;
  host.insertAdjacentHTML("beforeend", `<div class="ch"><h3>Editions by country</h3><p>선택한 학회 합계, 같은 Edition의 다지역은 지역마다 1회. 가상 Conference 제외.</p>
    <svg viewBox="0 0 720 ${top.length * 22 + 6}">${top.map(([k, n], i) =>
      `<text x="110" y="${i*22+16}" text-anchor="end">${esc(k)}</text>
       <rect x="116" y="${i*22+4}" width="${n / mx * 520}" height="14" rx="3" style="fill:var(--c1)"/>
       <text x="${122 + n / mx * 520}" y="${i*22+16}">${n}</text>`).join("")}</svg></div>`);
  // 표 보기(접근성·정확한 값 확인) — 출처 링크 포함
  host.insertAdjacentHTML("beforeend", `<details class="ch"><summary>Table view (year × conference, accepted/submitted)</summary><table><tr><th>연도</th>${confs.map(c => `<th>${esc(c)}</th>`).join("")}</tr>${
    [...years].reverse().map(y => `<tr><td>${y}</td>${confs.map(c => { const e = rows[c][y];
      return `<td>${e ? (e.source ? `<a href="${esc(e.source)}" target="_blank" rel="noopener">${e.accepted != null ? e.accepted.toLocaleString() : "—"}${e.submitted != null ? "/" + e.submitted.toLocaleString() : ""}</a>` : "—") : ""}</td>`; }).join("")}</tr>`).join("")}</table></details>`);
  addHead("st");
}

function render(){
  for (const v of ["list","kb","tbl","map","cyc","src","st"])
    document.getElementById("v-"+v).hidden = state.view !== v;
  document.getElementById("majornote").hidden = state.rank !== "major";
  document.getElementById("bar2").style.display =
    (state.view === "src" || state.view === "map" || state.view === "st") ? "none" : "";
  ({list:renderList, kb:renderKanban, tbl:renderTable, map:renderMap,
    cyc:renderCycle, src:renderSources, st:renderStats})[state.view]();
  addHead(state.view);
}

function bindGroup(sel, apply){
  for (const b of document.querySelectorAll(sel)) b.onclick = () => {
    apply(b);
    for (const o of document.querySelectorAll(sel)) o.setAttribute("aria-pressed", o === b);
    render();
  };
}
bindGroup("[data-v]", b => state.view  = b.dataset.v);
bindGroup("[data-g]", b => state.group = b.dataset.g);
bindGroup("[data-t]", b => state.rank = b.dataset.t === "major" ? "major" : +b.dataset.t);
bindGroup("[data-s]", b => state.sort  = b.dataset.s);
bindGroup("[data-m]", b => state.mapMode = b.dataset.m);
bindGroup("[data-c]", b => state.cycMode = b.dataset.c);
bindGroup("[data-mo]", b => { state.months = +b.dataset.mo;
  try { localStorage.setItem(MO_KEY, String(state.months)); } catch {} });
bindGroup("[data-tm]", b => state.tlMode = b.dataset.tm);
bindGroup("[data-ts]", b => state.tlSort = b.dataset.ts);
document.getElementById("fav").onclick = e => {
  state.favOnly = !state.favOnly;
  e.target.setAttribute("aria-pressed", state.favOnly); render();
};
document.getElementById("ws").onclick = e => {
  state.withWs = !state.withWs;
  e.target.setAttribute("aria-pressed", state.withWs); render();
};
document.getElementById("sub-only").onclick = e => {
  state.subOnly = !state.subOnly;
  e.target.setAttribute("aria-pressed", state.subOnly); render();
};
document.getElementById("tl-now").onclick = () => scrollToToday(tlNowPct, true);
document.getElementById("openrev").onclick = e => {
  state.openRev = !state.openRev;
  e.currentTarget.setAttribute("aria-pressed", state.openRev); render();
};
document.getElementById("q").oninput = e => { state.q = e.target.value; render(); };

// 카드/행 클릭 = 상세. 별 클릭은 상세를 열지 않는다.
document.addEventListener("click", e => {
  const goto = e.target.closest("[data-goto]");
  if (goto){
    e.stopPropagation();
    state.view = goto.dataset.goto;
    for (const b of document.querySelectorAll("[data-v]"))
      b.setAttribute("aria-pressed", b.dataset.v === state.view);
    render();
    scrollTo({top: 0, behavior: "smooth"});
    return;
  }
  const star = e.target.closest("[data-fav]");
  if (star){
    e.stopPropagation();
    const id = star.dataset.fav;
    state.fav.has(id) ? state.fav.delete(id) : state.fav.add(id);
    saveFav(state.fav); render(); return;
  }
  const city = e.target.closest("[data-city]");
  if (city){
    const hits = DATA.series.filter(c => c.editions.some(x => x.sites.some(st => st.place === city.dataset.city)));
    if (hits.length === 1) openDetail(hits[0].id);
    else { state.q = city.dataset.city.split(",")[0]; document.getElementById("q").value = state.q;
           state.view = "list";
           for (const o of document.querySelectorAll("[data-v]"))
             o.setAttribute("aria-pressed", o.dataset.v === "list");
           render(); }
    return;
  }
  const row = e.target.closest("[data-id]");
  if (row && !e.target.closest("a")) openDetail(row.dataset.id);
});

/* ── 캘린더 (.ics) ───────────────────────────────────────────────────────────
   빌드가 만드는 구독 피드(deadlines.ics)와 별개로, 고른 학회만 즉석으로 뽑는 경로.
   구독은 "전부 상시", 이건 "관심 있는 것만 지금". 둘 다 필요하다. */
const icsEsc = t => String(t ?? "").replace(/\\/g,"\\\\").replace(/;/g,"\\;")
                                  .replace(/,/g,"\\,").replace(/\n/g,"\\n");
const plusDay = iso => { const d = new Date(iso+"T00:00:00"); d.setDate(d.getDate()+1);
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`; };
const icsFold = l => {                    // RFC 5545 = 75옥텟. 한글은 3바이트라 금방 넘는다
  const b = new TextEncoder().encode(l);
  if (b.length <= 73) return l;
  const out = []; let cur = b;
  while (cur.length > 73){
    let cut = 73; while (cut > 0 && (cur[cut] & 0xC0) === 0x80) cut--;
    out.push(new TextDecoder().decode(cur.slice(0,cut)));
    cur = new Uint8Array([32, ...cur.slice(cut)]);
  }
  out.push(new TextDecoder().decode(cur));
  return out.join("\r\n");
};
function buildICS(list){
  const stamp = new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//conf-radar//KR","CALSCALE:GREGORIAN",
             "METHOD:PUBLISH","X-WR-CALNAME:학회 레이더 (선택)"];
  for (const c of list){
    for (const d of c.deadlines){
      if (!SUBMIT.has(d.type)) continue;
      const tag = d.status === "confirmed" ? "" : (d.status === "tba" ? " (미공지)" : " (추정)");
      L.push("BEGIN:VEVENT", `UID:${c.id}-${d.type}-${d.date}@conf-radar`, `DTSTAMP:${stamp}`,
        `DTSTART;VALUE=DATE:${d.date.replace(/-/g,"")}`, `DTEND;VALUE=DATE:${plusDay(d.date)}`,
        `SUMMARY:🔴 ${icsEsc(c.title)} Deadline${icsEsc(tag)}`,
        `DESCRIPTION:${icsEsc(d.label)} · ${icsEsc(c.date_text)} ${icsEsc(c.city)}`,
        `URL:${c.link}`, "TRANSP:TRANSPARENT",
        "BEGIN:VALARM","TRIGGER:-P7D","ACTION:DISPLAY",
        `DESCRIPTION:${icsEsc(c.title)} Deadline in 1 week`,"END:VALARM","END:VEVENT");
    }
    if (c.start && c.end)
      L.push("BEGIN:VEVENT", `UID:${c.id}-meeting@conf-radar`, `DTSTAMP:${stamp}`,
        `DTSTART;VALUE=DATE:${c.start.replace(/-/g,"")}`, `DTEND;VALUE=DATE:${plusDay(c.end)}`,
        `SUMMARY:📍 ${icsEsc(c.title)} ${c.next ?? ""}`,
        `LOCATION:${icsEsc(c.venue || c.city)}`, `URL:${c.link}`, "TRANSP:TRANSPARENT","END:VEVENT");
  }
  L.push("END:VCALENDAR");
  return L.map(icsFold).join("\r\n") + "\r\n";
}
// Claude 아티팩트 뷰어는 페이지가 시작하는 다운로드를 전부 막는다(data:·blob: 포함).
// 눌러도 아무 일이 없는 버튼을 두느니 정식 사이트로 안내한다.
const SITE = "https://kafkapple.github.io/conf-radar/";
const CAN_DL = !/claude\.ai$/.test(location.hostname);

// 아이폰은 data: URL 을 캘린더로 넘긴다. <a download> 는 홈화면 앱 모드에서 잘 안 먹는다.
function openICS(list, name){
  if (!CAN_DL) return alert(`이 미리보기 화면은 파일 내려받기가 막혀 있다.\n정식 사이트에서 받을 것:\n${SITE}`);
  if (!list.length) return alert("선택된 학회가 없다");
  const txt = buildICS(list);
  const a = document.createElement("a");
  a.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(txt);
  a.download = name + ".ics"; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
}

// 서비스 워커 = 오프라인. https 또는 localhost 에서만 등록되고, 실패해도 페이지는 정상 동작한다.
if ("serviceWorker" in navigator)
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

const n = DATA.series.length, nn = DATA.series.filter(c => c.group === "neuro").length;
const noNext = DATA.series.filter(c => !c.next).length;
const nw = DATA.series.filter(c => c.kind !== "conference").length;
document.getElementById("sub").textContent =
  `${DATA.generated} 갱신 · ${n}개 (학회 ${n-nw} · Workshop·트랙 ${nw}) · 차기 미공지 ${noNext}건은 전형 주기로 표시`;
document.getElementById("foot").innerHTML =
  `<b>출처</b> — 차기 Deadline = <a href="https://github.com/huggingface/ai-deadlines" target="_blank" rel="noopener">ai-deadlines</a> ·
   Edition 이력·CORE rank·Submitted수 = <a href="https://github.com/ccfddl/ccf-deadlines" target="_blank" rel="noopener">ccf-deadlines</a> ·
   h5-index = <a href="https://scholar.google.com/citations?view_op=top_venues&amp;hl=en&amp;vq=eng_artificialintelligence" target="_blank" rel="noopener">Google Scholar Metrics</a> ·
   뇌과학 학회·연계 제도·발표 계층·트랙 = 수동 큐레이션.
   <button class="lnk" data-goto="src">기준과 한계 · 정보원 →</button>`;

// 주소 끝 토큰으로 첫 화면을 정한다 — `#major,cyc` = 메이저만 타임라인으로.
// 셸 알리아스(conf)와 Alfred 앱이 이 주소를 쓴다. 구분자는 쉼표·#·/·+ 아무거나 받는다.
const HASH = new Set(location.hash.slice(1).toLowerCase().split(/[,#/+]/).filter(Boolean));
if (HASH.has("major")){
  state.rank = "major";
  for (const b of document.querySelectorAll("[data-t]"))
    b.setAttribute("aria-pressed", b.dataset.t === "major");
}
for (const g of ["ai", "neuro"]) if (HASH.has(g)){
  state.group = g;
  for (const b of document.querySelectorAll("[data-g]"))
    b.setAttribute("aria-pressed", b.dataset.g === g);
}
const hv = ["list", "kb", "tbl", "map", "cyc", "src", "st"].find(v => HASH.has(v));
if (hv){
  state.view = hv;
  for (const b of document.querySelectorAll("[data-v]"))
    b.setAttribute("aria-pressed", b.dataset.v === hv);
}
const htm = ["both", "dl", "meet", "ws"].find(m => HASH.has(m));
if (htm){
  state.tlMode = htm;
  for (const b of document.querySelectorAll("[data-tm]"))
    b.setAttribute("aria-pressed", b.dataset.tm === htm);
}
if (HASH.has("plan")){
  state.view = "cyc"; state.cycMode = "plan";
  for (const b of document.querySelectorAll("[data-c]")) b.setAttribute("aria-pressed", b.dataset.c === "plan");
  for (const b of document.querySelectorAll("[data-v]")) b.setAttribute("aria-pressed", b.dataset.v === "cyc");
}
const hm = [3, 6, 12, 24].find(m => HASH.has(m + "m"));
if (hm) state.months = hm;
for (const b of document.querySelectorAll("[data-mo]"))     // 기억한 배율도 버튼에 반영
  b.setAttribute("aria-pressed", +b.dataset.mo === state.months);
// 창 폭이 바뀌면 「1년」의 월당 px 도 바뀐다
let rsz;
addEventListener("resize", () => { clearTimeout(rsz);
  rsz = setTimeout(() => { if (state.view === "cyc") render(); }, 150); });
render();
</script>
