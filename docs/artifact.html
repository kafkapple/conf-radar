<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="학회 레이더">
<meta name="theme-color" content="#0d1014">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 팔레트: 종이/잉크 중립색에 파랑 쪽으로 살짝 치우친 회색.
   AI=인디고 / 뇌과학=앰버 — 이 도구의 존재 이유인 두 영역 구분에 색을 쓴다. */
:root{
  --bg:#f6f7f9; --card:#fff; --fg:#161a1f; --dim:#5a6673; --line:#e2e6ec;
  --ai:#3055b8; --ai-bg:#e7edfb; --neuro:#9a5a06; --neuro-bg:#fbeed8;
  --urgent:#b8302a; --shadow:0 1px 2px rgba(20,26,34,.05);
  --sans:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Segoe UI,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1014; --card:#161a20; --fg:#e4e9ef; --dim:#8a94a2; --line:#262c35;
  --ai:#7fa3ee; --ai-bg:#1a2438; --neuro:#e0a24e; --neuro-bg:#2c2312;
  --urgent:#f07a70; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#0d1014; --card:#161a20; --fg:#e4e9ef; --dim:#8a94a2; --line:#262c35;
  --ai:#7fa3ee; --ai-bg:#1a2438; --neuro:#e0a24e; --neuro-bg:#2c2312;
  --urgent:#f07a70; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:1000px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0 0 3px}
.sub{color:var(--dim);font-size:12.5px;margin:0 0 14px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px;
  position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5;border-bottom:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
button{font:inherit;font-size:13px;padding:5px 11px;border:1px solid var(--line);border-radius:99px;
  background:var(--card);color:var(--dim);cursor:pointer}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
input[type=search]{font:inherit;font-size:13px;padding:5px 10px;border:1px solid var(--line);
  border-radius:99px;background:var(--card);color:var(--fg);flex:1;min-width:110px}
section[hidden]{display:none}

/* ── 연간 사이클 ── */
.cyc{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);
  border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:660px;font-size:12.5px}
th,td{padding:0;text-align:center}
thead th{color:var(--dim);font-weight:500;font-size:11px;padding:7px 0;border-bottom:1px solid var(--line)}
th.nm,td.nm{position:sticky;left:0;background:var(--card);text-align:left;padding:0 10px;
  min-width:132px;max-width:132px;border-right:1px solid var(--line);z-index:2}
tbody tr{height:26px}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--fg) 3%,transparent)}
tbody tr:nth-child(even) td.nm{background:color-mix(in srgb,var(--fg) 3%,var(--card))}
.nm a{color:inherit;text-decoration:none;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;display:block}
.cell{position:relative;height:26px}
.span{position:absolute;left:0;right:0;top:12px;height:2px;background:var(--line)}
.mk{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:15px;height:15px;
  border-radius:4px;font-size:9px;line-height:15px;color:#fff;font-weight:700}
.mk.dl{border-radius:50%}
.g-ai .mk{background:var(--ai)} .g-neuro .mk{background:var(--neuro)}
.mk.est{opacity:.45}
.legend{color:var(--dim);font-size:11.5px;margin:8px 2px 0;display:flex;gap:14px;flex-wrap:wrap}

/* ── 마감 목록 ── */
h2.grp{font-size:11.5px;text-transform:none;color:var(--dim);font-weight:600;margin:20px 0 7px;letter-spacing:.02em}
.card{box-shadow:var(--shadow);display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;margin-bottom:7px}
.dday{font:600 12px/1.25 var(--mono);font-variant-numeric:tabular-nums;min-width:52px;text-align:right;padding-top:3px;color:var(--dim)}
.dday.hot{color:var(--urgent)}
.dday.past{opacity:.4}
.body{flex:1;min-width:0}
.name{font-weight:650;font-size:14.5px}
.name a{color:inherit;text-decoration:none}
.name a:hover{text-decoration:underline}
.chip{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:5px;vertical-align:2px;
  margin-left:5px;font-weight:600}
.chip.ai{background:var(--ai-bg);color:var(--ai)}
.chip.neuro{background:var(--neuro-bg);color:var(--neuro)}
.chip.est{background:transparent;border:1px dashed var(--line);color:var(--dim)}
.meta{color:var(--dim);font-size:12.5px;margin-top:2px}
.meta b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.meta b{font-weight:600;color:var(--fg)}
.foot{color:var(--dim);font-size:11.5px;margin-top:26px;line-height:1.7}
.foot a{color:var(--dim)}
</style>

<div class="wrap">
<h1>🧠 학회 레이더</h1>
<p class="sub" id="sub"></p>

<div class="bar">
  <button data-v="list" aria-pressed="true">마감 목록</button>
  <button data-v="cyc" aria-pressed="false">연간 사이클</button>
  <span style="width:8px"></span>
  <button data-g="all" aria-pressed="true">전체</button>
  <button data-g="neuro" aria-pressed="false">뇌과학</button>
  <button data-g="ai" aria-pressed="false">AI</button>
  <button id="sub" aria-pressed="true">제출 마감만</button>
  <input type="search" id="q" placeholder="학회 검색">
</div>

<section id="v-list"></section>

<section id="v-cyc" hidden>
  <div class="cyc"><table>
    <thead><tr><th class="nm">학회</th></tr></thead>
    <tbody></tbody>
  </table></div>
  <p class="legend">
    <span>● 마감</span><span>■ 개최</span>
    <span style="opacity:.45">흐림 = 추정/미공지</span>
    <span style="color:var(--ai)">파랑 AI</span><span style="color:var(--neuro)">주황 뇌과학</span>
  </p>
</section>

<p class="foot" id="foot"></p>
</div>

const TODAY = new Date(new Date().toDateString());
const MONTHS = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
const state = {view:"list", group:"all", q:"", subOnly:true};
// 실제로 "내야 하는" 마감. 나머지(notification·rebuttal·camera_ready·review_release)는 통보/사후 일정.
const SUBMIT = new Set(["abstract","paper","submission","supplementary","abstract_late"]);
const dlsOf = c => state.subOnly ? c.deadlines.filter(d => SUBMIT.has(d.type)) : c.deadlines;

const days = iso => Math.round((new Date(iso+"T23:59:59") - TODAY)/864e5);
const fmt = iso => iso.slice(2).replace(/-/g,".");

// 표시할 마감 = 아직 안 지난 것 중 가장 이른 것. 전부 지났으면 마지막 것(맥락용).
function nextDeadline(c){
  return c.deadlines.find(d => days(d.date) >= 0) || c.deadlines[c.deadlines.length-1] || null;
}
function visible(){
  const q = state.q.trim().toLowerCase();
  return DATA.conferences.filter(c =>
    (state.group === "all" || c.group === state.group) &&
    (!q || (c.title+" "+c.full_name+" "+c.city+" "+c.tags.join(" ")).toLowerCase().includes(q)));
}

function renderList(){
  // 마감이 남았으면 마감 기준, 다 지났으면 개최일 기준으로 줄 세운다.
  // (KSBNS 처럼 마감은 지났지만 개최가 코앞인 학회를 목록 바닥에 묻지 않기 위함)
  const items = visible().map(c => {
    const d = dlsOf(c).find(x => days(x.date) >= 0) || null;
    return {c, d, n: d ? days(d.date) : null, m: days(c.start)};
  });
  const upcoming = items.filter(x => x.n !== null).sort((a,b) => a.n - b.n);
  const passed   = items.filter(x => x.n === null).sort((a,b) => a.m - b.m);
  const buckets = [
    ["🔥 2주 내",          upcoming.filter(x => x.n <= 14)],
    ["다가오는 마감 (3개월)", upcoming.filter(x => x.n > 14 && x.n <= 92)],
    ["그 이후",            upcoming.filter(x => x.n > 92)],
    ["마감 지남 · 개최 예정", passed],
  ];
  let html = "";
  for (const [label, rows] of buckets){
    if (!rows.length) continue;
    html += `<h2 class="grp">${label}</h2>`;
    for (const {c,d,n,m} of rows){
      const dd  = d ? `D-${n}` : (m >= 0 ? `개최 D-${m}` : "진행 중");
      const hot = d ? n <= 14 : m <= 14;
      const est = d && d.status !== "confirmed";
      html += `<div class="card">
        <div class="dday ${hot?"hot":""} ${d?"":"past"}">${dd}</div>
        <div class="body">
          <div class="name"><a href="${c.link}" target="_blank" rel="noopener">${c.title} ${c.year}</a>
            <span class="chip ${c.group}">${c.group==="ai"?"AI":"뇌과학"}</span>
            ${est?`<span class="chip est">${d.status==="tba"?"미공지":"추정"}</span>`:""}</div>
          <div class="meta">${d?`<b>${fmt(d.date)}</b> ${d.label}`:"마감 종료"}</div>
          <div class="meta">📍 ${c.date_text || fmt(c.start)} · ${[c.city,c.country].filter(Boolean).join(", ")}</div>
        </div></div>`;
    }
  }
  document.getElementById("v-list").innerHTML = html || `<p class="meta">해당 학회 없음</p>`;
}

function renderCycle(){
  const byTitle = new Map();   // 연 주기를 보는 뷰라 SIGGRAPH 2026/2027 을 두 줄로 두면 중복이다
  for (const c of visible().slice().sort((a,b) => a.start.localeCompare(b.start)))
    if (!byTitle.has(c.title)) byTitle.set(c.title, c);
  const rows = [...byTitle.values()].sort((a,b) => a.start_month - b.start_month || a.title.localeCompare(b.title));
  const thead = document.querySelector("#v-cyc thead tr");
  thead.innerHTML = `<th class="nm">학회</th>` + MONTHS.map(m => `<th>${m}</th>`).join("");
  const tb = document.querySelector("#v-cyc tbody");
  tb.innerHTML = rows.map(c => {
    // 마감 월과 개최 월만 남기고 나머지는 빈 칸. 연도 차이는 무시 — "연 주기"를 보는 뷰다.
    const dl = {}, est = {};
    for (const d of c.deadlines.filter(x => SUBMIT.has(x.type))){
      const m = +d.date.slice(5,7);
      dl[m] = true;
      est[m] = (est[m] ?? true) && d.status !== "confirmed";
    }
    const mm = c.start_month;
    const marks = Object.keys(dl).map(Number).concat([mm]);
    const lo = Math.min(...marks), hi = Math.max(...marks);
    const cells = MONTHS.map((_,i) => {
      const m = i+1;
      const line = (m > lo && m < hi) ? `<span class="span"></span>` : "";
      if (m === mm) return `<td class="cell">${line}<span class="mk">■</span></td>`;
      if (dl[m]) return `<td class="cell">${line}<span class="mk dl ${est[m]?"est":""}">●</span></td>`;
      return `<td class="cell">${line}</td>`;
    }).join("");
    return `<tr class="g-${c.group}"><td class="nm"><a href="${c.link}" target="_blank" rel="noopener">${c.title}</a></td>${cells}</tr>`;
  }).join("");
}

function render(){
  document.getElementById("v-list").hidden = state.view !== "list";
  document.getElementById("v-cyc").hidden  = state.view !== "cyc";
  state.view === "list" ? renderList() : renderCycle();
}

for (const b of document.querySelectorAll("[data-v]")) b.onclick = () => {
  state.view = b.dataset.v;
  for (const o of document.querySelectorAll("[data-v]")) o.setAttribute("aria-pressed", o === b);
  render();
};
for (const b of document.querySelectorAll("[data-g]")) b.onclick = () => {
  state.group = b.dataset.g;
  for (const o of document.querySelectorAll("[data-g]")) o.setAttribute("aria-pressed", o === b);
  render();
};
document.getElementById("sub").onclick = e => {
  state.subOnly = !state.subOnly;
  e.target.setAttribute("aria-pressed", state.subOnly);
  render();
};
document.getElementById("q").oninput = e => { state.q = e.target.value; render(); };

const n = DATA.conferences.length,
      nn = DATA.conferences.filter(c => c.group === "neuro").length;
document.getElementById("sub").textContent =
  `${DATA.generated} 갱신 · ${n}개 학회 (뇌과학 ${nn} · AI ${n-nn})`;
document.getElementById("foot").innerHTML =
  `AI 학회 = <a href="https://github.com/huggingface/ai-deadlines" target="_blank" rel="noopener">huggingface/ai-deadlines</a> 업스트림 자동 반영.<br>
   뇌과학 학회 = 수동 큐레이션(<code>data/neuro.yml</code>). <b>추정</b>·<b>미공지</b> 표시가 붙은 마감은 공식 확정값이 아니므로 학회 사이트에서 반드시 재확인할 것.`;
render();
</script>
