<title>학회 레이더</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="학회 레이더">
<meta name="theme-color" content="#0d1014">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* 팔레트: 잉크/종이 중립색을 파랑 쪽으로 살짝 치우치게. 색은 두 영역 구분에만 쓴다 —
   AI=인디고, 뇌과학=앰버. 급함(urgent)만 별도 의미색. */
:root{
  --bg:#f6f7f9; --card:#fff; --fg:#161a1f; --dim:#5a6673; --faint:#8d97a4; --line:#e2e6ec;
  --ai:#3055b8; --ai-bg:#e7edfb; --neuro:#9a5a06; --neuro-bg:#fbeed8;
  --urgent:#b8302a; --shadow:0 1px 2px rgba(20,26,34,.06); --veil:rgba(22,26,31,.45);
  --sans:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Segoe UI,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1014; --card:#161a20; --fg:#e4e9ef; --dim:#8a94a2; --faint:#6b7684; --line:#262c35;
  --ai:#7fa3ee; --ai-bg:#1a2438; --neuro:#e0a24e; --neuro-bg:#2c2312;
  --urgent:#f07a70; --shadow:none; --veil:rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#0d1014; --card:#161a20; --fg:#e4e9ef; --dim:#8a94a2; --faint:#6b7684; --line:#262c35;
  --ai:#7fa3ee; --ai-bg:#1a2438; --neuro:#e0a24e; --neuro-bg:#2c2312;
  --urgent:#f07a70; --shadow:none; --veil:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:1000px;margin:0 auto;padding:16px 14px 64px}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0 0 3px}
.sub{color:var(--dim);font-size:12.5px;margin:0 0 12px}
.bars{position:sticky;top:0;background:var(--bg);z-index:6;padding:8px 0 9px;border-bottom:1px solid var(--line)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bar+.bar{margin-top:6px}
.bar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
.bar .lbl{color:var(--faint);font-size:11px;letter-spacing:.03em}
button{font:inherit;font-size:13px;padding:5px 11px;border:1px solid var(--line);border-radius:99px;
  background:var(--card);color:var(--dim);cursor:pointer}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
input[type=search]{font:inherit;font-size:13px;padding:5px 10px;border:1px solid var(--line);
  border-radius:99px;background:var(--card);color:var(--fg);flex:1;min-width:110px}
section[hidden]{display:none}

/* ── 마감 목록 ── */
h2.grp{font-size:11.5px;color:var(--dim);font-weight:600;margin:19px 0 7px;letter-spacing:.02em}
.card{box-shadow:var(--shadow);display:flex;gap:11px;align-items:flex-start;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px;cursor:pointer}
.card:hover{border-color:var(--faint)}
.dday{font:600 12px/1.25 var(--mono);font-variant-numeric:tabular-nums;min-width:54px;
  text-align:right;padding-top:3px;color:var(--dim)}
.dday.hot{color:var(--urgent)} .dday.past{opacity:.45}
.body{flex:1;min-width:0}
.name{font-weight:650;font-size:14.5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.star{background:none;border:0;padding:0 2px;font-size:14px;line-height:1;color:var(--faint);cursor:pointer}
.star.on{color:var(--neuro)}
.chip{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:5px;font-weight:600}
.chip.ai{background:var(--ai-bg);color:var(--ai)}
.chip.neuro{background:var(--neuro-bg);color:var(--neuro)}
.chip.t{background:transparent;border:1px solid var(--line);color:var(--dim);font-family:var(--mono)}
.chip.est{background:transparent;border:1px dashed var(--line);color:var(--dim)}
.meta{color:var(--dim);font-size:12.5px;margin-top:2px}
.meta b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;color:var(--fg)}
/* 규모 = 로그 스케일 막대. 참가자 수와 투고 편수는 단위가 달라 색으로 구분한다. */
.scale{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:11.5px;color:var(--dim)}
.track{flex:0 0 68px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.fill{display:block;height:100%;border-radius:3px}
.fill.submitted{background:var(--ai)} .fill.attendees{background:var(--neuro)}
.scale .n{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--fg);font-weight:600}

/* ── 연간 사이클 ── */
.cyc{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:660px;font-size:12.5px}
th,td{padding:0;text-align:center}
thead th{color:var(--dim);font-weight:500;font-size:11px;padding:7px 0;border-bottom:1px solid var(--line)}
th.nm,td.nm{position:sticky;left:0;background:var(--card);text-align:left;padding:0 10px;
  min-width:136px;max-width:136px;border-right:1px solid var(--line);z-index:2}
tbody tr{height:26px;cursor:pointer}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--fg) 3%,transparent)}
tbody tr:nth-child(even) td.nm{background:color-mix(in srgb,var(--fg) 3%,var(--card))}
.nm span.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cell{position:relative;height:26px}
.span{position:absolute;left:0;right:0;top:12px;height:2px;background:var(--line)}
.mk{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:15px;height:15px;
  border-radius:4px;font-size:9px;line-height:15px;color:#fff;font-weight:700}
.mk.dl{border-radius:50%}
.g-ai .mk{background:var(--ai)} .g-neuro .mk{background:var(--neuro)}
.mk.est{opacity:.45}
.legend{color:var(--dim);font-size:11.5px;margin:8px 2px 0;display:flex;gap:14px;flex-wrap:wrap}

/* ── 정보원 ── */
.srcgrp{margin-bottom:18px}
.srcgrp h3{font-size:12px;color:var(--dim);font-weight:600;margin:0 0 7px;letter-spacing:.02em}
.srcitem{display:block;background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:9px 12px;margin-bottom:6px;text-decoration:none;color:inherit;box-shadow:var(--shadow)}
.srcitem:hover{border-color:var(--faint)}
.srcitem .t{font-weight:600;font-size:14px}
.srcitem .u{font-family:var(--mono);font-size:11px;color:var(--faint);word-break:break-all}
.srcitem .n{color:var(--dim);font-size:12.5px;margin-top:1px}

/* ── 상세 ── */
.veil{position:fixed;inset:0;background:var(--veil);display:flex;align-items:flex-end;
  justify-content:center;z-index:20}
.veil[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;
  border-radius:14px 14px 0 0;padding:18px 18px 32px;border:1px solid var(--line)}
@media(min-width:660px){.veil{align-items:center}.sheet{border-radius:14px}}
.sheet h3{margin:0 0 3px;font-size:18px;font-weight:700}
.sheet .close{position:sticky;top:0;float:right;margin:-4px -4px 0 0}
.dl{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.dl .d{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--dim)}
.dl.done .l,.dl.done .d{opacity:.45;text-decoration:line-through}
.sheet h4{font-size:11.5px;color:var(--dim);font-weight:600;margin:18px 0 6px;letter-spacing:.02em}
.linkrow{display:flex;gap:6px;flex-wrap:wrap}
.linkrow a{font-size:12.5px;padding:5px 11px;border:1px solid var(--line);border-radius:99px;
  background:var(--card);color:var(--fg);text-decoration:none}
.linkrow a:hover{border-color:var(--faint)}
.note{color:var(--faint);font-size:11.5px;margin-top:7px;line-height:1.6}
.foot{color:var(--dim);font-size:11.5px;margin-top:26px;line-height:1.7}
.foot a{color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
<h1>🧠 학회 레이더</h1>
<p class="sub" id="sub"></p>

<div class="bars">
  <div class="bar">
    <button data-v="list" aria-pressed="true">마감 목록</button>

    <button data-v="src">정보원</button>
    <span class="sep"></span>
    <button data-g="all" aria-pressed="true">전체</button>

  </div>
  <div class="bar" id="bar2">

    <button data-s="tier">티어순</button>
    <button data-s="field">분야별</button>
    <span class="sep"></span>
    <button id="fav">★ 즐겨찾기</button>
    <button id="sub-only" aria-pressed="true">제출 마감만</button>

</div>

<section id="v-list"></section>

<section id="v-cyc" hidden>
  <div class="cyc"><table><thead><tr><th class="nm">학회</th></tr></thead><tbody></tbody></table></div>

    <span style="opacity:.5">흐림 = 추정/미공지</span>
    <span style="color:var(--ai)">파랑 AI</span><span style="color:var(--neuro)">주황 뇌과학</span></p>
</section>

<section id="v-src" hidden></section>

<p class="foot" id="foot"></p>
</div>

const state = {view:"list", group:"all", tier:2, sort:"deadline", q:"", subOnly:true,
               favOnly:false, fav:loadFav()};

const days  = iso => Math.round((new Date(iso+"T23:59:59") - TODAY)/864e5);  // 마감 = 그날 끝
const until = iso => Math.round((new Date(iso+"T00:00:00") - TODAY)/864e5);  // 개최 = 그날 시작
const fmt  = iso => iso.slice(2).replace(/-/g,".");
const num  = n => n.toLocaleString("en-US");
const esc  = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dlsOf = c => state.subOnly ? c.deadlines.filter(d => SUBMIT.has(d.type)) : c.deadlines;
const nextDl = c => dlsOf(c).find(d => days(d.date) >= 0) || null;

// 규모 막대는 지표별 로그 스케일. 650~30,000 을 선형으로 그리면 작은 학회가 전부 0 이 된다.
const SPAN = {submitted:[500, 30000], attendees:[300, 40000]};
function scalePct(sc){
  const [lo,hi] = SPAN[sc.metric] || [1,1e5];
  const p = (Math.log10(sc.value) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo));
  return Math.max(6, Math.min(100, Math.round(p*100)));
}

function visible(){
  const q = state.q.trim().toLowerCase();
  return DATA.conferences.filter(c =>
    (state.group === "all" || c.group === state.group) &&
    c.tier <= state.tier &&
    (!state.favOnly || state.fav.has(c.id)) &&
    (!q || (c.title+" "+c.full_name+" "+c.city+" "+FIELD[c.field]+" "+c.tags.join(" ")).toLowerCase().includes(q)));
}

function cardHTML(c){
  const d = nextDl(c), n = d ? days(d.date) : null, m = until(c.start);
  const dd  = d ? `D-${n}` : (m >= 0 ? `개최 D-${m}` : "진행 중");
  const hot = d ? n <= 14 : m <= 14;
  const est = d && d.status !== "confirmed";
  const sc  = c.scale;
  return `<div class="card" data-id="${c.id}">
    <div class="dday ${hot?"hot":""} ${d?"":"past"}">${dd}</div>
    <div class="body">
      <div class="name">
        <button class="star ${state.fav.has(c.id)?"on":""}" data-fav="${c.id}"
          aria-label="즐겨찾기">${state.fav.has(c.id)?"★":"☆"}</button>
        ${esc(c.title)} ${c.year}
        <span class="chip ${c.group}">${c.group==="ai"?"AI":"뇌과학"}</span>
        <span class="chip t">T${c.tier}</span>
        ${est?`<span class="chip est">${d.status==="tba"?"미공지":"추정"}</span>`:""}
      </div>
      <div class="meta">${d?`<b>${fmt(d.date)}</b> ${esc(d.label)}`:"제출 마감 종료"}</div>
      <div class="meta">📍 ${esc(c.date_text || fmt(c.start))} · ${esc([c.city,c.country].filter(Boolean).join(", "))}</div>
      ${sc?`<div class="scale"><span class="track"><span class="fill ${sc.metric}"
            style="width:${scalePct(sc)}%"></span></span>
            <span><span class="n">${num(sc.value)}</span> ${METRIC[sc.metric]} · ${sc.year}</span></div>`
        :`<div class="scale"><span class="track"></span><span style="opacity:.6">규모 미상</span></div>`}
    </div></div>`;
}

function renderList(){
  const items = visible().map(c => ({c, d:nextDl(c)}));
  const byDeadline = (a,b) => {
    const A = a.d ? days(a.d.date) : 1e6 + until(a.c.start), B = b.d ? days(b.d.date) : 1e6 + until(b.c.start);
    return A - B;
  };
  let groups;
  if (state.sort === "field"){
    const m = new Map();
    for (const x of items.sort(byDeadline)) (m.get(x.c.field) ?? m.set(x.c.field, []).get(x.c.field)).push(x);
    groups = [...m].map(([f, rows]) => [FIELD[f] || f, rows]);
  } else if (state.sort === "scale"){
    // 규모는 지표가 다르면 비교가 성립하지 않는다. 지표별로 나눠 정렬한다.
    const has = items.filter(x => x.c.scale), no = items.filter(x => !x.c.scale);
    const m = new Map();
    for (const x of has.sort((a,b) => b.c.scale.value - a.c.scale.value))
      (m.get(x.c.scale.metric) ?? m.set(x.c.scale.metric, []).get(x.c.scale.metric)).push(x);
    groups = [...m].map(([k, rows]) => [`${METRIC[k]} 규모순 (${k==="submitted"?"논문 투고 편수":"참가자 수"})`, rows]);
    if (no.length) groups.push(["규모 미상", no.sort(byDeadline)]);
  } else if (state.sort === "tier"){
    const m = new Map();
    for (const x of items.sort((a,b) => a.c.tier - b.c.tier || byDeadline(a,b))) 
      (m.get(x.c.tier) ?? m.set(x.c.tier, []).get(x.c.tier)).push(x);
    groups = [...m].map(([t, rows]) => [`T${t} — ${["","반드시 챙길 학회","관련 있는 학회","참고"][t]}`, rows]);
  } else if (state.sort === "start"){
    groups = [["개최일 순", items.sort((a,b) => a.c.start.localeCompare(b.c.start))]];
  } else {
    const s = items.sort(byDeadline);
    groups = [["🔥 2주 내",        s.filter(x => x.d && days(x.d.date) <= 14)],
              ["다가오는 마감 (3개월)", s.filter(x => x.d && days(x.d.date) > 14 && days(x.d.date) <= 92)],
              ["그 이후",          s.filter(x => x.d && days(x.d.date) > 92)],
              ["제출 마감 종료 · 개최 예정", s.filter(x => !x.d).sort((a,b) => a.c.start.localeCompare(b.c.start))]];
  }
  const html = groups.filter(([,r]) => r.length)
    .map(([label, rows]) => `<h2 class="grp">${esc(label)}</h2>` + rows.map(x => cardHTML(x.c)).join(""))
    .join("");
  document.getElementById("v-list").innerHTML = html || `<p class="meta">해당 학회 없음</p>`;
}

function renderCycle(){
  const byTitle = new Map();   // 연 주기를 보는 뷰라 SIGGRAPH 2026/2027 을 두 줄로 두면 중복이다
  for (const c of visible().slice().sort((a,b) => a.start.localeCompare(b.start)))
    if (!byTitle.has(c.title)) byTitle.set(c.title, c);
  const rows = [...byTitle.values()].sort((a,b) => a.start_month - b.start_month || a.title.localeCompare(b.title));
  document.querySelector("#v-cyc thead tr").innerHTML =
    `<th class="nm">학회</th>` + MONTHS.map(m => `<th>${m}</th>`).join("");
  document.querySelector("#v-cyc tbody").innerHTML = rows.map(c => {
    const dl = {}, est = {};
    for (const d of c.deadlines.filter(x => SUBMIT.has(x.type))){
      const m = +d.date.slice(5,7);
      dl[m] = true; est[m] = (est[m] ?? true) && d.status !== "confirmed";
    }
    const mm = c.start_month, marks = Object.keys(dl).map(Number).concat([mm]);
    const lo = Math.min(...marks), hi = Math.max(...marks);
    const cells = MONTHS.map((_,i) => {
      const m = i+1, line = (m > lo && m < hi) ? `<span class="span"></span>` : "";
      if (m === mm)  return `<td class="cell">${line}<span class="mk">■</span></td>`;
      if (dl[m])     return `<td class="cell">${line}<span class="mk dl ${est[m]?"est":""}">●</span></td>`;
      return `<td class="cell">${line}</td>`;
    }).join("");
    return `<tr class="g-${c.group}" data-id="${c.id}"><td class="nm"><span class="t">${esc(c.title)}</span></td>${cells}</tr>`;
  }).join("");
}

function renderSources(){
  document.getElementById("v-src").innerHTML = DATA.sources.map(g => `
    <div class="srcgrp"><h3>${esc(g.group)}</h3>` + g.items.map(i => `
      <a class="srcitem" href="${esc(i.url)}" target="_blank" rel="noopener">
        <div class="t">${esc(i.name)}</div>
        ${i.note?`<div class="n">${esc(i.note)}</div>`:""}
        <div class="u">${esc(i.url)}</div></a>`).join("") + `</div>`).join("");
}

/* 추세 차트: 연도 사이 간격이 들쭉날쭉하므로 시간축이 아니라 이산 범주로 그린다.
   있는 해만 막대로 세우고, 없는 해를 보간하지 않는다. */
function trendSVG(hist){
  // viewBox 좌표로만 계산한다. 막대 높이를 100%로 잡으면 그 위의 값 라벨이 캔버스 밖으로 나간다
  // (실제로 최대 막대의 숫자가 잘렸다) — 위에 라벨 높이만큼 여백을 확보한다.
  const W = 400, H = 130, TOP = 16, BASE = 88, BAND = BASE - TOP;
  const n = hist.length, cw = W/n, max = Math.max(...hist.map(h => h.submitted));
  const g = hist.map((h,i) => {
    const bh = Math.max(3, Math.round(h.submitted/max*BAND));
    const x = i*cw + cw*0.2, w = cw*0.6, y = BASE - bh, cx = i*cw + cw/2;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${bh}"
              fill="var(--ai)" rx="2"></rect>
            <text x="${cx.toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="10"
              font-weight="600" fill="var(--fg)">${num(h.submitted)}</text>
            <text x="${cx.toFixed(1)}" y="${BASE+13}" text-anchor="middle" font-size="10"
              fill="var(--neuro)">${(h.rate*100).toFixed(1)}%</text>
            <text x="${cx.toFixed(1)}" y="${BASE+26}" text-anchor="middle" font-size="10"
              fill="var(--dim)">${h.year}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="height:auto;display:block" role="img"
      aria-label="연도별 투고 편수와 채택률">
      <line x1="0" y1="${BASE}" x2="${W}" y2="${BASE}" stroke="var(--line)" stroke-width="1"></line>
      ${g}</svg>
    <p class="note">막대 = 투고 편수 · 주황 = 채택률. 출처가 연도마다 다르고, 빠진 해는
    데이터가 없는 것이지 0 이 아니다. 연도 간격이 일정하지 않으므로 시간축이 아니라 나열이다.</p>`;
}

function openDetail(id){
  const c = DATA.conferences.find(x => x.id === id);
  if (!c) return;
  const dls = c.deadlines.map(d => {
    const n = days(d.date), tag = d.status === "confirmed" ? "" :
      ` <span class="chip est">${d.status==="tba"?"미공지":"추정"}</span>`;
    return `<div class="dl ${n<0?"done":""}"><span class="l">${esc(d.label)}${tag}</span>
      <span class="d">${fmt(d.date)}${d.tz?" "+esc(d.tz):""} ${n>=0?`· D-${n}`:""}</span></div>`;
  }).join("") || `<p class="note">공지된 마감 없음 (업스트림 미등록 또는 학회 미발표)</p>`;
  const sc = c.scale;
  const links = [["학회 사이트", c.link], ...c.links.map(([a,b]) => [a,b])]
    .filter(([,u]) => u).map(([t,u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)} ↗</a>`).join("");
  document.getElementById("sheet").innerHTML = `
    <button class="close" id="x">닫기</button>
    <h3>${esc(c.title)} ${c.year}</h3>
    <p class="meta">${esc(c.full_name || "")}</p>
    <p class="meta">📍 ${esc(c.date_text)} · ${esc(c.venue || [c.city,c.country].filter(Boolean).join(", "))}</p>
    <p class="meta"><span class="chip ${c.group}">${c.group==="ai"?"AI":"뇌과학"}</span>
      <span class="chip t">T${c.tier}</span> ${esc(FIELD[c.field]||c.field)}</p>

    <h4>일정</h4>${dls}

    <h4>규모</h4>
    ${sc ? `<p class="meta"><b>${num(sc.value)}</b> ${sc.metric==="submitted"?"편 투고":"명 참가"} (${sc.year})
             ${sc.source?`· <a href="${esc(sc.source)}" target="_blank" rel="noopener">출처 ↗</a>`:""}</p>`
         : `<p class="note">근거 있는 규모 수치를 찾지 못했다. 추측으로 채우지 않는다.</p>`}
    ${c.history.length ? `<h4>연도별 투고·채택 추세</h4>${trendSVG(c.history)}` : ""}

    <h4>바로 가기</h4><div class="linkrow">${links}</div>
    ${c.verified ? `<p class="note">이 항목의 날짜는 ${esc(c.verified)} 에
      <a href="${esc(c.source)}" target="_blank" rel="noopener">출처</a> 에서 확인했다.</p>` : ""}`;
  document.getElementById("veil").hidden = false;
  document.getElementById("x").onclick = closeDetail;
}
const closeDetail = () => { document.getElementById("veil").hidden = true; };
document.getElementById("veil").onclick = e => { if (e.target.id === "veil") closeDetail(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });

function render(){
  for (const [v, el] of [["list","v-list"],["cyc","v-cyc"],["src","v-src"]])
    document.getElementById(el).hidden = state.view !== v;
  document.getElementById("bar2").style.display = state.view === "src" ? "none" : "";
  if (state.view === "list") renderList();
  else if (state.view === "cyc") renderCycle();
  else renderSources();
}

function bindGroup(sel, apply){
  for (const b of document.querySelectorAll(sel)) b.onclick = () => {
    apply(b);
    for (const o of document.querySelectorAll(sel)) o.setAttribute("aria-pressed", o === b);
    render();
  };
}
bindGroup("[data-v]", b => state.view  = b.dataset.v);
bindGroup("[data-g]", b => state.group = b.dataset.g);
bindGroup("[data-t]", b => state.tier  = +b.dataset.t);
bindGroup("[data-s]", b => state.sort  = b.dataset.s);
document.getElementById("fav").onclick = e => {
  state.favOnly = !state.favOnly;
  e.target.setAttribute("aria-pressed", state.favOnly); render();
};
document.getElementById("sub-only").onclick = e => {
  state.subOnly = !state.subOnly;
  e.target.setAttribute("aria-pressed", state.subOnly); render();
};
document.getElementById("q").oninput = e => { state.q = e.target.value; render(); };

// 카드/행 클릭 = 상세. 별 클릭은 상세를 열지 않는다.
document.addEventListener("click", e => {
  const star = e.target.closest("[data-fav]");
  if (star){
    e.stopPropagation();
    const id = star.dataset.fav;
    state.fav.has(id) ? state.fav.delete(id) : state.fav.add(id);
    saveFav(state.fav); render(); return;
  }
  const row = e.target.closest("[data-id]");
  if (row && !e.target.closest("a")) openDetail(row.dataset.id);
});

const n = DATA.conferences.length, nn = DATA.conferences.filter(c => c.group === "neuro").length;
document.getElementById("sub").textContent =
  `${DATA.generated} 갱신 · ${n}개 학회 (뇌과학 ${nn} · AI ${n-nn}) · 카드를 누르면 상세`;
document.getElementById("foot").innerHTML =
  `AI 학회 마감 = <a href="https://github.com/huggingface/ai-deadlines" target="_blank" rel="noopener">huggingface/ai-deadlines</a>,
   투고·채택 수 = <a href="https://github.com/ccfddl/ccf-deadlines" target="_blank" rel="noopener">ccfddl/ccf-deadlines</a> 업스트림 자동 반영.<br>
   뇌과학 학회 = 수동 큐레이션(<code>data/neuro.yml</code>). <b>추정</b>·<b>미공지</b> 배지가 붙은 마감은
   공식 확정값이 아니므로 학회 사이트에서 반드시 재확인할 것.<br>
   티어(T1/T2/T3)는 학회 등급이 아니라 <b>이 사람 기준 관심 우선순위</b>다.`;
render();
</script>
