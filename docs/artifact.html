<title>학회 레이더</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="학회 레이더">
<meta name="theme-color" content="#0d1014">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 팔레트: 잉크/종이 중립색을 파랑 쪽으로 살짝 치우치게. 색은 두 영역 구분에만 쓴다 —
   AI=인디고, 뇌과학=앰버. 급함(urgent)만 별도 의미색. */
:root{
  --bg:#f6f7f9; --card:#fff; --fg:#161a1f; --dim:#5a6673; --faint:#8d97a4; --line:#e2e6ec;
  --ai:#3055b8; --ai-bg:#e7edfb; --neuro:#9a5a06; --neuro-bg:#fbeed8;
  --urgent:#b8302a; --shadow:0 1px 2px rgba(20,26,34,.06); --veil:rgba(22,26,31,.45);
  --sans:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Segoe UI,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1014; --card:#161a20; --fg:#e4e9ef; --dim:#8a94a2; --faint:#6b7684; --line:#262c35;
  --ai:#7fa3ee; --ai-bg:#1a2438; --neuro:#e0a24e; --neuro-bg:#2c2312;
  --urgent:#f07a70; --shadow:none; --veil:rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#0d1014; --card:#161a20; --fg:#e4e9ef; --dim:#8a94a2; --faint:#6b7684; --line:#262c35;
  --ai:#7fa3ee; --ai-bg:#1a2438; --neuro:#e0a24e; --neuro-bg:#2c2312;
  --urgent:#f07a70; --shadow:none; --veil:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:1000px;margin:0 auto;padding:16px 14px 64px}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0 0 3px}
.sub{color:var(--dim);font-size:12.5px;margin:0 0 12px}
.bars{position:sticky;top:0;background:var(--bg);z-index:6;padding:8px 0 9px;border-bottom:1px solid var(--line)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bar+.bar{margin-top:6px}
.bar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
.bar .lbl{color:var(--faint);font-size:11px;letter-spacing:.03em}
button{font:inherit;font-size:13px;padding:5px 11px;border:1px solid var(--line);border-radius:99px;
  background:var(--card);color:var(--dim);cursor:pointer}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
input[type=search]{font:inherit;font-size:13px;padding:5px 10px;border:1px solid var(--line);
  border-radius:99px;background:var(--card);color:var(--fg);flex:1;min-width:110px}
section[hidden]{display:none}

/* ── 마감 목록 ── */
h2.grp{font-size:11.5px;color:var(--dim);font-weight:600;margin:19px 0 7px;letter-spacing:.02em}
.card{box-shadow:var(--shadow);display:flex;gap:11px;align-items:flex-start;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px;cursor:pointer}
.card:hover{border-color:var(--faint)}
.dday{font:600 12px/1.25 var(--mono);font-variant-numeric:tabular-nums;min-width:54px;
  text-align:right;padding-top:3px;color:var(--dim)}
.dday.hot{color:var(--urgent)} .dday.past{opacity:.45}
.body{flex:1;min-width:0}
.name{font-weight:650;font-size:14.5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.star{background:none;border:0;padding:0 2px;font-size:14px;line-height:1;color:var(--faint);cursor:pointer}
.star.on{color:var(--neuro)}
.chip{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:5px;font-weight:600}
.chip.ai{background:var(--ai-bg);color:var(--ai)}
.chip.neuro{background:var(--neuro-bg);color:var(--neuro)}
.chip.t{background:transparent;border:1px solid var(--line);color:var(--dim);font-family:var(--mono)}
.chip.est{background:transparent;border:1px dashed var(--line);color:var(--dim)}
.chip.r{background:transparent;border:1px solid var(--line);color:var(--dim);font-family:var(--mono);font-size:10px}
.chip.p{background:color-mix(in srgb,var(--neuro) 14%,transparent);color:var(--neuro)}
.meta{color:var(--dim);font-size:12.5px;margin-top:2px}
.meta b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;color:var(--fg)}
/* 규모 = 로그 스케일 막대. 참가자 수와 투고 편수는 단위가 달라 색으로 구분한다. */
.scale{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:11.5px;color:var(--dim)}
.track{flex:0 0 68px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.fill{display:block;height:100%;border-radius:3px}
.fill.submitted{background:var(--ai)} .fill.attendees{background:var(--neuro)}
.scale .n{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--fg);font-weight:600}

/* ── 칸반: 마감 임박도를 열로. 열 자체가 순서라 세로 정렬은 선택한 정렬 기준을 따른다 ── */
.kb{display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.kbcol{flex:0 0 268px;min-width:268px}
.kbhead{font-size:11.5px;font-weight:600;color:var(--dim);padding:0 2px 7px;
  display:flex;justify-content:space-between;align-items:baseline}
.kbhead .c{font-family:var(--mono);color:var(--faint)}
.kbcard{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px;
  margin-bottom:7px;cursor:pointer;box-shadow:var(--shadow)}
.kbcard:hover{border-color:var(--faint)}
.kbcard .top{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.kbcard .dd{font:600 11.5px var(--mono);font-variant-numeric:tabular-nums;color:var(--dim)}
.kbcard .dd.hot{color:var(--urgent)}
.kbcard .nm2{font-weight:650;font-size:13.5px}
.kbcard .sm{color:var(--dim);font-size:11.5px;margin-top:3px}
.kbcard .sm b{font-family:var(--mono);color:var(--fg);font-weight:600}

/* ── 테이블: 훑기용 고밀도 뷰. 정렬은 위 정렬 바를 그대로 쓴다(로직 중복 없음) ── */
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);
  border-radius:10px;background:var(--card)}
table.dense{border-collapse:collapse;width:100%;min-width:780px;font-size:12.5px}
table.dense th{position:sticky;top:0;background:var(--card);color:var(--dim);font-weight:600;
  font-size:11px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.dense th.on{color:var(--fg)}
table.dense td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.dense tr:last-child td{border-bottom:0}
table.dense tbody tr{cursor:pointer}
table.dense tbody tr:hover{background:color-mix(in srgb,var(--fg) 4%,transparent)}
table.dense .n{font-family:var(--mono);font-variant-numeric:tabular-nums}
table.dense td.w{white-space:normal;min-width:150px}

/* ── 지도: equirectangular. 타일 지도는 아티팩트 CSP 가 외부 이미지를 막으므로 쓸 수 없다.
   육지 윤곽을 SVG 로 인라인하면 오프라인·아티팩트·Pages 어디서나 같게 뜬다 ── */
.mapwrap{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow-x:auto;
  -webkit-overflow-scrolling:touch}
.mapwrap svg{display:block;min-width:860px;width:100%;height:auto}
.land{fill:color-mix(in srgb,var(--fg) 9%,transparent);stroke:var(--line);stroke-width:.5}
.pt{cursor:pointer}
.pt circle{stroke:var(--card);stroke-width:1.2}
.pt.ai circle{fill:var(--ai)} .pt.neuro circle{fill:var(--neuro)}
.pt.mixed circle{fill:var(--neuro);stroke:var(--ai);stroke-width:2}
.pt text{fill:var(--fg);font-size:9px;font-weight:600;paint-order:stroke;
  stroke:var(--card);stroke-width:2.5px;pointer-events:none}
.pt:hover circle{stroke:var(--fg);stroke-width:2}
.citylist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:7px;margin-top:12px}
.cityrow{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 11px;
  cursor:pointer;box-shadow:var(--shadow)}
.cityrow:hover{border-color:var(--faint)}
.cityrow .c{font-weight:650;font-size:13.5px}
.cityrow .l{color:var(--dim);font-size:11.5px;margin-top:2px;line-height:1.45}

/* ── 연간 사이클 ── */
.cyc{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:660px;font-size:12.5px}
th,td{padding:0;text-align:center}
thead th{color:var(--dim);font-weight:500;font-size:11px;padding:7px 0;border-bottom:1px solid var(--line)}
th.nm,td.nm{position:sticky;left:0;background:var(--card);text-align:left;padding:0 10px;
  min-width:136px;max-width:136px;border-right:1px solid var(--line);z-index:2}
tbody tr{height:26px;cursor:pointer}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--fg) 3%,transparent)}
tbody tr:nth-child(even) td.nm{background:color-mix(in srgb,var(--fg) 3%,var(--card))}
.nm span.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cell{position:relative;height:26px}
.span{position:absolute;left:0;right:0;top:12px;height:2px;background:var(--line)}
.mk{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:15px;height:15px;
  border-radius:4px;font-size:9px;line-height:15px;color:#fff;font-weight:700}
.mk.dl{border-radius:50%}
.g-ai .mk{background:var(--ai)} .g-neuro .mk{background:var(--neuro)}
.mk.est{opacity:.45}
.legend{color:var(--dim);font-size:11.5px;margin:8px 2px 0;display:flex;gap:14px;flex-wrap:wrap}

/* ── 정보원 ── */
.srcgrp{margin-bottom:18px}
.srcgrp h3{font-size:12px;color:var(--dim);font-weight:600;margin:0 0 7px;letter-spacing:.02em}
.srcitem{display:block;background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:9px 12px;margin-bottom:6px;text-decoration:none;color:inherit;box-shadow:var(--shadow)}
.srcitem:hover{border-color:var(--faint)}
.srcitem .t{font-weight:600;font-size:14px}
.srcitem .u{font-family:var(--mono);font-size:11px;color:var(--faint);word-break:break-all}
.srcitem .n{color:var(--dim);font-size:12.5px;margin-top:1px}

/* ── 상세 ── */
.veil{position:fixed;inset:0;background:var(--veil);display:flex;align-items:flex-end;
  justify-content:center;z-index:20}
.veil[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;
  border-radius:14px 14px 0 0;padding:18px 18px 32px;border:1px solid var(--line)}
@media(min-width:660px){.veil{align-items:center}.sheet{border-radius:14px}}
.sheet h3{margin:0 0 3px;font-size:18px;font-weight:700}
.sheet .close{position:sticky;top:0;float:right;margin:-4px -4px 0 0}
.dl{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.dl .d{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--dim)}
.dl.done .l,.dl.done .d{opacity:.45;text-decoration:line-through}
.sheet h4{font-size:11.5px;color:var(--dim);font-weight:600;margin:18px 0 6px;letter-spacing:.02em}
.linkrow{display:flex;gap:6px;flex-wrap:wrap}
.linkrow a{font-size:12.5px;padding:5px 11px;border:1px solid var(--line);border-radius:99px;
  background:var(--card);color:var(--fg);text-decoration:none}
.linkrow a:hover{border-color:var(--faint)}
.note{color:var(--faint);font-size:11.5px;margin-top:7px;line-height:1.6}
.foot{color:var(--dim);font-size:11.5px;margin-top:26px;line-height:1.7}
.foot a{color:var(--dim)}
.toprow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.toprow>.bar{display:contents}
.toprow>.bar.views::after{content:"";width:1px;height:18px;background:var(--line);margin:0 3px}
.bar.views i{display:none}
.bar.views b{font-weight:inherit}
.bar.views s{display:none;text-decoration:none}

/* ── 폰 UX (≤600px) ─────────────────────────────────────────────────────────
   같은 파일 안에서 CSS 로만 가른다. 프레임워크도, 두 번째 코드베이스도 쓰지 않는다.
   1) 뷰 전환 = 하단 고정 탭바 — 엄지 위치에 맞고, 위쪽 6개 버튼이 두 줄로 깨지지 않는다
   2) 필터·정렬 = 가로 스크롤 한 줄 — 줄바꿈으로 헤더가 화면 절반을 먹던 문제
   3) 지도 = 도시 목록을 위로 — 폰에서 지도 점은 사실상 누를 수 없다            */
@media (max-width:600px){
  .wrap{padding-bottom:74px}
  .bars{padding-top:6px}
  .bar.filters,#bar2{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;padding-bottom:2px}
  .bar.filters::-webkit-scrollbar,#bar2::-webkit-scrollbar{display:none}
  .bar.filters>*,#bar2>*{flex:0 0 auto}
  #q{min-width:120px}

  .toprow{display:block}
  .toprow>.bar{display:flex}
  .toprow>.bar.views::after{display:none}
  .bar.views{position:fixed;left:0;right:0;bottom:0;z-index:12;margin:0;gap:0;
    background:var(--card);border-top:1px solid var(--line);
    padding:5px 4px calc(5px + env(safe-area-inset-bottom));
    justify-content:space-around;flex-wrap:nowrap}
  .bar.views button{border:0;background:none;border-radius:9px;padding:5px 4px;flex:1;
    display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;min-width:0}
  .bar.views button[aria-pressed="true"]{background:none;color:var(--ai)}
  .bar.views i{display:block;font-style:normal;font-size:17px;line-height:1}
  .bar.views b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .bar.views button:has(s) b{display:none}
  .bar.views s{display:block;font-weight:600}

  #v-map{display:flex;flex-direction:column}
  #v-map .citylist{order:1;margin-top:0}
  #v-map .bar{order:0}
  #v-map .mapwrap{order:3;margin-top:12px}
  #v-map .legend{order:4}
  .citylist{grid-template-columns:1fr}
  .kbcol{flex:0 0 84vw;min-width:84vw}
  .sheet{max-height:92vh}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
<h1>🧠 학회 레이더</h1>
<p class="sub" id="sub"></p>

<div class="bars">
  <div class="toprow">
  <div class="bar views">
    <button data-v="list" aria-pressed="true"><i>▤</i><b>목록</b></button>
    <button data-v="kb"><i>▥</i><b>칸반</b></button>
    <button data-v="tbl"><i>▦</i><b>표</b></button>
    <button data-v="map"><i>◍</i><b>지도</b></button>
    <button data-v="cyc"><i>◷</i><b>연간 사이클</b><s>주기</s></button>
    <button data-v="src"><i>⚑</i><b>정보원</b><s>정보</s></button>
  </div>
  <div class="bar filters">
    <button data-g="all" aria-pressed="true">전체</button>
    <button data-g="neuro">뇌과학</button>
    <button data-g="ai">AI</button>
    <span class="sep"></span>
    <button data-t="2" aria-pressed="true">T1·2</button>
    <button data-t="1">T1만</button>
    <button data-t="3">전체 티어</button>
  </div>
  </div>
  <div class="bar" id="bar2">
    <span class="lbl">정렬</span>
    <button data-s="deadline" aria-pressed="true">마감순</button>
    <button data-s="start">개최일순</button>
    <button data-s="scale">규모순</button>
    <button data-s="tier">티어순</button>
    <button data-s="rank">등급순</button>
    <button data-s="cycle">주기순</button>
    <button data-s="field">분야별</button>
    <span class="sep"></span>
    <button id="fav">★ 즐겨찾기</button>
    <button id="sub-only" aria-pressed="true">제출 마감만</button>
    <input type="search" id="q" placeholder="학회 검색">
  </div>
</div>

<section id="v-list"></section>

<section id="v-kb" hidden><div class="kb"></div></section>

<section id="v-tbl" hidden><div class="tbl"><table class="dense">
  <thead><tr></tr></thead><tbody></tbody></table></div></section>

<section id="v-map" hidden>
  <div class="bar" style="margin-bottom:9px">
    <span class="lbl">지도</span>
    <button data-m="next" aria-pressed="true">차기 개최</button>
    <button data-m="all">역대 전체</button>
  </div>
  <div class="mapwrap"></div>
  <p class="legend"><span style="color:var(--ai)">● AI</span>
    <span style="color:var(--neuro)">● 뇌과학</span>
    <span>원 크기 = 그 도시에서 열린 회차 수</span>
    <span style="opacity:.7">온라인 회차는 좌표가 없어 지도에 없다</span></p>
  <div class="citylist"></div>
</section>

<section id="v-cyc" hidden>
  <div class="cyc"><table><thead><tr><th class="nm">학회</th></tr></thead><tbody></tbody></table></div>
  <p class="legend"><span>● 제출 마감</span><span>■ 개최</span>
    <span style="opacity:.5">흐림 = 추정/미공지</span>
    <span style="color:var(--ai)">파랑 AI</span><span style="color:var(--neuro)">주황 뇌과학</span></p>
</section>

<section id="v-src" hidden></section>

<p class="foot" id="foot"></p>
</div>

const TODAY = new Date(new Date().toDateString());
const MONTHS = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
const FIELD = {ml:"머신러닝", vision:"비전·3D", nlp:"자연어·음성", robotics:"로보틱스",
               medical:"의료영상", neuro:"신경과학", neuroimaging:"뇌영상", cognitive:"인지·시지각"};
const METRIC = {submitted:"투고", attendees:"참가"};
const KIND = {shared_review:"공용 리뷰", journal_option:"저널 연계", journal_invite:"저널 초청",
              society_journal:"학회 저널", none:"제도 없음"};
// 실제로 "내야 하는" 마감. notification·rebuttal·camera_ready 는 그 질문의 답이 아니다.
const SUBMIT = new Set(["abstract","paper","submission","supplementary","abstract_late"]);
const RANKORD = {"A*":0, "A":1, "B":2, "C":3};

const FAV_KEY = "confradar:fav";
const loadFav = () => { try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY)) || []); }
                        catch { return new Set(); } };
const saveFav = s => { try { localStorage.setItem(FAV_KEY, JSON.stringify([...s])); } catch {} };

const state = {view:"list", group:"all", tier:2, sort:"deadline", q:"", subOnly:true,
               favOnly:false, mapMode:"next", fav:loadFav()};

const days  = iso => Math.floor((new Date(iso+"T23:59:59") - TODAY)/864e5);  // 마감 = 그날 끝, 오늘 = 0
const until = iso => Math.floor((new Date(iso+"T00:00:00") - TODAY)/864e5);  // 개최 = 그날 시작
const fmt   = iso => iso.slice(2).replace(/-/g,".");
const num   = n => n.toLocaleString("en-US");
const dday  = n => n === 0 ? "오늘" : `D-${n}`;
const esc   = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dlsOf = c => state.subOnly ? c.deadlines.filter(d => SUBMIT.has(d.type)) : c.deadlines;
const nextDl = c => dlsOf(c).find(d => days(d.date) >= 0) || null;
const meetState = c => { if (!c.start) return "";
  const a = until(c.start), b = until(c.end || c.start);
  return a >= 0 ? `개최 ${dday(a)}` : (b >= 0 ? "진행 중" : "종료"); };
// 차기 회차가 공지되지 않은 학회의 대체 표시. 과거 회차에서 유도한 전형 시기다.
const typicalText = c => {
  const t = c.typical;
  const d = t.deadline_month ? `${t.deadline_month}월 마감` : "마감 표본 없음";
  return `전형 ${d} · ${t.meeting_month}월 개최 (${t.years[0]}-${t.years[1]}, ${t.n_meeting}회)`;
};

// 규모 막대는 지표별 로그 스케일. 650~30,000 을 선형으로 그리면 작은 학회가 전부 0 이 된다.
const SPAN = {submitted:[500, 30000], attendees:[300, 40000]};
function scalePct(sc){
  const [lo,hi] = SPAN[sc.metric] || [1,1e5];
  const p = (Math.log10(sc.value) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo));
  return Math.max(6, Math.min(100, Math.round(p*100)));
}
const rankChip = c => c.rank.core ? `<span class="chip r">CORE ${esc(c.rank.core)}</span>` : "";
const progChip = c => c.programs.length
  ? `<span class="chip p" title="${esc(c.programs[0].name)}">${esc(KIND[c.programs[0].kind] || "연계")}</span>` : "";

function visible(){
  const q = state.q.trim().toLowerCase();
  return DATA.series.filter(c =>
    (state.group === "all" || c.group === state.group) &&
    c.tier <= state.tier &&
    (!state.favOnly || state.fav.has(c.id)) &&
    (!q || c.search.includes(q) || (FIELD[c.field]||"").includes(q)));
}

function cardHTML(c){
  const d = nextDl(c), n = d ? days(d.date) : null;
  const dd = d ? dday(n) : (meetState(c) || "미공지");
  const hot = d ? n <= 14 : false;
  const est = d && d.status !== "confirmed";
  const sc = c.scale;
  return `<div class="card" data-id="${c.id}">
    <div class="dday ${hot?"hot":""} ${d?"":"past"}">${dd}</div>
    <div class="body">
      <div class="name">
        <button class="star ${state.fav.has(c.id)?"on":""}" data-fav="${c.id}"
          aria-label="즐겨찾기">${state.fav.has(c.id)?"★":"☆"}</button>
        ${esc(c.title)}${c.next?" "+c.next:""}
        <span class="chip ${c.group}">${c.group==="ai"?"AI":"뇌과학"}</span>
        <span class="chip t">T${c.tier}</span>${rankChip(c)}${progChip(c)}
        ${est?`<span class="chip est">${d.status==="tba"?"미공지":"추정"}</span>`:""}
      </div>
      <div class="meta">${d ? `<b>${fmt(d.date)}</b> ${esc(d.label)}`
                            : (c.next ? "제출 마감 종료" : "차기 회차 미공지")}</div>
      <div class="meta">${c.next ? `📍 ${esc(c.date_text)} · ${esc([c.city,c.country].filter(Boolean).join(", "))}`
                                 : `🔁 ${esc(typicalText(c))}`}</div>
      ${sc?`<div class="scale"><span class="track"><span class="fill ${sc.metric}"
            style="width:${scalePct(sc)}%"></span></span>
            <span><span class="n">${num(sc.value)}</span> ${METRIC[sc.metric]} · ${sc.year}</span></div>`
        :`<div class="scale"><span class="track"></span><span style="opacity:.6">규모 미상</span></div>`}
    </div></div>`;
}

// 목록·칸반·표가 같은 정렬 비교자를 공유한다. 뷰마다 정렬을 다시 구현하지 않는다.
function sortedItems(){
  const items = visible().map(c => ({c, d:nextDl(c)}));
  const byDeadline = (a,b) => {
    const A = a.d ? days(a.d.date) : 1e6 + (a.c.start ? until(a.c.start) : 9e4);
    const B = b.d ? days(b.d.date) : 1e6 + (b.c.start ? until(b.c.start) : 9e4);
    return A - B;
  };
  const cmp = {
    start: (a,b) => (a.c.start||"9").localeCompare(b.c.start||"9"),
    tier:  (a,b) => a.c.tier - b.c.tier || byDeadline(a,b),
    field: (a,b) => (FIELD[a.c.field]||"").localeCompare(FIELD[b.c.field]||"") || byDeadline(a,b),
    rank:  (a,b) => (RANKORD[a.c.rank.core] ?? 9) - (RANKORD[b.c.rank.core] ?? 9) || byDeadline(a,b),
    cycle: (a,b) => a.c.typical.meeting_month - b.c.typical.meeting_month || byDeadline(a,b),
    // 규모는 지표가 다르면 비교가 성립하지 않으므로 지표로 먼저 묶고 그 안에서만 큰 순서
    scale: (a,b) => (a.c.scale?0:1) - (b.c.scale?0:1)
                 || (a.c.scale && b.c.scale ? a.c.scale.metric.localeCompare(b.c.scale.metric) : 0)
                 || ((b.c.scale?.value ?? 0) - (a.c.scale?.value ?? 0)),
  }[state.sort] || byDeadline;
  return {items: items.sort(cmp), byDeadline};
}

function renderList(){
  const {items} = sortedItems();
  const bucket = (keyOf, label) => {          // 같은 키끼리 묶되 sortedItems 의 순서를 유지한다
    const m = new Map();
    for (const x of items) (m.get(keyOf(x)) ?? m.set(keyOf(x), []).get(keyOf(x))).push(x);
    return [...m].map(([k, rows]) => [label(k, rows), rows]);
  };
  let groups;
  if (state.sort === "field")      groups = bucket(x => x.c.field, f => FIELD[f] || f);
  else if (state.sort === "tier")  groups = bucket(x => x.c.tier, t => `T${t} — ${["","핵심","인접","참고"][t]}`);
  else if (state.sort === "rank")  groups = bucket(x => x.c.rank.core || "등급 없음",
                                                   k => k === "등급 없음" ? "CORE 등급 미부여" : `CORE ${k}`);
  else if (state.sort === "cycle") groups = bucket(x => x.c.typical.meeting_month, m => `${m}월 개최`);
  else if (state.sort === "scale") groups = bucket(x => x.c.scale?.metric ?? "none",
                    k => k === "none" ? "규모 미상"
                       : `${METRIC[k]} 규모순 (${k === "submitted" ? "논문 투고 편수" : "참가자 수"})`);
  else if (state.sort === "start") groups = [["개최일 순", items]];
  else groups = [["🔥 2주 내",          items.filter(x => x.d && days(x.d.date) <= 14)],
                 ["다가오는 마감 (3개월)", items.filter(x => x.d && days(x.d.date) > 14 && days(x.d.date) <= 92)],
                 ["그 이후",            items.filter(x => x.d && days(x.d.date) > 92)],
                 ["제출 마감 종료 · 개최 예정", items.filter(x => !x.d && x.c.next)],
                 ["차기 회차 미공지 (전형 시기 표시)", items.filter(x => !x.d && !x.c.next)]];
  const html = groups.filter(([,r]) => r.length)
    .map(([label, rows]) => `<h2 class="grp">${esc(label)}</h2>` + rows.map(x => cardHTML(x.c)).join(""))
    .join("");
  document.getElementById("v-list").innerHTML = html || `<p class="meta">해당 학회 없음</p>`;
}

function renderKanban(){
  const {items} = sortedItems();
  const cols = [
    ["🔥 2주 내",        x => x.d && days(x.d.date) <= 14],
    ["1-3개월",          x => x.d && days(x.d.date) > 14 && days(x.d.date) <= 92],
    ["3개월 이후",       x => x.d && days(x.d.date) > 92],
    ["제출 종료 · 개최 예정", x => !x.d && x.c.next],
    ["차기 미공지",       x => !x.d && !x.c.next],
  ];
  document.querySelector("#v-kb .kb").innerHTML = cols.map(([label, pred]) => {
    const rows = items.filter(pred);
    return `<div class="kbcol">
      <div class="kbhead"><span>${esc(label)}</span><span class="c">${rows.length}</span></div>
      ${rows.map(({c,d}) => {
        const n = d ? days(d.date) : null;
        const est = d && d.status !== "confirmed";
        return `<div class="kbcard" data-id="${c.id}">
          <div class="top"><span class="dd ${d && n<=14?"hot":""}">${d?dday(n):(meetState(c)||"미공지")}</span>
            <span class="nm2">${esc(c.title)}${c.next?" "+c.next:""}</span>
            <span class="chip ${c.group}">${c.group==="ai"?"AI":"뇌"}</span>
            <span class="chip t">T${c.tier}</span>${rankChip(c)}
            ${est?`<span class="chip est">${d.status==="tba"?"미공지":"추정"}</span>`:""}</div>
          <div class="sm">${d?`<b>${fmt(d.date)}</b> ${esc(d.label)}`:(c.next?"제출 마감 종료":"차기 회차 미공지")}</div>
          <div class="sm">${c.next?`📍 ${esc(c.date_text)} · ${esc(c.city)}`:`🔁 ${esc(typicalText(c))}`}</div>
        </div>`;
      }).join("") || `<div class="sm" style="color:var(--faint);padding:2px">없음</div>`}
    </div>`;
  }).join("");
}

function renderTable(){
  const {items} = sortedItems();
  const cols = [["학회","tier"],["CORE","rank"],["분야","field"],["제출 마감","deadline"],["D-day","deadline"],
                ["개최","start"],["전형 주기","cycle"],["장소",null],["규모","scale"],["연계",null]];
  document.querySelector("#v-tbl thead tr").innerHTML =
    cols.map(([t,k]) => `<th class="${k && k===state.sort?"on":""}">${t}</th>`).join("");
  document.querySelector("#v-tbl tbody").innerHTML = items.map(({c,d}) => {
    const n = d ? days(d.date) : null, sc = c.scale, t = c.typical;
    const est = d && d.status !== "confirmed";
    return `<tr data-id="${c.id}">
      <td class="w"><span class="chip ${c.group}">${c.group==="ai"?"AI":"뇌"}</span>
        <b>${esc(c.title)}${c.next?" "+c.next:""}</b> <span class="chip t">T${c.tier}</span></td>
      <td>${esc(c.rank.core || "—")}</td>
      <td>${esc(FIELD[c.field]||c.field)}</td>
      <td class="n">${d?fmt(d.date):"—"} ${est?`<span class="chip est">${d.status==="tba"?"미공지":"추정"}</span>`:""}</td>
      <td class="n" style="${d&&n<=14?"color:var(--urgent)":""}">${d?dday(n):(meetState(c)||"미공지")}</td>
      <td class="n">${c.start?esc(c.start.slice(2).replace(/-/g,".")):"—"}</td>
      <td class="n">${t.deadline_month?t.deadline_month+"월":"?"}→${t.meeting_month}월
        <span style="color:var(--faint)">n=${t.n_meeting}</span></td>
      <td class="w">${esc([c.city,c.country].filter(Boolean).join(", ")) || "—"}</td>
      <td class="n">${sc?`${num(sc.value)} <span style="color:var(--dim)">${METRIC[sc.metric]}</span>`:"—"}</td>
      <td>${c.programs.length?esc(KIND[c.programs[0].kind]||"연계"):"—"}</td>
    </tr>`;
  }).join("");
}

function renderMap(){
  const W = DATA.world.w, H = DATA.world.h;
  const rows = visible();
  // 도시 단위로 묶는다. 같은 도시의 여러 회차·여러 학회가 한 점이 되어야 읽힌다.
  const cities = new Map();
  for (const c of rows){
    const eds = state.mapMode === "all" ? c.editions
              : c.editions.filter(e => e.year === (c.next ?? c.next_year));
    for (const e of eds){
      if (e.lat === null) continue;                      // 온라인 회차 = 좌표 없음
      // 좌표를 소수 1자리(~11km)로 묶는다. "Singapore" 와 "Singapore, Singapore" 처럼
      // 표기만 다른 같은 도시가 지오코더에서 미세하게 다른 좌표로 오는 경우가 있다.
      const k = `${e.lat.toFixed(1)},${e.lon.toFixed(1)}`;
      const g = cities.get(k) ?? cities.set(k, {lat:e.lat, lon:e.lon, place:e.place,
                                               places:new Set(), items:[], groups:new Set()}).get(k);
      g.places.add(e.place);
      if (e.place.length < g.place.length) g.place = e.place;   // 가장 짧은 표기를 대표로
      g.items.push({title:c.title, year:e.year, id:c.id, group:c.group});
      g.groups.add(c.group);
    }
  }
  const list = [...cities.values()].sort((a,b) => b.items.length - a.items.length);
  const x = lon => (lon + 180) * W / 360, y = lat => (90 - lat) * H / 180;
  const pts = list.map(g => {
    const n = g.items.length, r = Math.min(11, 3.2 + Math.sqrt(n) * 1.9);
    const cls = g.groups.size > 1 ? "mixed" : [...g.groups][0];
    // 라벨은 밀도에 따라 줄인다. 유럽처럼 점이 몰린 곳에서 전부 찍으면 서로 겹쳐 못 읽는다.
    const minN = state.mapMode === "all" ? 3 : 1;
    const label = n >= minN ? g.place.split(",")[0] : "";
    return `<g class="pt ${cls}" data-city="${esc(g.place)}">
      <title>${esc(g.place)} — ${g.items.map(i => i.title+" "+i.year).join(", ")}</title>
      <circle cx="${x(g.lon).toFixed(1)}" cy="${y(g.lat).toFixed(1)}" r="${r.toFixed(1)}"></circle>
      ${label ? `<text x="${x(g.lon).toFixed(1)}" y="${(y(g.lat)-r-3).toFixed(1)}"
        text-anchor="middle">${esc(label)}</text>` : ""}</g>`;
  }).join("");
  document.querySelector("#v-map .mapwrap").innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="학회 개최지 세계 지도">
      <path class="land" d="${DATA.world.paths.join(" ")}"></path>${pts}</svg>`;
  document.querySelector("#v-map .citylist").innerHTML = list.map(g => `
    <div class="cityrow" data-city="${esc(g.place)}">
      <div class="c">${esc(g.place)} <span style="color:var(--faint)">${g.items.length}</span></div>
      <div class="l">${g.items.sort((a,b) => b.year - a.year)
        .map(i => `<span style="color:var(--${i.group})">${esc(i.title)}</span> ${i.year}`).join(" · ")}</div>
    </div>`).join("") || `<p class="meta">표시할 개최지 없음</p>`;
}

function renderCycle(){
  // 전형 시기(과거 회차에서 유도)로 그린다. 차기 회차가 없는 학회도 자리를 갖는다.
  const rows = visible().slice().sort((a,b) =>
    a.typical.meeting_month - b.typical.meeting_month || a.title.localeCompare(b.title));
  document.querySelector("#v-cyc thead tr").innerHTML =
    `<th class="nm">학회</th>` + MONTHS.map(m => `<th>${m}</th>`).join("");
  document.querySelector("#v-cyc tbody").innerHTML = rows.map(c => {
    const dm = c.typical.deadline_month, mm = c.typical.meeting_month;
    const marks = dm ? [dm, mm] : [mm];
    const lo = Math.min(...marks), hi = Math.max(...marks);
    const cells = MONTHS.map((_,i) => {
      const m = i+1, line = (m > lo && m < hi) ? `<span class="span"></span>` : "";
      if (m === mm) return `<td class="cell">${line}<span class="mk">■</span></td>`;
      if (m === dm) return `<td class="cell">${line}<span class="mk dl ${c.typical.n_deadline<2?"est":""}">●</span></td>`;
      return `<td class="cell">${line}</td>`;
    }).join("");
    return `<tr class="g-${c.group}" data-id="${c.id}"><td class="nm"><span class="t">${esc(c.title)}</span></td>${cells}</tr>`;
  }).join("");
}

/* 추세 차트: 연도 사이 간격이 들쭉날쭉하므로 시간축이 아니라 이산 범주로 그린다.
   있는 해만 막대로 세우고, 없는 해를 보간하지 않는다. */
function trendSVG(hist){
  const W = 400, H = 130, TOP = 16, BASE = 88, BAND = BASE - TOP;
  const n = hist.length, cw = W/n, max = Math.max(...hist.map(h => h.submitted));
  const g = hist.map((h,i) => {
    const bh = Math.max(3, Math.round(h.submitted/max*BAND));
    const x = i*cw + cw*0.2, w = cw*0.6, y = BASE - bh, cx = i*cw + cw/2;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${bh}"
              fill="var(--ai)" rx="2"></rect>
            <text x="${cx.toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="10"
              font-weight="600" fill="var(--fg)">${num(h.submitted)}</text>
            <text x="${cx.toFixed(1)}" y="${BASE+13}" text-anchor="middle" font-size="10"
              fill="var(--neuro)">${(h.rate*100).toFixed(1)}%</text>
            <text x="${cx.toFixed(1)}" y="${BASE+26}" text-anchor="middle" font-size="10"
              fill="var(--dim)">${h.year}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="height:auto;display:block" role="img"
      aria-label="연도별 투고 편수와 채택률">
      <line x1="0" y1="${BASE}" x2="${W}" y2="${BASE}" stroke="var(--line)" stroke-width="1"></line>
      ${g}</svg>
    <p class="note">막대 = 투고 편수 · 주황 = 채택률. 출처가 연도마다 다르고, 빠진 해는
    데이터가 없는 것이지 0 이 아니다. 연도 간격이 일정하지 않으므로 시간축이 아니라 나열이다.</p>`;
}

/* ── 캘린더 (.ics) ───────────────────────────────────────────────────────────
   빌드가 만드는 구독 피드(deadlines.ics)와 별개로, 고른 학회만 즉석으로 뽑는 경로.
   구독은 "전부 상시", 이건 "관심 있는 것만 지금". 둘 다 필요하다. */
const icsEsc = t => String(t ?? "").replace(/\\/g,"\\\\").replace(/;/g,"\;")
                                  .replace(/,/g,"\\,").replace(/\n/g,"\\n");
const plusDay = iso => { const d = new Date(iso+"T00:00:00"); d.setDate(d.getDate()+1);
  return d.toISOString().slice(0,10).replace(/-/g,""); };
const icsFold = l => {                    // RFC 5545 = 75옥텟. 한글은 3바이트라 금방 넘는다
  const b = new TextEncoder().encode(l);
  if (b.length <= 73) return l;
  const out = []; let cur = b;
  while (cur.length > 73){
    let cut = 73; while (cut > 0 && (cur[cut] & 0xC0) === 0x80) cut--;
    out.push(new TextDecoder().decode(cur.slice(0,cut)));
    cur = new Uint8Array([32, ...cur.slice(cut)]);
  }
  out.push(new TextDecoder().decode(cur));
  return out.join("\r\n");
};
function buildICS(list){
  const stamp = new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//conf-radar//KR","CALSCALE:GREGORIAN",
             "METHOD:PUBLISH","X-WR-CALNAME:학회 레이더 (선택)"];
  for (const c of list){
    for (const d of c.deadlines){
      if (!SUBMIT.has(d.type)) continue;
      const tag = d.status === "confirmed" ? "" : (d.status === "tba" ? " (미공지)" : " (추정)");
      L.push("BEGIN:VEVENT", `UID:${c.id}-${d.type}-${d.date}@conf-radar`, `DTSTAMP:${stamp}`,
        `DTSTART;VALUE=DATE:${d.date.replace(/-/g,"")}`, `DTEND;VALUE=DATE:${plusDay(d.date)}`,
        `SUMMARY:🔴 ${icsEsc(c.title)} 마감${icsEsc(tag)}`,
        `DESCRIPTION:${icsEsc(d.label)} · ${icsEsc(c.date_text)} ${icsEsc(c.city)}`,
        `URL:${c.link}`, "TRANSP:TRANSPARENT",
        "BEGIN:VALARM","TRIGGER:-P7D","ACTION:DISPLAY",
        `DESCRIPTION:${icsEsc(c.title)} 마감 1주 전`,"END:VALARM","END:VEVENT");
    }
    if (c.start && c.end)
      L.push("BEGIN:VEVENT", `UID:${c.id}-meeting@conf-radar`, `DTSTAMP:${stamp}`,
        `DTSTART;VALUE=DATE:${c.start.replace(/-/g,"")}`, `DTEND;VALUE=DATE:${plusDay(c.end)}`,
        `SUMMARY:📍 ${icsEsc(c.title)} ${c.next ?? ""}`,
        `LOCATION:${icsEsc(c.venue || c.city)}`, `URL:${c.link}`, "TRANSP:TRANSPARENT","END:VEVENT");
  }
  L.push("END:VCALENDAR");
  return L.map(icsFold).join("\r\n") + "\r\n";
}
// 아이폰은 data: URL 을 캘린더로 넘긴다. <a download> 는 홈화면 앱 모드에서 잘 안 먹는다.
function openICS(list, name){
  if (!list.length) return alert("선택된 학회가 없다");
  const txt = buildICS(list);
  const a = document.createElement("a");
  a.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(txt);
  a.download = name + ".ics"; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
}
